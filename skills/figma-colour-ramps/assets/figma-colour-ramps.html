:root{
  color-scheme: light;
  --bg:#EEEEEE;
  --panel:#FFFFFF;
  --ink:#1B1B1B;
  --ink-2:#3A3A3A;
  --ink-3:#4F4F4F;
  --line:#D7D7D7;
  --line-2:#E4E4E4;
  --panel-line:#A9A9A9;
  --accent:#111113;
  --ok:#1F8A4C;
  --warn:#B4690E;
  --bad:#C22B2B;
  --r-s:8px; --r-m:8px; --r-l:16px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;padding:14px;min-height:100vh;align-items:start}
@media (max-width:1080px){.app{grid-template-columns:1fr}}
.col-left{display:flex;flex-direction:column;gap:12px;position:sticky;top:14px;min-height:calc(100vh - 28px)}
@media (max-width:1080px){.col-left{position:static;min-height:0}}
/* pushed to the bottom of the screen while the column is short, and
   carried down by the interface once it grows past one screen */
.col-foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.bug-note{margin:0;padding:0 8px;font-size:11px;line-height:1.4;color:#696969}
.bug-note a{color:#696969;text-decoration:underline;text-underline-offset:2px}
.bug-note a:hover{color:var(--ink)}
.coffee{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:4px 8px;border-radius:8px;
  font-size:11px;font-weight:500;color:#696969;text-decoration:none}
.coffee:hover{color:var(--ink);background:#E4E4E4}
.coffee svg{opacity:.9;flex:none}
.help-link{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;
  font-size:12px;font-weight:500;color:#696969}
.help-link:hover{color:var(--ink);background:#E4E4E4}
.help-link svg{opacity:.9}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-title{margin:0;font-size:14px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#1B1B1B;
  display:flex;align-items:center;gap:7px}
.eyebrow{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- controls ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.lbl{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.inp{
  width:100%;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:8px;
  background:#fff;outline:none;transition:border-color .12s,box-shadow .12s;
}
.inp:focus{border-color:#BDBDC4;box-shadow:0 0 0 3px rgba(17,17,19,.06)}
.inp.mono{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238E8E96' stroke-width='1.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:24px}
.btn{
  height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn:hover{background:#FAFAFB;border-color:#DCDCE1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2A2A2E}
.btn.block{width:100%}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn.icon{width:26px;height:26px;padding:0;border-radius:7px;color:var(--ink-3)}
.btn.icon:hover{color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#F4F4F6;border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hint{font-size:11px;color:var(--ink-3);line-height:1.4}
.divider{height:1px;background:var(--line-2);margin:12px 0}

/* segmented */
.seg{display:inline-flex;background:#E4E4E4;border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;height:26px;padding:0 10px;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* swatch input */
.key-row{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.key-row select{width:74px;flex:none}
.swatch-btn{
  position:relative;width:32px;height:32px;flex:none;border-radius:var(--r-s);
  border:1px solid rgba(0,0,0,.12);overflow:hidden;padding:0;background:#fff;
}
.swatch-btn input[type=color]{position:absolute;inset:-6px;width:150%;height:150%;border:0;padding:0;cursor:pointer;background:transparent}
.chk{background-image:linear-gradient(45deg,#e6e6e9 25%,transparent 25%),linear-gradient(-45deg,#e6e6e9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e6e9 75%),linear-gradient(-45deg,transparent 75%,#e6e6e9 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}

/* slider — small (builder) */
.slider{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .val{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:var(--track,#E7E7EA);border:1px solid rgba(0,0,0,.06)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:1px solid #C2C2CA;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--track,#E7E7EA);border:1px solid rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #C2C2CA;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* slider — large (tone editor), gradient bar with a ring handle */
.slider-lg{margin-bottom:14px}
.slider-lg .top{margin-bottom:6px}
.slider-lg .lbl{font-size:10.5px}
.slider-lg .val{font-size:12.5px;color:var(--ink)}
.slider-lg input[type=range]{height:34px}
.slider-lg input[type=range]::-webkit-slider-runnable-track{height:34px;border-radius:10px;background:var(--track,#E7E7EA);border:1px solid rgba(0,0,0,.12)}
.slider-lg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:6px;border-radius:50%;background:transparent;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.3)}
.slider-lg input[type=range]::-moz-range-track{height:34px;border-radius:10px;background:var(--track,#E7E7EA);border:1px solid rgba(0,0,0,.12)}
.slider-lg input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:transparent;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}

.list-empty{padding:16px 4px;text-align:center;color:var(--ink-3);font-size:11.5px;line-height:1.55;
  border:1px dashed var(--line);border-radius:8px}

/* ---------- inner panels: white, no outline ---------- */
.card{background:#FFFFFF;border:1px solid transparent;border-radius:var(--r-l);padding:16px}
.card.outer{background:transparent;border-color:var(--panel-line);padding:16px 8px 8px}
.card.tight{background:#FFFFFF;border-color:transparent;padding:16px}

/* ---------- collapsible section, same feel as Create ---------- */
.fold-card{padding:0}
.fold > summary{list-style:none;cursor:pointer;user-select:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary.hd{padding:16px 16px 0}
.fold > summary .card-title .hint{font-weight:400}
.fold:not([open]) > summary.hd{padding-bottom:16px}
.fold > summary .tw{transition:transform .18s ease}
.fold[open] > summary .tw{transform:rotate(180deg)}
.fold-body{padding:12px 16px 16px}

/* ---------- charts sit flush inside their panel ---------- */
.chart-box{border:0;border-radius:0;padding:0;background:transparent}
.curve-frame{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.curve-frame .chart-vals.steps{margin:0;padding:2px 0 8px}
.chart-name{display:inline-flex;align-items:center;gap:6px}
.info-dot{width:15px;height:15px;flex:none;padding:0;border:1px solid var(--line);border-radius:50%;
  background:#fff;color:var(--ink-2);font-size:9.5px;font-weight:600;font-style:normal;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans)}
.info-dot:hover{border-color:var(--ink);color:var(--ink)}
.info-pop{position:fixed;z-index:95;width:300px;background:#fff;border:1px solid var(--line);border-radius:8px;
  box-shadow:0 10px 32px rgba(0,0,0,.16);padding:12px}
.info-pop b{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink)}
.info-pop p{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-2)}

.clear-all{border:0;background:transparent;padding:2px 4px;border-radius:6px;font-size:11.5px;font-weight:500;
  color:#696969;letter-spacing:.01em}
.clear-all:hover{color:var(--ink);background:#E4E4E4}

/* ---------- help ---------- */
.help-wrap{position:fixed;inset:0;z-index:140;background:rgba(17,17,19,.4);display:flex;
  align-items:center;justify-content:center;padding:20px}
.help-box{background:var(--panel);border-radius:var(--r-l);width:min(1060px,100%);height:min(88vh,900px);
  display:flex;flex-direction:column;overflow:hidden}
.help-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--panel-line);flex:none}
.help-hd h3{margin:0;font-size:15px;font-weight:600}
.help-body{flex:1;display:flex;min-height:0}
/* the contents stand still; only the prose moves */
.help-nav{flex:none;width:236px;border-right:1px solid var(--line);padding:14px 10px 14px 14px;
  overflow-y:auto;background:#FBFBFC}
.help-nav a{display:block;padding:5px 8px;border-radius:7px;font-size:12px;line-height:1.35;
  color:var(--ink-2);text-decoration:none;cursor:pointer}
.help-nav a:hover{background:#EFEFF1;color:var(--ink)}
.help-nav a.on{background:var(--ink);color:#fff;font-weight:500}
.help-nav a.sub{margin-left:10px;font-size:11.5px;color:#5F5F5F}
.help-nav a.sub.on{color:#fff}
.help-nav .help-grp{margin:12px 0 4px;padding:0 8px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#747474}
.help-nav .help-grp:first-child{margin-top:0}
.help-doc{flex:1;overflow-y:auto;padding:20px 28px 60vh;min-width:0;scroll-behavior:smooth}
.help-doc h2{margin:26px 0 8px;font-size:16px;font-weight:600;letter-spacing:-.01em;scroll-margin-top:14px}
.help-doc h2:first-child{margin-top:0}
.help-doc h3{margin:18px 0 6px;font-size:13px;font-weight:600;scroll-margin-top:14px}
.help-doc p{margin:0 0 9px;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:64ch}
.help-doc ul,.help-doc ol{margin:0 0 10px;padding-left:18px;max-width:64ch}
.help-doc li{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-bottom:4px}
.help-doc b{color:var(--ink);font-weight:600}
.help-doc .lead{font-size:13px;color:var(--ink)}
.help-doc .note{margin:10px 0;padding:10px 12px;border-left:2px solid var(--ink);background:#F6F6F7;
  border-radius:0 var(--r-m) var(--r-m) 0}
.help-doc .note p:last-child{margin-bottom:0}
.help-doc .note.warm{border-left-color:#8C520A;background:#FCF3E3}
.help-doc .steps{counter-reset:hs;list-style:none;padding-left:0}
.help-doc .steps li{counter-increment:hs;position:relative;padding-left:26px;margin-bottom:7px}
.help-doc .steps li::before{content:counter(hs);position:absolute;left:0;top:1px;width:18px;height:18px;
  border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.help-doc dl{margin:0 0 10px;max-width:64ch}
.help-doc dt{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:8px}
.help-doc dd{margin:2px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
@media (max-width:820px){.help-nav{display:none}}

/* ---------- create panel ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 8px 0;cursor:pointer;user-select:none}
.tw{width:24px;height:24px;margin:-5px 0;flex:none;border:0;background:transparent;border-radius:6px;color:#585858;
  display:flex;align-items:center;justify-content:center;transition:transform .18s ease,background .12s,color .12s}
.hd:hover .tw{background:#E4E4E4;color:#1B1B1B}
.tw.up{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.body.open{grid-template-rows:1fr}
.body > div{overflow:hidden}
.body-pad{padding:12px 8px 8px}
#createCard.collapsed .hd{padding-bottom:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tile{background:#FFFFFF;border:1px solid transparent;border-radius:8px;padding:15px 8px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .12s,box-shadow .12s}
.tile svg{color:#7C7C7C}
.tile span{font-size:12px;line-height:1.3;color:#484848}
.tile:hover{border-color:#D7D7D7;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tile:active{border-color:#D7D7D7;box-shadow:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* ---------- palette list ---------- */
.pal-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pal-item{display:flex;align-items:stretch;cursor:pointer;position:relative;background:#fff;isolation:isolate}
.pal-item + .pal-item{border-top:1px solid var(--line-2)}
.pal-item .nm{flex:none;width:110px;display:flex;align-items:center;gap:3px;padding:0 6px 0 10px;min-width:0}
.pal-item .nm b{font-weight:600;font-size:12.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chev{width:20px;height:20px;flex:none;padding:0;border:0;border-radius:5px;background:transparent;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;transition:transform .15s,background .12s,color .12s}
.chev:hover{background:#EFEFF2;color:var(--ink)}
.pal-item.editing .chev{transform:rotate(180deg);background:var(--ink);color:#fff}
.pal-item.editing{background:#FAFAFB}
.edit-slot,.new-slot{border-top:1px solid var(--line-2);background:#FAFAFB;padding:12px;cursor:default}
.new-slot{border:1px solid var(--line);border-radius:var(--r-m);background:#FAFAFB;margin:10px 0 0}
.builder .divider{margin:11px 0}
.builder summary::-webkit-details-marker{display:none}
.pal-item.active{z-index:2}
.pal-item.active::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--ink);border-radius:2px;pointer-events:none}
.pal-item.first.active::after{border-radius:7px 7px 2px 2px}
.pal-item.last.active::after{border-radius:2px 2px 7px 7px}
.pal-item.first.last.active::after{border-radius:7px}
.pal-item:hover .nm b{color:#000}
.strip{display:flex;flex:1;height:36px;min-width:0}
.strip i{flex:1 1 0;min-width:0}
.pal-actions{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;gap:3px;opacity:0;transition:opacity .12s;z-index:3}
.pal-item:hover .pal-actions{opacity:1}
.pal-actions button{width:24px;height:24px;padding:0;border-radius:6px;border:1px solid rgba(0,0,0,.10);background:rgba(255,255,255,.94);color:#111;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.pal-actions button:hover{background:#fff}

/* ---------- right side ---------- */
.tabs{display:flex;gap:2px;background:#E4E4E4;padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;border-radius:6px;height:28px;padding:0 12px;font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* 11-column helper used by the contrast readouts and chart labels */
.grid11{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.step-lab{font-size:10px;font-weight:600;color:var(--ink-3);text-align:center;letter-spacing:.01em}

/* in-app colour picker — always HEX-first */
.cp{display:flex;gap:12px;flex-wrap:wrap}
.popover .cp{flex-direction:column;gap:10px}
.popover .cp-sv{width:100%;height:150px}
.popover .cp-right{min-width:0;width:100%}
.cp-sv{position:relative;width:212px;height:132px;border-radius:9px;border:1px solid rgba(0,0,0,.12);cursor:crosshair;flex:none;touch-action:none}
.cp-sv .knob{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
.cp-right{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.cp-hex{display:flex;gap:6px;align-items:center}
.cp-hex .tag{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);border:1px solid var(--line);border-radius:7px;height:34px;display:flex;align-items:center;padding:0 9px;background:#fff}
.cp-sw{width:34px;height:34px;border-radius:7px;border:1px solid rgba(0,0,0,.14);flex:none}

/* the ramp itself — one continuous, gapless bar */
.ramp{display:flex;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.10);isolation:isolate}
.tone{flex:1 1 0;min-width:0;height:88px;position:relative;border:0;padding:0;background:transparent;display:block;text-align:left}
.tone .lab{position:absolute;top:8px;left:9px;font-size:11px;font-weight:600;letter-spacing:-.01em}
.tone .hx{position:absolute;bottom:8px;left:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:-.03em;opacity:.92}
.tone.sel{z-index:2}
.tone.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px rgba(0,0,0,.55);pointer-events:none}
.tone:not(.sel):hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);pointer-events:none}
.dot{position:absolute;top:9px;right:8px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.pin{position:absolute;top:26px;left:9px;font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:1px 4px;border-radius:4px;background:rgba(255,255,255,.92);color:#111}

table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
table.grid th{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:0 0 7px}
table.grid th.left,table.grid td.left{text-align:left}
table.grid td{padding:2px}
.cell{border-radius:6px;padding:5px 2px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:-.02em}

/* ---------- interactive perceptual curves ---------- */
.charts{display:flex;flex-direction:column;gap:16px}
.chart-box h4{margin:0 0 2px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.chart-box h4 em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--ink-3)}
.chart-vals{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px;margin:8px 0 4px}
.chart-vals span{font-family:var(--mono);font-size:10px;color:var(--ink-2);text-align:center;letter-spacing:-.02em}
.curve{position:relative;height:190px;border:0;background:transparent;touch-action:none;overflow:visible;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.curve svg{position:absolute;inset:0;width:100%;height:100%}
.curve-pt{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.22);
  cursor:ns-resize;touch-action:none;z-index:2}
.curve-pt:hover,.curve-pt.on{width:26px;height:26px;margin:-13px 0 0 -13px;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);z-index:3}
.curve-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(11,1fr);pointer-events:none}
.curve-cols i{border-right:1px dashed #EDEDF0}
.curve-cols i:last-child{border-right:0}

/* ---------- sticky ramp + popover ---------- */
.fig-mark{display:inline-flex;align-items:center;gap:4px;flex:none;color:#4F4F4F}
.fig-mark svg{width:11px;height:11px}
#stageTitle .fig-mark svg{width:13px;height:13px}
.title-text{font-size:15px;font-weight:600;letter-spacing:-.01em}
.pen{width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:5px}
.pen:hover{background:#F1F1F3;color:var(--ink)}
#stageTitle{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.title-row{display:flex;align-items:center;gap:6px;min-width:0}
/* a ramp that came from Figma keeps its old name in sight, because that
   name is what a write-back has to look for in the file */
.title-was{font-size:11px;font-weight:400;letter-spacing:0;line-height:1.35;color:#6B6B6B;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.title-was b{font-weight:500;color:var(--ink-3)}
.ren-dot{flex:none;width:6px;height:6px;border-radius:50%;background:#178C4E;display:inline-block}
.title-inp{height:30px;width:190px;font-size:13.5px;font-weight:600}
.stage-sticky{position:sticky;top:0;z-index:6;background:var(--bg);padding:2px 0 10px;margin-bottom:2px}
.stage-sticky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(#EEEEEE,rgba(238,238,238,0));pointer-events:none}
.pop-backdrop{position:fixed;inset:0;z-index:80}
.popover{position:fixed;z-index:81;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);padding:14px;width:300px}
.popover .pop-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.popover .pop-hd b{font-size:12.5px;font-weight:600}

.badge{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.badge.ok{background:#E7F5EC;color:#155D33}
.badge.warn{background:#FCF1E1;color:#764509}
.badge.bad{background:#FBEAEA;color:#932121}
.badge.neutral{background:#F1F1F3;color:var(--ink-2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;color:var(--ink-3);gap:8px}
.empty h3{margin:0;font-size:14px;color:var(--ink);font-weight:600}

pre.code{background:#1B1B1B;color:#E6E6EA;border-radius:8px;padding:12px;overflow:auto;max-height:340px;font-family:var(--mono);font-size:11px;line-height:1.55;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#111113;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}

/* editor */
.editor{border:0;border-radius:8px;padding:16px;background:#fff}
.split{display:flex;height:108px;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.10)}
.split .half{flex:1 1 0;min-width:0;position:relative;padding:10px;cursor:default;border:0;background:transparent;text-align:left;display:block}
.split .half.orig{cursor:pointer}
.split .half.orig:hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}
.split .cap{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.split .hexv{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.split .cr{position:absolute;left:10px;bottom:9px;font-family:var(--mono);font-size:10px;opacity:.8}
.split .save{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.95);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.split .save:hover{background:#fff}
.split .save[disabled]{opacity:.35;cursor:default;box-shadow:none}
.split .hintx{position:absolute;right:10px;bottom:9px;font-size:9.5px;opacity:.7}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.mock{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.mock-hd{padding:8px 12px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center}
.mock-hd span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.scroll-x{overflow-x:auto}

/* ---------- all-palettes grid ---------- */
.pal-grid{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:660px}
.pg-row{display:flex}
.pg-row.head .pg-cells > div{height:auto;padding:0 0 6px;font-size:10px;font-weight:600;color:var(--ink-3);text-align:left;font-family:var(--sans);letter-spacing:.01em}
.pg-row.head{padding:0 1px}
.pg-row.head .pg-name{border:0;background:transparent}
.pg-name{flex:none;width:106px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px;
  background:#fff;border-right:1px solid var(--line-2);overflow:hidden}
.pg-name .pg-nm{font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the Figma name is the write-back handle, so when it no longer matches
   it is worth the second line even in a narrow cell */
.pg-was{display:flex;gap:3px;font-size:10px;font-weight:400;line-height:1.25;color:#6B6B6B;min-width:0}
.pg-was > span{flex:none}
/* long paths get eaten from the left: the tail is the part that identifies the ramp */
.pg-was > bdi{direction:rtl;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-row + .pg-row .pg-name{border-top:1px solid var(--line-2)}
.pg-cells{flex:1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));min-width:0}
.pg-cell{height:64px;padding:7px 8px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:-.03em;cursor:pointer;position:relative;overflow:hidden}
.pg-cell:hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}

/* ---------- export ---------- */
.ex-panel{border:0;border-radius:16px;padding:16px;margin-top:0;background:#fff}
.ex-step{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;margin-bottom:10px}
.ex-step + .ex-step{margin-top:0}
.ex-step h5{margin:0 0 3px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.ex-num{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.ex-step[data-done] .ex-num{background:var(--ok)}
.ex-step[data-off]{opacity:.5;pointer-events:none}
.lock-note{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);background:#F1F1F3;border-radius:20px;padding:3px 9px}
.inp:disabled,.btn:disabled{cursor:not-allowed;background:#F6F6F8;color:var(--ink-3);border-color:var(--line-2)}
.btn.primary:disabled{background:#C9C9D0;border-color:#C9C9D0;color:#fff}
.status{border-radius:9px;padding:9px 11px;font-size:11.5px;margin-top:9px;line-height:1.5}
.status.ok{background:#EAF6EE;color:#125D35;border:1px solid #CDE8D8}
.status.warn{background:#FCF3E3;color:#784609;border:1px solid #F0E0C2}
.status.bad{background:#FBEBEB;color:#96201F;border:1px solid #F0CFCF}
.status.info{background:#E4E4E4;color:var(--ink-2);border:1px solid var(--line)}
.status ul{margin:6px 0 0;padding-left:16px}
.status li{margin:2px 0}
.ok-tick{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600;font-size:12px}
.wrt-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-top:1px solid var(--line-2)}
.wrt-row:first-of-type{border-top:0}
.wrt-row .mini{display:flex;height:16px;width:88px;border-radius:4px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.08)}
.wrt-row .mini i{flex:1}
.wrt-name{font-weight:600;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrt-row.off .wrt-name,.wrt-row.off .mini{opacity:.45}
.wrt-row.off .wrt-name{font-weight:500}
.wrt-was{font-weight:400;color:#747474}
.wrt-cen{flex:none;font-size:10.5px;font-weight:500;color:#8C520A;background:#FCF3E3;
  border-radius:5px;padding:1px 6px;cursor:help}
.tag-new{background:#EAF6EE;color:#14663A}
.tag-upd{background:#EAF0FB;color:#1E4FA3}
.tag-ren{background:#FCF3E3;color:#8C520A}
.tag-skip{background:#F1F1F3;color:var(--ink-3)}
.warn-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.warn-item{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 11px}
.warn-item.off{opacity:.45}
.warn-hd{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.warn-hd input{width:14px;height:14px;accent-color:var(--ink);margin:0;flex:none;cursor:pointer}
.warn-hd .mini{display:flex;height:15px;width:80px;border-radius:4px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.08)}
.warn-hd .mini i{flex:1}
.warn-nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.warn-nm b{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.warn-notes{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.warn-notes li{font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.warn-k{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:5px;background:#F1F1F3;
  color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:.02em;vertical-align:1px}
.conf-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.conf-side{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.conf-side b{font-size:12.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conf-side.there b{font-weight:500;color:var(--ink-2)}
.conf-n{font-size:10.5px;color:#6B6B6B}
.conf-arr{flex:none;display:inline-flex;color:#8A8A8A}
.conf-arr svg{width:15px;height:15px}
.conf-why{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.conf-name{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.conf-item.skipping .conf-hd{opacity:.5}
.where{margin-top:10px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-m);background:#FBFBFC}
.where-hd{margin-bottom:8px}
.where-row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.where-f{flex:1 1 168px;min-width:0;display:flex;flex-direction:column;gap:4px}
.where-f.mode{flex:0 1 130px}
.where-t{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.where-opt{font-weight:500;letter-spacing:0;text-transform:none;color:#747474}
.where-out{margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.where-out code{font-size:11px}
.where-new{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8C520A;
  background:#FCF3E3;border-radius:4px;padding:1px 4px}
.where-warn{color:#96341F;font-weight:500}
.tag-fig{background:#F0EEF9;color:#463A8C}
.tag-fig svg{width:10px;height:10px}
.wrt-tags{display:flex;align-items:center;gap:5px;flex:none}
/* the in-place switch reads as one control: box, label, and the note behind the i */
.ov{display:flex;align-items:center;gap:5px;flex:none;font-size:11px;color:var(--ink-2);cursor:pointer;
  padding:2px 6px;border-radius:7px;white-space:nowrap}
.ov:hover{background:#F2F2F4}
.ov input{width:13px;height:13px;accent-color:var(--ink);margin:0;cursor:pointer}
.ov.off{color:#8A8A8A;cursor:default}
.ov.off:hover{background:transparent}
.ov.off input{cursor:not-allowed}
.ov-i{display:inline-flex;color:#747474;cursor:help}
.ov-i svg{width:13px;height:13px}
.ov-i:hover,.ov-i:focus-visible{color:var(--ink)}

/* ---------- key colour extractor ---------- */
.xt-modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.xt-body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:300px minmax(0,1fr);
  gap:14px;padding:14px;align-items:start}
@media (max-width:900px){.xt-body{grid-template-columns:1fr}}
.xt-left{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
@media (max-width:900px){.xt-left{position:static}}
.xt-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.src-hd{display:flex;align-items:center;gap:10px}
.src-thumb{width:64px;height:64px;flex:none;border-radius:9px;overflow:hidden;border:1px solid var(--line);
  background:#F7F7F8;cursor:pointer;display:flex;align-items:center;justify-content:center}
.src-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.src-thumb:hover{border-color:#B9B9C1}
.src-meta{flex:1;min-width:0}
.src-name{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:28px;height:28px;flex:none;padding:0;border-radius:8px;font-size:15px;line-height:1;color:var(--ink-2)}
.pix{image-rendering:pixelated;display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#F7F7F8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.opt-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:12px}
.opt-row input{margin-top:2px;flex:none}
.opt-row span b{display:block;font-weight:600}
.opt-row span em{font-style:normal;color:var(--ink-3);font-size:11px}
.scat-wrap{position:relative;height:320px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.scat-wrap:active{cursor:grabbing}
.scat-canvas{position:absolute;inset:0;display:block}
.scat-layer{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:rgba(0,0,0,.55);cursor:grab;pointer-events:auto;touch-action:none;z-index:2}
.mk:hover{width:32px;height:32px;margin:-16px 0 0 -16px;z-index:4}
.mk.on{cursor:grabbing;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:5}
.mk.manual{border-style:dashed}
.mk.neutral{border-color:#E7E7EA}
.mk.off{opacity:.3;border-style:dotted}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sw.off{opacity:.55}
.sw.off .chip{filter:saturate(.45)}
.sw .chip{height:62px;position:relative;display:flex;align-items:flex-end;padding:7px 9px}
.sw .chip b{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:-.02em}
.sw .chip .pick{position:absolute;top:6px;left:8px;display:flex;align-items:center;gap:6px;cursor:pointer}
.sw .chip .pick input{width:15px;height:15px;margin:0;cursor:pointer;accent-color:currentColor}
.sw .chip .num{font-size:10.5px;font-weight:700;opacity:.85}
.sw .chip .tags{position:absolute;top:6px;right:7px;display:flex;gap:4px}
.sw .chip .tags .badge{background:rgba(255,255,255,.92);color:#111;padding-right:3px}
.ed-close{width:28px;height:28px;flex:none;padding:0;border-radius:8px;font-size:17px;line-height:1;color:var(--ink-2)}
.ed-close:hover{background:#F1F1F3;color:var(--ink)}
.badge .kill{border:0;background:transparent;padding:0 3px;margin-left:1px;font-size:12px;line-height:1;color:inherit;opacity:.55;border-radius:4px}
.badge .kill:hover{opacity:1;background:rgba(0,0,0,.08)}
.sw .step-row{display:flex;align-items:center;gap:6px;padding:8px 9px 0}
.sw .step-row .lbl{flex:1}
.sw select.step{height:28px;width:78px;padding:0 20px 0 6px;border:1px solid var(--line);border-radius:7px;background:#fff;
  font-family:var(--mono);font-size:11.5px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238E8E96' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center}
.sw details{margin:8px 0 0;border-top:1px solid var(--line-2)}
.sw details summary{list-style:none;cursor:pointer;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.sw details summary::-webkit-details-marker{display:none}
.sw details summary .chev{transition:transform .15s;display:inline-flex}
.sw details[open] summary .chev{transform:rotate(180deg)}
.sw details .body{padding:0 9px 9px}
.sw details .body div{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);line-height:1.65}
.sw details .body div span:last-child{font-family:var(--mono);color:var(--ink-2)}
.bar{height:4px;background:#EFEFF2;border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}
.pill{display:inline-flex;background:#E4E4E4;border-radius:8px;padding:2px;gap:2px}
.pill button{border:0;background:transparent;border-radius:7px;height:26px;padding:0 10px;font-size:11.5px;color:var(--ink-2)}
.pill button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stat{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.stat b{color:var(--ink);font-family:var(--mono);font-weight:600}
.sel-count{gap:7px;padding:0 8px 0 10px;height:28px;font-weight:500;color:var(--ink-2)}
.sel-count .sel-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;background:#E4E4E4;color:var(--ink-2);font-size:11px;line-height:1}
.sel-count:hover .sel-x{background:var(--ink);color:#fff}

/* ---------- extractor: headline settings above the fold ---------- */
.xt-main{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.xt-pick{display:flex;flex-direction:column;gap:5px;flex:none;width:180px}
.xt-pick .inp{height:32px}
.xt-main .opt-row{flex:1;min-width:220px;padding:0}
.fold.xt-more{margin-top:12px;border-top:1px solid var(--line-2)}
.fold.xt-more > summary.hd{padding:12px 0 0}
.fold.xt-more:not([open]) > summary.hd{padding-bottom:0}
.fold.xt-more > .fold-body{padding:12px 0 0}

/* ---------- import modal ---------- */
.xt-body{padding:14px}
.im-head{padding:14px 14px 12px;border-bottom:1px solid var(--panel-line);display:flex;
  align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
#imSourceCard .card-title{margin-bottom:8px}
#imSourceCard .seg.block{display:flex;width:100%}
#imSourceCard .seg.block button{flex:1}
#imSourceCard .hint{margin:9px 0 0}
#imSourceCard .inp{margin-top:9px}
#imSourceCard .inp.ta{height:150px;padding:8px 9px;font-family:var(--mono);font-size:11px;resize:vertical}
#imSourceCard .btn.block{margin-top:4px}
#imSourceCard .status{margin-top:9px}

/* ---------- import tree ---------- */
.b-ok{background:#E7F5EC;color:#155D33}
.b-warn{background:#FCF1E1;color:#764509}
.b-info{background:#EAF0FB;color:#17407F}
.tree{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.node{border-top:1px solid var(--line-2)}
.node:first-child{border-top:0}
.node-row{display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:38px}
.node-row:hover{background:#FAFAFB}
.node-row.collection{background:#F7F7F9;font-weight:600}
.node-row.collection:hover{background:#E4E4E4}
.node-row input[type=checkbox]{flex:none;width:15px;height:15px;margin:0;cursor:pointer}
.twist{width:20px;height:20px;flex:none;border:0;background:transparent;border-radius:5px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;transition:transform .14s}
.twist:hover{background:#EDEDF0;color:var(--ink)}
.twist.open{transform:rotate(90deg)}
.twist.leaf{visibility:hidden}
.node-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.node-name .path{color:var(--ink-3);font-weight:400}
.node-meta{display:flex;align-items:center;gap:6px;flex:none}
.kids{display:none}
.kids.open{display:block}
.node-row .strip{display:flex;height:18px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.08);flex:none}
.node-row .strip i{width:13px;height:100%}
.dot-chip{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.hexv{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.node-name.single-row{display:flex;align-items:center;gap:6px;overflow:visible}
.nm-text{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nm-pen{width:20px;height:20px;flex:none;padding:0;border:0;border-radius:5px;background:transparent;color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center}
.nm-pen:hover{background:#EDEDF0;color:var(--ink)}
.nm-input{flex:1;min-width:80px;max-width:200px;height:26px}
.nm-step{width:74px;flex:none;height:26px;padding:0 20px 0 7px;font-family:var(--mono);font-size:11.5px}
.sum-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line-2)}
.sum-row:first-of-type{border-top:0}
.sum-row .strip{display:flex;height:16px;width:88px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.08);flex:none}
.sum-row .strip i{flex:1}
.sum-name{flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp.sm{height:27px;font-size:12px}

/* image drop area inside the new-palette form */
.img-drop{border:2px dashed #D2D2D9;border-radius:11px;padding:14px 12px;text-align:center;color:var(--ink-3);
  background:#FCFCFD;cursor:pointer;transition:border-color .12s,background .12s;font-size:11.5px}
.img-drop:hover,.img-drop.over{border-color:var(--ink);background:#fff;color:var(--ink)}
.img-drop b{display:block;color:var(--ink);font-size:12px;margin-bottom:1px}
.img-ready{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:8px}
.img-ready img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none;border:1px solid var(--line)}
.img-ready .nm{flex:1;min-width:0;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:90;background:rgba(17,17,19,.34);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:560px;max-width:100%;
  max-height:86vh;overflow:auto;padding:18px}
