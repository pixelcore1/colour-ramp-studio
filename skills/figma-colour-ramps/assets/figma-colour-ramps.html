<script>
"use strict";
/* ============================================================
   1. COLOUR SCIENCE  —  sRGB ⇄ linear ⇄ OKLab ⇄ OKLCH
   Matrices: Björn Ottosson, "A perceptual color space for image
   processing" (2020). OKLab is the perceptually uniform space we
   use for every ramp computation, following the same reasoning
   Stripe applied with CIELAB, but without CIELAB's blue hue shift.
   ============================================================ */
const STEPS = [50,100,200,300,400,500,600,700,800,900,950];

function srgbToLinear(c){ return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function linearToSrgb(c){ return c <= 0.0031308 ? c*12.92 : 1.055*Math.pow(c, 1/2.4) - 0.055; }

function rgbToOklab(r,g,b){            // r,g,b in 0..1 (gamma-encoded sRGB)
  const R=srgbToLinear(r), G=srgbToLinear(g), B=srgbToLinear(b);
  const l=Math.cbrt(0.4122214708*R + 0.5363325363*G + 0.0514459929*B);
  const m=Math.cbrt(0.2119034982*R + 0.6806995451*G + 0.1073969566*B);
  const s=Math.cbrt(0.0883024619*R + 0.2817188376*G + 0.6299787005*B);
  return [
    0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
    1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
    0.0259040371*l + 0.7827717662*m - 0.8086757660*s
  ];
}
function oklabToRgb(L,a,b){            // returns gamma-encoded sRGB, may be out of [0,1]
  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l=l_*l_*l_, m=m_*m_*m_, s=s_*s_*s_;
  return [
    linearToSrgb( 4.0767416621*l - 3.3077115913*m + 0.2309699292*s),
    linearToSrgb(-1.2684380046*l + 2.6097574011*m - 0.3413193965*s),
    linearToSrgb(-0.0041960863*l - 0.7034186147*m + 1.7076147010*s)
  ];
}
function oklabToOklch(L,a,b){
  const C = Math.sqrt(a*a + b*b);
  let h = Math.atan2(b,a) * 180/Math.PI;
  if (h < 0) h += 360;
  return [L, C, C < 1e-7 ? 0 : h];
}
function oklchToOklab(L,C,h){
  const r = h*Math.PI/180;
  return [L, C*Math.cos(r), C*Math.sin(r)];
}
function oklchToRgb(L,C,h){ const p = oklchToOklab(L,C,h); return oklabToRgb(p[0],p[1],p[2]); }

function inGamut(rgb, eps){ eps = eps===undefined ? 0.0005 : eps;
  return rgb.every(function(v){ return v >= -eps && v <= 1+eps; }); }

/* Gamut mapping: hold L and h, reduce C until the colour fits sRGB.
   This is the practical answer to Stripe's "impossible colours" —
   there is no such thing as a vivid dark yellow. */
function clampToGamut(L,C,h){
  if (inGamut(oklchToRgb(L,C,h))) return [L,C,h,false];
  let lo=0, hi=C;
  for (let i=0;i<24;i++){
    const mid=(lo+hi)/2;
    if (inGamut(oklchToRgb(L,mid,h))) lo=mid; else hi=mid;
  }
  return [L,lo,h,true];
}
function maxChroma(L,h){
  let lo=0, hi=0.42;
  for (let i=0;i<22;i++){ const mid=(lo+hi)/2; if (inGamut(oklchToRgb(L,mid,h))) lo=mid; else hi=mid; }
  return lo;
}

/* ---- hex helpers ---- */
function clamp01(v){ return v<0?0:v>1?1:v; }
function rgbToHex(rgb){
  return '#' + rgb.map(function(v){
    const n = Math.round(clamp01(v)*255);
    return n.toString(16).padStart(2,'0');
  }).join('').toUpperCase();
}
function hexToRgb(hex){
  let h = String(hex||'').trim().replace(/^#/,'');
  if (/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(function(c){return c+c;}).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
}
function normHex(hex){ const r = hexToRgb(hex); return r ? rgbToHex(r) : null; }
function hexToOklch(hex){ const r = hexToRgb(hex); if(!r) return null;
  const lab = rgbToOklab(r[0],r[1],r[2]); return oklabToOklch(lab[0],lab[1],lab[2]); }
function oklchToHex(L,C,h){ const g = clampToGamut(L,C,h); return rgbToHex(oklchToRgb(g[0],g[1],g[2])); }

/* ---- WCAG 2.1 contrast ---- */
function relLuminance(hex){
  const r = hexToRgb(hex); if(!r) return 0;
  return 0.2126*srgbToLinear(r[0]) + 0.7152*srgbToLinear(r[1]) + 0.0722*srgbToLinear(r[2]);
}
function contrastRatio(a,b){
  const l1 = relLuminance(a), l2 = relLuminance(b);
  const hi = Math.max(l1,l2), lo = Math.min(l1,l2);
  return (hi + 0.05) / (lo + 0.05);
}
function contrastGrade(ratio){
  if (ratio >= 7)   return {label:'AAA', cls:'ok'};
  if (ratio >= 4.5) return {label:'AA',  cls:'ok'};
  if (ratio >= 3)   return {label:'AA+', cls:'warn'};
  return {label:'fail', cls:'bad'};
}
/* readable ink for a background */
function inkOn(hex){
  /* mid tones cannot reach 7:1 against either black or white — that is a
     property of the colour, not a bug — so take the better of the two */
  return contrastRatio(hex,'#FFFFFF') >= contrastRatio(hex,'#111113') ? '#FFFFFF' : '#111113';
}

/* ============================================================
   2. RAMP GENERATION
   Model: "key colour is sacred". The hex you type lands on its
   step untouched; the other ten tones are derived by warping a
   reference perceptual curve so it passes exactly through every
   pinned key.
   ============================================================ */

/* Reference lightness ladder in OKLab L (0..1). Shape is tuned so
   the mid steps land near the WCAG thresholds on white:
   500 ≈ 4.5:1, 400 ≈ 3:1. */
const BASE_L = [0.970,0.932,0.882,0.809,0.707,0.623,0.546,0.488,0.424,0.379,0.282];
/* Reference relative chroma. The ends carry very little chroma
   because the sRGB gamut pinches to a point at white and black,
   and the peak sits just below the middle — the same shape the
   mature systems (Tailwind, Radix) converged on. */
const BASE_C = [0.06,0.13,0.25,0.44,0.69,0.89,1.00,0.98,0.83,0.62,0.39];

function stepIndex(step){ return STEPS.indexOf(Number(step)); }

function shortestHueLerp(h0,h1,t){
  let d = ((h1 - h0 + 540) % 360) - 180;
  return (h0 + d*t + 360) % 360;
}

function defaultOpts(){ return { L50:97.0, L950:26.0, chroma:100, hueL:0, hueD:0 }; }

/* Returns array of 11 objects: {step,hex,L,C,h,clipped,pinned} */
function generateRamp(keys, opts){
  opts = Object.assign(defaultOpts(), opts||{});
  const parsed = keys
    .map(function(k){ const lch = hexToOklch(k.hex); return lch ? {i:stepIndex(k.step), L:lch[0], C:lch[1], h:lch[2], hex:normHex(k.hex)} : null; })
    .filter(function(k){ return k && k.i >= 0; })
    .sort(function(a,b){ return a.i - b.i; });
  if (!parsed.length) return null;

  /* ---- 2.1 lightness: rescale the reference ladder to the chosen
     endpoints, then warp it through every pinned key ---- */
  const top = opts.L50/100, bot = opts.L950/100;
  const span = BASE_L[0] - BASE_L[10];
  const scaled = BASE_L.map(function(v){ return bot + (v - BASE_L[10])/span * (top - bot); });

  const anchors = parsed.map(function(k){ return {i:k.i, L:k.L}; });
  if (anchors[0].i !== 0)  anchors.unshift({i:0,  L: Math.max(scaled[0],  anchors[0].L + 0.02)});
  if (anchors[anchors.length-1].i !== 10) anchors.push({i:10, L: Math.min(scaled[10], anchors[anchors.length-1].L - 0.02)});

  const Ls = new Array(11);
  for (let s=0; s<anchors.length-1; s++){
    const a=anchors[s], b=anchors[s+1];
    const ba=scaled[a.i], bb=scaled[b.i];
    for (let i=a.i; i<=b.i; i++){
      let t;
      if (Math.abs(bb-ba) < 1e-6) t = (b.i===a.i) ? 0 : (i-a.i)/(b.i-a.i);
      else t = (scaled[i]-ba)/(bb-ba);
      Ls[i] = a.L + (b.L - a.L)*t;
    }
  }

  /* ---- 2.2 chroma: reshape the reference profile with the chroma
     control, then normalise so every key keeps its exact chroma ---- */
  const gamma = Math.max(0.18, 2 - opts.chroma/100);
  const prof = BASE_C.map(function(v){ return Math.pow(v, gamma); });
  const kScale = parsed.map(function(k){ return prof[k.i] > 1e-6 ? k.C/prof[k.i] : 0; });
  const Cs = new Array(11);
  for (let i=0;i<11;i++){
    let sc;
    if (i <= parsed[0].i) sc = kScale[0];
    else if (i >= parsed[parsed.length-1].i) sc = kScale[kScale.length-1];
    else {
      let j=0; while (j < parsed.length-1 && parsed[j+1].i < i) j++;
      const a=parsed[j], b=parsed[j+1];
      const t=(i-a.i)/(b.i-a.i);
      sc = kScale[j] + (kScale[j+1]-kScale[j])*t;
    }
    Cs[i] = prof[i]*sc;
  }

  /* ---- 2.3 hue: interpolate between keys, then apply the optional
     temperature shifts outward from the outermost keys ---- */
  const hs = new Array(11);
  const first=parsed[0], last=parsed[parsed.length-1];
  for (let i=0;i<11;i++){
    let h;
    if (i <= first.i) h = first.h;
    else if (i >= last.i) h = last.h;
    else {
      let j=0; while (j < parsed.length-1 && parsed[j+1].i < i) j++;
      const a=parsed[j], b=parsed[j+1];
      h = shortestHueLerp(a.h, b.h, (i-a.i)/(b.i-a.i));
    }
    let off = 0;
    if (i < first.i && first.i > 0) off += opts.hueL * (first.i - i)/first.i;
    if (i > last.i && last.i < 10) off += opts.hueD * (i - last.i)/(10 - last.i);
    hs[i] = (h + off + 720) % 360;
  }

  /* ---- 2.4 resolve to sRGB ---- */
  const pinnedIdx = {}; parsed.forEach(function(k){ pinnedIdx[k.i]=k.hex; });
  return STEPS.map(function(step,i){
    if (pinnedIdx[i] !== undefined){
      const lch = hexToOklch(pinnedIdx[i]);
      return {step:step, hex:pinnedIdx[i], L:lch[0], C:lch[1], h:lch[2], clipped:false, pinned:true};
    }
    const g = clampToGamut(Ls[i], Cs[i], hs[i]);
    /* only report clipping when it is visually meaningful — near
       white and black every hue loses a sliver of chroma and
       flagging that would be noise */
    const lost = Cs[i] - g[1];
    const clipped = g[3] && lost > 0.012 && lost/Math.max(Cs[i],1e-6) > 0.12;
    return {step:step, hex:rgbToHex(oklchToRgb(g[0],g[1],g[2])), L:g[0], C:g[1], h:g[2], clipped:clipped, pinned:false};
  });
}

/* Apply saved per-tone overrides — and the unsaved edit in progress —
   on top of the generated ramp */
function resolveRamp(pal, committed){
  let keys = pal.keys, opts = pal.opts;
  let previewing = false;
  if (!committed && typeof previewSource === 'function'){
    const src = previewSource(pal);
    if (src){ keys = src.keys; opts = src.opts; previewing = true; }
  }
  const base = generateRamp(keys, opts);
  if (!base) return null;
  /* while an editor is staging changes the palette shows the
     result-to-be, without any hand edits a regenerate would clear */
  if (previewing) return base.map(function(t){ return Object.assign({}, t, {previewing:true}); });
  return base.map(function(t){
    const pend = (typeof state!=='undefined' && state.pending && state.pending.palId===pal.id && state.pending.step===t.step)
      ? state.pending.hex : null;
    const ov = pend || (pal.overrides && pal.overrides[t.step]);
    if (!ov) return t;
    const lch = hexToOklch(ov);
    return {step:t.step, hex:normHex(ov), L:lch[0], C:lch[1], h:lch[2], clipped:false,
            pinned:t.pinned, edited:true, unsaved:!!pend};
  });
}

/* ============================================================
   3. STATE
   ============================================================ */
/* Nothing outlives a working session. Reloading the view keeps what
   you are doing, but every fresh launch is a clean slate: the same
   five starter ramps and no Figma file link. Export is how a palette
   is kept for good. */
const SS_KEY = 'figma-colour-ramps/session';
const LEGACY_KEYS = ['colour-ramp-studio/v1', 'colour-ramp-studio/prefs'];

let state = { palettes:[], selected:null, tab:'ramp', editorMode:'controls', selectedTone:null, pending:null,
  curveSnapshot:null, figma:null, shapeOpen:false, renaming:false,
  createOpen:true, autoCollapsed:false, userSetCreate:false, workName:'' };

function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }
/* Anything that came out of a Figma file carries a mark, because the
   link back to those exact variables is what makes a reskin possible. */
const FIGMA_GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M9 3h3v6H9a3 3 0 0 1 0-6z"/><path d="M12 3h3a3 3 0 0 1 0 6h-3z"/><path d="M9 9h3v6H9a3 3 0 0 1 0-6z"/>'
  + '<path d="M12 9h3a3 3 0 1 1-3 3z"/><path d="M9 15h3v3a3 3 0 1 1-3-3z"/></svg>';
function fromFigma(p){ return !!(p && p.source && p.source.kind === 'figma'); }
function figmaWhere(p){
  if (!fromFigma(p)) return '';
  const src = p.source;
  const bits = [src.fileName || 'Figma file', src.collectionName, src.group || src.figmaName].filter(Boolean);
  return bits.join(' · ');
}
/* the full path is what a write-back matches on, so that is what gets shown */
function figmaFullName(p){
  if (!fromFigma(p) || !p.source.figmaName) return '';
  const src = p.source;
  if (p.origin === 'figma-key-colour')
    return src.group ? src.group + '/' + src.figmaName : src.figmaName;
  return src.group || src.figmaName;
}
/* renaming is judged on the leaf, since that is the part this tool writes */
function figmaRenamed(p){
  return fromFigma(p) && !!p.source.figmaName
      && String(p.name || '').trim() !== String(p.source.figmaName).trim();
}
function figmaMark(p, withText){
  const b = el('span','fig-mark' + (withText ? ' with-text' : ''));
  b.innerHTML = FIGMA_GLYPH + (withText ? '<span>From Figma</span>' : '');
  b.title = 'Imported from ' + figmaWhere(p)
    + (figmaRenamed(p)
        ? '\nRenamed here — in the file it is still “' + figmaFullName(p) + '”'
        : (p.source.figmaName ? '\nName kept as “' + p.source.figmaName + '” so a write-back can find it' : ''));
  return b;
}

function save(){
  try {
    sessionStorage.setItem(SS_KEY, JSON.stringify({
      palettes: state.palettes,
      selected: state.selected,
      workName: state.workName || '',
      createOpen: state.createOpen,
      autoCollapsed: state.autoCollapsed,
      userSetCreate: state.userSetCreate,
      figmaUrl: (state.figma && state.figma.url) || ''
    }));
  } catch(e){}
}
function load(){
  /* earlier builds persisted to localStorage, which is exactly what
     made every launch inherit the previous one — clear it for good */
  try { LEGACY_KEYS.forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
  try {
    const raw = sessionStorage.getItem(SS_KEY);
    if (raw){
      const d = JSON.parse(raw);
      if (d && d.figmaUrl) state.pendingFigmaUrl = d.figmaUrl;
      if (d){
        if (d.workName) state.workName = d.workName;
        if (typeof d.createOpen === 'boolean') state.createOpen = d.createOpen;
        if (typeof d.autoCollapsed === 'boolean') state.autoCollapsed = d.autoCollapsed;
        if (typeof d.userSetCreate === 'boolean') state.userSetCreate = d.userSetCreate;
      }
      if (d && Array.isArray(d.palettes) && d.palettes.length){
        state.palettes = d.palettes;
        state.selected = d.selected || null;
        return true;
      }
    }
  } catch(e){}
  return false;
}
function currentPalette(){ return state.palettes.find(function(p){ return p.id===state.selected; }) || null; }
function $(sel){ return document.querySelector(sel); }
/* names come from Figma files and from snapshots on disk, so anything
   that reaches innerHTML goes through here first */
function escHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function el(tag, cls, html){ const n=document.createElement(tag); if(cls) n.className=cls; if(html!==undefined) n.innerHTML=html; return n; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1600); }
function copy(text, msg){
  navigator.clipboard.writeText(text).then(function(){ toast(msg||'Copied'); },
    function(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg||'Copied'); });
}
function slug(s){ return String(s||'colour').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'colour'; }

/* ============================================================
   4. LEFT COLUMN — palette list, inline editor, new-palette form
   Two independent gestures, so one can never quietly wreck the
   other: clicking a palette selects it for the right-hand pane,
   the chevron opens its definition for editing. Nothing is
   committed until "Regenerate ramp" is confirmed.
   ============================================================ */
function defaultDraft(){ return { mode:null, id:null, name:'', keys:[{step:500, hex:'#3B82F6'}], opts:defaultOpts() }; }
let draft = defaultDraft();

function draftDirty(){
  if (draft.mode !== 'edit') return false;
  const p = state.palettes.find(function(x){ return x.id===draft.id; });
  if (!p) return false;
  return JSON.stringify(p.keys) !== JSON.stringify(draft.keys)
      || JSON.stringify(Object.assign(defaultOpts(), p.opts)) !== JSON.stringify(draft.opts);
}
/* the ramp a palette should display right now — the staged one
   while its editor is open and actually changed */
function previewSource(pal){
  if (draft.mode==='edit' && draft.id===pal.id && draftDirty())
    return { keys:draft.keys, opts:draft.opts, overrides:{} };
  return null;
}

function startNew(){
  draft = defaultDraft(); draft.mode='new';
  renderPaletteList();
  setTimeout(function(){ const n=document.getElementById('draftName'); if(n) n.focus(); }, 0);
}
function startEdit(pal){
  draft = { mode:'edit', id:pal.id, name:pal.name,
            keys:JSON.parse(JSON.stringify(pal.keys)), opts:Object.assign(defaultOpts(), pal.opts) };
  renderAll();
}
function closeDraft(){ draft = defaultDraft(); renderAll(); }

function draftValid(){
  const bad = draft.keys.filter(function(k){ return !normHex(k.hex); });
  const seen = {}; let dup = false;
  draft.keys.forEach(function(k){ if (seen[k.step]) dup = true; seen[k.step]=1; });
  if (bad.length) return 'Some key colours are not valid hex.';
  if (dup) return 'Two key colours share the same step.';
  const r = generateRamp(draft.keys, draft.opts);
  if (!r) return 'Add at least one key colour.';
  for (let i=1;i<11;i++) if (r[i].L > r[i-1].L + 1e-4)
    return 'Lightness is not monotonic — a key colour is lighter than the step above it.';
  return null;
}

/* ---------- the form itself ---------- */
function builderForm(){
  const wrap = el('div','builder');

  const hd = el('div','card-hd'); hd.style.marginBottom='10px';
  hd.appendChild(el('div','card-title', draft.mode==='new' ? 'New ramp' : 'Edit ramp'));
  const close = el('button','btn icon','×'); close.title='Close';
  close.onclick = closeDraft;
  hd.appendChild(close);
  wrap.appendChild(hd);

  /* The name field only exists while a palette is being created.
     Once it exists, renaming happens in the right-hand pane and takes
     effect at once — staging a name behind "Regenerate" meant exports
     kept showing the old one, and re-rendering the list on every
     keystroke stole focus out of the field. */
  if (draft.mode==='new'){
    const nameF = el('div','field');
    nameF.appendChild(el('label','lbl','Ramp name'));
    const nameI = el('input','inp'); nameI.id='draftName'; nameI.value = draft.name || '';
    nameI.placeholder = 'e.g. Blue'; nameI.autocomplete='off';
    nameI.oninput = function(){ draft.name = nameI.value; };
    nameF.appendChild(nameI);
    wrap.appendChild(nameF);
  }

  wrap.appendChild(el('div','lbl','Key colours'));
  const keys = el('div'); keys.style.margin='5px 0 0';
  draft.keys.forEach(function(k, idx){
    const row = el('div','key-row');
    const sel = el('select','inp');
    STEPS.forEach(function(s){ const o=el('option',null,String(s)); o.value=s; if(Number(k.step)===s) o.selected=true; sel.appendChild(o); });
    sel.onchange = function(){ k.step = Number(sel.value); refreshDraft(); };

    const hex = el('input','inp mono grow');
    hex.value = k.hex; hex.spellcheck=false; hex.autocomplete='off';
    hex.oninput = function(){
      const n = normHex(hex.value);
      if (n){ k.hex=n; sw.style.background=n; hex.style.borderColor=''; refreshDraft(); }
      else hex.style.borderColor = '#E8B4B4';
    };
    const sw = el('button','swatch-btn');
    sw.style.background = normHex(k.hex) || '#fff';
    sw.title = 'Pick colour';
    sw.onclick = function(){
      openPickerPopup(sw, normHex(k.hex)||'#000000', function(n){
        k.hex=n; hex.value=n; sw.style.background=n; refreshDraft();
      }, 'Key colour · step ' + k.step);
    };
    row.appendChild(sel); row.appendChild(hex); row.appendChild(sw);
    if (draft.keys.length>1){
      const del = el('button','btn icon','&times;'); del.title='Remove'; del.style.flex='none';
      del.onclick = function(){ draft.keys.splice(idx,1); refreshDraft(true); };
      row.appendChild(del);
    }
    keys.appendChild(row);
  });
  wrap.appendChild(keys);

  const add = el('button','btn sm','+ Add key colour'); add.style.marginTop='2px';
  add.onclick = function(){
    const used = draft.keys.map(function(k){ return Number(k.step); });
    const free = STEPS.filter(function(s){ return used.indexOf(s)<0; });
    if (!free.length){ toast('All eleven steps already have a key colour'); return; }
    const near = free.indexOf(700)>=0 ? 700 : free[Math.floor(free.length/2)];
    const src = draft.keys[0] && hexToOklch(draft.keys[0].hex);
    const hex = src ? oklchToHex(Math.max(0.12, src[0]-0.2), src[1]*0.85, src[2]) : '#1E3A8A';
    draft.keys.push({step:near, hex:hex});
    draft.keys.sort(function(a,b){ return a.step-b.step; });
    refreshDraft(true);
  };
  wrap.appendChild(add);

  wrap.appendChild(el('div','divider'));

  const det = el('details');
  if (state.shapeOpen) det.open = true;
  const sum = el('summary');
  sum.style.cssText='cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between';
  sum.innerHTML = '<span class="lbl">Ramp shape</span><span class="hint">show / hide</span>';
  det.appendChild(sum);
  det.addEventListener('toggle', function(){ state.shapeOpen = det.open; });
  const shape = el('div'); shape.style.paddingTop='10px';
  [['L50','Lightest tone (50)',88,100,0.5,function(v){return v.toFixed(1);}],
   ['L950','Darkest tone (950)',8,35,0.5,function(v){return v.toFixed(1);}],
   ['chroma','Chroma amount',0,180,5,function(v){return v+'%';}],
   ['hueL','Hue shift · light end',-30,30,1,function(v){return (v>0?'+':'')+v+'°';}],
   ['hueD','Hue shift · dark end',-30,30,1,function(v){return (v>0?'+':'')+v+'°';}]
  ].forEach(function(cfg){
    const w = el('div','slider');
    const top = el('div','top');
    top.appendChild(el('span','lbl',cfg[1]));
    const v = el('span','val', cfg[5](draft.opts[cfg[0]])); top.appendChild(v);
    w.appendChild(top);
    const r = document.createElement('input');
    r.type='range'; r.min=cfg[2]; r.max=cfg[3]; r.step=cfg[4]; r.value=draft.opts[cfg[0]];
    r.oninput = function(){
      draft.opts[cfg[0]] = parseFloat(r.value);
      v.textContent = cfg[5](draft.opts[cfg[0]]);
      refreshDraft();
    };
    w.appendChild(r);
    shape.appendChild(w);
  });
  shape.appendChild(el('p','hint','Key colours stay pinned exactly — these shape the tones around them.'));
  det.appendChild(shape);
  wrap.appendChild(det);

  const err = draftValid();
  if (err){ const m = el('p','hint'); m.style.color='var(--bad)'; m.textContent=err; m.style.margin='8px 0 0'; wrap.appendChild(m); }

  const acts = el('div','row'); acts.style.marginTop='10px';
  if (draft.mode==='new'){
    const go = el('button','btn primary grow','Generate colour ramp');
    go.disabled = !!err;
    go.onclick = commitDraft;
    acts.appendChild(go);
  } else {
    const go = el('button','btn primary grow','Regenerate ramp');
    go.disabled = !!err;
    go.onclick = function(){ confirmRegenerate(); };
    acts.appendChild(go);
    const cancel = el('button','btn','Cancel');
    cancel.onclick = closeDraft;
    acts.appendChild(cancel);
  }
  wrap.appendChild(acts);
  if (draft.mode==='edit'){
    draftNoteEl = el('p','hint','Previewing — the swatches and the right-hand pane show the result; nothing is applied until you regenerate.');
    draftNoteEl.style.display = draftDirty() ? '' : 'none';
    wrap.appendChild(draftNoteEl);
  } else draftNoteEl = null;
  return wrap;
}

/* re-render without losing focus in the field being typed in */
let draftNoteEl = null;
function refreshDraft(full){
  if (full){ renderPaletteList(); renderStage(); return; }
  renderPaletteStrips();
  if (draftNoteEl) draftNoteEl.style.display = draftDirty() ? '' : 'none';
  renderStage();
}

function commitDraft(){
  const err = draftValid();
  if (err){ toast(err); return; }
  const name = (draft.name||'').trim() || autoName(draft.keys[0].hex);
  const p = { id:uid(), name:name, keys:JSON.parse(JSON.stringify(draft.keys)),
              opts:Object.assign({},draft.opts), overrides:{} };
  state.palettes.push(p);
  state.selected = p.id; state.selectedTone=null; state.pending=null; state.curveSnapshot=null;
  state.tab = (state.tab==='all') ? 'all' : 'ramp';
  draft = defaultDraft();
  maybeAutoCollapse();
  save(); renderAll(); toast('“'+name+'” generated');
}

function confirmRegenerate(){
  const p = state.palettes.find(function(x){ return x.id===draft.id; });
  if (!p) return;
  const lost = Object.keys(p.overrides||{}).length;
  const wrap = el('div','modal-wrap');
  const box = el('div','modal'); box.style.width='420px';
  box.appendChild(el('h3',null,'Regenerate “'+(p.name||'Untitled')+'”?'));
  box.appendChild(el('p','hint','All eleven tones will be recomputed from the key colours and ramp shape.'
    + (lost ? ' <b>' + lost + ' manually edited tone' + (lost>1?'s':'') + ' will be discarded.</b>' : ' Nothing has been hand-edited on this ramp.')));
  const row = el('div','row'); row.style.marginTop='14px';
  const ok = el('button','btn primary','Regenerate');
  ok.onclick = function(){
    p.keys = JSON.parse(JSON.stringify(draft.keys));
    p.opts = Object.assign({}, draft.opts);
    p.overrides = {};
    state.pending=null; state.curveSnapshot=null; state.selectedTone=null;
    draft = defaultDraft();
    document.body.removeChild(wrap);
    save(); renderAll(); toast('Ramp regenerated');
  };
  const no = el('button','btn','Cancel');
  no.onclick = function(){ document.body.removeChild(wrap); };
  row.appendChild(ok); row.appendChild(no);
  box.appendChild(row);
  wrap.appendChild(box);
  wrap.onclick = function(ev){ if (ev.target===wrap) document.body.removeChild(wrap); };
  document.body.appendChild(wrap);
}

/* ---------- list ---------- */
let stripRefs = [];
function renderPaletteStrips(){
  stripRefs.forEach(function(ref){
    const ramp = resolveRamp(ref.pal);
    if (!ramp) return;
    ref.cells.forEach(function(c,i){ c.style.background = ramp[i].hex; });
    if (ref.nameEl) ref.nameEl.textContent = ref.pal.name || 'Untitled';
  });
}

function renderPaletteList(){
  const wrap = $('#palList'); wrap.innerHTML='';
  const host = $('#builderHost'); host.innerHTML='';
  stripRefs = [];
  $('#palCount').textContent = state.palettes.length ? '· ' + state.palettes.length : '';

  if (!state.palettes.length && draft.mode!=='new'){
    const e = el('div','list-empty');
    e.innerHTML = 'Nothing here yet.<br>Pick a way to start above.';
    wrap.appendChild(e);
  }

  if (state.palettes.length){
    const list = el('div','pal-list');
    const lastIdx = state.palettes.length - 1;
    state.palettes.forEach(function(p, palIdx){
      const editing = draft.mode==='edit' && draft.id===p.id;
      const ramp = resolveRamp(p) || [];

      const item = el('div','pal-item' + (p.id===state.selected?' active':'') + (editing?' editing':'')
        + (palIdx===0?' first':'') + (palIdx===lastIdx?' last':''));
      const nm = el('div','nm');
      const chev = el('button','chev');
      chev.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      chev.title = editing ? 'Close editor' : 'Edit this ramp';
      chev.onclick = function(ev){ ev.stopPropagation(); if (editing) closeDraft(); else startEdit(p); };
      const nameEl = el('b',null, p.name || 'Untitled');
      nm.appendChild(nameEl);
      /* no room for the old name here, so a dot says it changed and the
         tooltip says what it changed from */
      if (figmaRenamed(p)){
        const dot = el('i','ren-dot');
        dot.title = 'Renamed — in Figma it is still “' + figmaFullName(p) + '”';
        nm.appendChild(dot);
      }
      if (fromFigma(p)) nm.appendChild(figmaMark(p, false));
      nm.appendChild(chev);

      const strip = el('div','strip');
      const cells = ramp.map(function(t){ const i=el('i'); i.style.background=t.hex; i.title=t.step+' '+t.hex; strip.appendChild(i); return i; });
      stripRefs.push({pal:p, cells:cells, nameEl:nameEl});

      const acts = el('div','pal-actions');
      const dupB = el('button',null,'⧉'); dupB.title='Duplicate';
      dupB.onclick=function(ev){ ev.stopPropagation();
        const c = JSON.parse(JSON.stringify(p)); c.id=uid(); c.name=p.name+' copy';
        state.palettes.push(c); state.selected=c.id; draft=defaultDraft(); save(); renderAll(); };
      const delB = el('button',null,'×'); delB.title='Delete';
      delB.onclick=function(ev){ ev.stopPropagation();
        state.palettes = state.palettes.filter(function(x){return x.id!==p.id;});
        if (state.selected===p.id) state.selected=null;
        if (draft.id===p.id) draft=defaultDraft();
        maybeReopenCreate();
        save(); renderAll(); };
      acts.appendChild(dupB); acts.appendChild(delB);

      item.appendChild(nm); item.appendChild(strip); item.appendChild(acts);
      item.onclick=function(){
        state.renaming = false;
        if (state.selected===p.id) state.selected=null;   /* second click deselects */
        else { state.selected=p.id; state.selectedTone=null; state.pending=null; state.curveSnapshot=null; }
        save(); renderAll();
      };
      list.appendChild(item);

      if (editing){
        const slot = el('div','edit-slot');
        slot.onclick = function(ev){ ev.stopPropagation(); };
        slot.appendChild(builderForm());
        list.appendChild(slot);
      }
    });
    wrap.appendChild(list);
  }

  if (draft.mode==='new'){
    const slot = el('div','new-slot');
    slot.appendChild(builderForm());
    host.appendChild(slot);
  }
}

/* ============================================================
   5. LIVE REGION REGISTRY
   Editing has to feel immediate: while a slider or a curve point
   is being dragged we patch the affected DOM in place instead of
   re-rendering the stage, which would kill the drag.
   ============================================================ */
const LIVE = { pal:null, parts:[] };
/* true while curve edits are sitting in memory but not yet committed */
function curvesDirty(pal){
  if (!state.curveSnapshot || state.curveSnapshot.palId !== pal.id) return false;
  return JSON.stringify(state.curveSnapshot.overrides || {}) !== JSON.stringify(pal.overrides || {});
}
function liveReset(pal){ LIVE.pal = pal; LIVE.parts = []; }
function liveAdd(fn){ LIVE.parts.push(fn); }
function liveRefresh(){
  if (!LIVE.pal) return;
  const ramp = resolveRamp(LIVE.pal);
  if (!ramp) return;
  LIVE.parts.forEach(function(fn){ try{ fn(ramp); }catch(e){} });
}

/* ============================================================
   6. INTERACTIVE PERCEPTUAL CURVES
   Each point is draggable. Moving it rewrites that one tone's
   lightness, chroma or hue and leaves the rest of the ramp alone.
   The shaded band on the chroma chart is the sRGB ceiling — the
   practical shape of Stripe's "impossible colours".
   ============================================================ */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

const CURVES = {
  L: { title:'Lightness', unit:'OKLab L*, 0–100',
       about:'How light each tone is, measured the way the eye sees it rather than the way a screen encodes it. This line is what decides contrast, so a smooth, steadily falling curve is what makes a ramp behave predictably against text. Dragging a point changes that one tone\u2019s lightness and leaves its hue and colourfulness alone.',
       get:function(t){ return t.L*100; }, min:0, max:100,
       fmt:function(v){ return v.toFixed(1); },
       apply:function(t,v){ return oklchToHex(v/100, t.C, t.h); } },
  C: { title:'Chroma', unit:'OKLab chroma',
       about:'How colourful each tone is. The shaded band above the line is the ceiling of the sRGB gamut at that tone\u2019s lightness and hue — colours beyond it simply cannot be shown, which is why there is no such thing as a vivid dark yellow. Dragging a point changes that one tone\u2019s colourfulness.',
       get:function(t){ return t.C; }, min:0, max:null,
       fmt:function(v){ return v.toFixed(3); },
       apply:function(t,v){ return oklchToHex(t.L, v, t.h); } },
  H: { title:'Hue', unit:'OKLCH hue angle',
       about:'The hue angle of each tone, in degrees around the colour wheel. A flat line keeps one hue the whole way down the ramp; a slope warms or cools the ends, which is often what makes a ramp feel natural rather than synthetic. Dragging a point changes that one tone\u2019s hue.',
       get:function(t){ return t.h; }, min:0, max:360,
       fmt:function(v){ return v.toFixed(0)+'°'; },
       apply:function(t,v){ return oklchToHex(t.L, t.C, v); } }
};

function curveChart(pal, kind){
  const cfg = CURVES[kind];
  const box = el('div','chart-box');
  const h = el('h4');
  const left = el('span','chart-name');
  left.appendChild(el('span',null,cfg.title));
  const info = el('button','info-dot','i');
  info.type='button';
  info.setAttribute('aria-label','What this curve shows');
  info.title = 'What this curve shows';
  info.onclick = function(ev){ ev.stopPropagation(); showInfo(info, cfg.title, cfg.about); };
  left.appendChild(info);
  h.appendChild(left);
  h.appendChild(el('em',null,cfg.unit));
  box.appendChild(h);

  const valRow = el('div','chart-vals');
  const valEls = STEPS.map(function(){ const s=el('span'); valRow.appendChild(s); return s; });
  box.appendChild(valRow);

  const plot = el('div','curve');
  const cols = el('div','curve-cols');
  for (let i=0;i<11;i++) cols.appendChild(el('i'));
  plot.appendChild(cols);

  const svg = svgEl('svg',{viewBox:'0 0 100 100', preserveAspectRatio:'none'});
  const envPath = svgEl('path',{fill:'#EFEFF3', stroke:'#E2E2E7', 'stroke-width':'1',
                                'stroke-dasharray':'3 3','vector-effect':'non-scaling-stroke'});
  const line = svgEl('path',{fill:'none', stroke:'#C3C3CB', 'stroke-width':'2',
                             'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'});
  svg.appendChild(envPath); svg.appendChild(line);
  plot.appendChild(svg);

  const pts = STEPS.map(function(step,i){
    const p = el('div','curve-pt');
    p.style.left = (i/10*100)+'%';
    p.dataset.i = i;
    p.title = 'Drag to change ' + cfg.title.toLowerCase() + ' of step ' + step;
    plot.appendChild(p);
    return p;
  });
  const frame = el('div','curve-frame');
  frame.appendChild(plot);

  const stepRow = el('div','chart-vals steps');
  STEPS.forEach(function(s){ stepRow.appendChild(el('span',null,String(s))); });
  frame.appendChild(stepRow);
  box.appendChild(frame);

  let lo=0, hi=1;
  const yPct = function(v){ return (1-(v-lo)/(hi-lo))*100; };
  const vFromPct = function(pct){ return lo + (1-pct/100)*(hi-lo); };

  const update = function(ramp){
    const vals = ramp.map(cfg.get);
    let env = null;
    if (kind==='C') env = ramp.map(function(t){ return maxChroma(t.L, t.h); });

    if (cfg.max !== null){ lo = cfg.min; hi = cfg.max; }
    else {
      const top = Math.max.apply(null, vals.concat(env||[]));
      lo = 0; hi = Math.max(0.05, top*1.12);
    }
    if (kind==='H'){
      const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      if (mx-mn < 40){ const c=(mn+mx)/2; lo=Math.max(0,c-25); hi=Math.min(360,c+25); if(hi-lo<20){lo=c-10;hi=c+10;} }
      else { lo = 0; hi = 360; }
    }

    let d=''; for (let i=0;i<11;i++) d += (i?' L ':'M ') + (i/10*100).toFixed(3) + ' ' + yPct(vals[i]).toFixed(3);
    line.setAttribute('d', d);
    if (env){
      let e=''; for (let i=0;i<11;i++) e += (i?' L ':'M ') + (i/10*100).toFixed(3) + ' ' + yPct(env[i]).toFixed(3);
      envPath.setAttribute('d', e + ' L 100 0 L 0 0 Z');
      envPath.style.display='';
    } else envPath.style.display='none';

    for (let i=0;i<11;i++){
      const hot = (state.selectedTone===STEPS[i]) || (dragI===i);
      pts[i].style.top = yPct(vals[i]) + '%';
      pts[i].style.background = ramp[i].hex;
      pts[i].classList.toggle('on', hot);
      valEls[i].textContent = cfg.fmt(vals[i]);
      valEls[i].style.color = hot ? 'var(--ink)' : 'var(--ink-2)';
      valEls[i].style.fontWeight = hot ? '700' : '400';
    }
  };

  /* --- dragging ---
     The pointer is captured on the plot itself and the stage is NOT
     re-rendered until the drag ends — re-rendering mid-drag would
     detach the captured element and the point would stop following
     the cursor. */
  let dragI = -1, moved = false;
  const idxFromX = function(clientX){
    const r = plot.getBoundingClientRect();
    if (!r.width) return 0;
    return Math.min(10, Math.max(0, Math.round((clientX - r.left)/r.width*10)));
  };
  const commit = function(i, clientY){
    const r = plot.getBoundingClientRect();
    if (!r.height) return;
    const pct = Math.min(100, Math.max(0, (clientY - r.top)/r.height*100));
    const t = resolveRamp(pal)[i];
    const v = Math.min(hi, Math.max(lo, vFromPct(pct)));
    const hex = cfg.apply(t, v);
    pal.overrides = pal.overrides || {};
    const gen = generateRamp(pal.keys, pal.opts);
    if (gen[i].hex === hex) delete pal.overrides[STEPS[i]];
    else pal.overrides[STEPS[i]] = hex;
    liveRefresh();
  };
  plot.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    dragI = idxFromX(ev.clientX);
    moved = false;
    try { plot.setPointerCapture(ev.pointerId); } catch(e){}
    /* remember the committed state once, so "Discard" has something
       to go back to. Dragging never opens the tone editor — that
       would push the layout around under the cursor. */
    if (!state.curveSnapshot || state.curveSnapshot.palId !== pal.id)
      state.curveSnapshot = {palId:pal.id, overrides:JSON.parse(JSON.stringify(pal.overrides||{}))};
    liveRefresh();
  });
  plot.addEventListener('pointermove', function(ev){
    if (dragI < 0) return;
    ev.preventDefault();
    moved = true;
    commit(dragI, ev.clientY);
  });
  const end = function(ev){
    if (dragI < 0) return;
    dragI = -1;
    try { if (ev && ev.pointerId!==undefined) plot.releasePointerCapture(ev.pointerId); } catch(e){}
    if (!moved && state.curveSnapshot && state.curveSnapshot.palId===pal.id
        && !curvesDirty(pal)) state.curveSnapshot = null;
    renderPaletteList();
    liveRefresh();
  };
  plot.addEventListener('pointerup', end);
  plot.addEventListener('pointercancel', end);
  plot.addEventListener('lostpointercapture', end);

  return { node:box, update:update };
}

/* ============================================================
   7. TONE EDITOR — split original / edited, explicit save
   ============================================================ */
function pendingHexFor(pal, step){
  if (state.pending && state.pending.palId===pal.id && state.pending.step===step) return state.pending.hex;
  return null;
}

function toneEditor(pal, step){
  const idx  = stepIndex(step);
  const box  = el('div','editor');
  let base, saved, working, dirty;
  const readState = function(){
    base    = generateRamp(pal.keys, pal.opts)[idx];
    saved   = (pal.overrides && pal.overrides[step]) || base.hex;
    working = pendingHexFor(pal, step) || saved;
    dirty   = working !== saved;
  };
  readState();

  const hd = el('div','card-hd');
  const left = el('div');
  left.appendChild(el('div','card-title','Edit tone'));
  left.appendChild(el('div','eyebrow', (pal.name||'Ramp') + ' · step ' + step + (base.pinned?' · key colour':'')));
  const seg = el('div','seg');
  ['controls','picker'].forEach(function(m){
    const b = el('button',null, m==='controls'?'L / C / H':'Colour picker');
    b.setAttribute('aria-pressed', state.editorMode===m);
    b.onclick = function(){
      state.editorMode=m;
      if (m==='picker'){ renderStage(); setTimeout(function(){ const t=document.getElementById('openPickerBtn'); if(t) t.click(); },0); }
      else renderStage();
    };
    seg.appendChild(b);
  });
  const hdRight = el('div','row');
  hdRight.appendChild(seg);
  const closeB = el('button','btn icon ed-close','\u00d7');
  closeB.title = 'Close';
  closeB.setAttribute('aria-label','Close the tone editor');
  closeB.onclick = function(){ state.selectedTone=null; state.pending=null; renderStage(); };
  hdRight.appendChild(closeB);
  hd.appendChild(left); hd.appendChild(hdRight);
  box.appendChild(hd);

  const setPendingLive = function(hex){
    const n = normHex(hex); if(!n) return;
    state.pending = {palId:pal.id, step:step, hex:n};
    liveRefresh();
  };
  const commit = function(){
    readState();
    pal.overrides = pal.overrides || {};
    if (working === base.hex) delete pal.overrides[step];
    else pal.overrides[step] = working;
    state.pending = null; state.curveSnapshot = null; save(); renderAll(); toast('Step '+step+' saved');
  };
  const revert = function(){
    if (pal.overrides) delete pal.overrides[step];
    state.pending = null; state.curveSnapshot = null; save(); renderAll(); toast('Step '+step+' reset to the generated tone');
  };

  /* ---- split swatch ---- */
  const split = el('div','split');
  const oHalf = el('button','half orig');
  const oCap = el('div','cap','Original'), oHex = el('div','hexv'), oCr = el('div','cr'), oHint = el('div','hintx','click to reset');
  oHalf.appendChild(oCap); oHalf.appendChild(oHex); oHalf.appendChild(oCr); oHalf.appendChild(oHint);
  oHalf.title = 'Click to discard the edit and go back to the generated tone';
  oHalf.onclick = revert;
  const eHalf = el('div','half');
  const eCap = el('div','cap'), eHex = el('div','hexv'), eCr = el('div','cr');
  const saveB = el('button','save','<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>');
  saveB.onclick = function(){ readState(); if(dirty) commit(); };
  eHalf.appendChild(eCap); eHalf.appendChild(eHex); eHalf.appendChild(eCr); eHalf.appendChild(saveB);
  split.appendChild(oHalf); split.appendChild(eHalf);
  box.appendChild(split);

  const paintSplit = function(){
    readState();
    oHalf.style.background = base.hex; oHalf.style.color = inkOn(base.hex);
    oHex.textContent = base.hex;
    oCr.textContent = 'on white ' + contrastRatio(base.hex,'#FFFFFF').toFixed(2);
    oHint.style.display = (saved!==base.hex || dirty) ? '' : 'none';
    eHalf.style.background = working; eHalf.style.color = inkOn(working);
    eCap.textContent = dirty ? 'Edited · unsaved' : (saved!==base.hex ? 'Edited · saved' : 'Edited');
    eHex.textContent = working;
    eCr.textContent = 'on white ' + contrastRatio(working,'#FFFFFF').toFixed(2);
    if (dirty){ saveB.removeAttribute('disabled'); saveB.title='Save this tone'; }
    else { saveB.setAttribute('disabled',''); saveB.title='Nothing to save'; }
  };
  paintSplit();

  /* ---- controls ---- */
  const body = el('div'); body.style.marginTop='14px';
  let repaintControls = function(){};

  if (state.editorMode === 'picker'){
    const r = el('div','row');
    const swb = el('div','cp-sw'); swb.style.width='40px'; swb.style.height='38px';
    const hx = el('input','inp mono grow'); hx.spellcheck=false; hx.style.height='38px';
    hx.onchange=function(){ setPendingLive(hx.value); paintSplit(); };
    const ob = el('button','btn sm primary','Open colour picker'); ob.id='openPickerBtn'; ob.style.height='38px';
    ob.onclick = function(){
      openPickerPopup(ob, working, function(n){ setPendingLive(n); paintSplit(); repaintControls(); }, 'Step '+step);
    };
    r.appendChild(swb); r.appendChild(hx); r.appendChild(ob);
    body.appendChild(r);
    body.appendChild(el('p','hint','The picker is always in hexadecimal. Press save on the right half to keep the change.'));
    repaintControls = function(){ readState(); swb.style.background = working; if (document.activeElement!==hx) hx.value = working; };
    repaintControls();
  } else {
    const sliders = [];
    const mkSlider = function(key, label, fmt, range){
      const w = el('div','slider slider-lg');
      const top = el('div','top');
      top.appendChild(el('span','lbl',label));
      const v = el('span','val'); top.appendChild(v);
      w.appendChild(top);
      const r = document.createElement('input');
      r.type='range'; r.step=range.step;
      w.appendChild(r);
      const obj = {key:key, node:w, input:r, val:v, fmt:fmt, range:range};
      r.addEventListener('input', function(){
        const lch = hexToOklch(working);
        const L = obj.key==='L' ? parseFloat(r.value)/100 : lch[0];
        const C = obj.key==='C' ? parseFloat(r.value)     : lch[1];
        const H = obj.key==='H' ? parseFloat(r.value)     : lch[2];
        v.textContent = fmt(parseFloat(r.value));
        setPendingLive(oklchToHex(L,C,H));
        paintSplit();
        sliders.forEach(function(s){ if(s!==obj) s.sync(); });
      });
      obj.sync = function(){
        readState();
        const lch = hexToOklch(working);
        const mc  = maxChroma(lch[0], lch[2]);
        const g = function(n, f){ const a=[]; for(let i=0;i<=n;i++) a.push(f(i/n)); return 'linear-gradient(90deg,'+a.join(',')+')'; };
        if (obj.key==='L'){
          r.min=0; r.max=100; if(document.activeElement!==r) r.value = lch[0]*100;
          r.style.setProperty('--track', g(14, function(t){ return oklchToHex(t, lch[1], lch[2]); }));
          v.textContent = fmt(lch[0]*100);
        } else if (obj.key==='C'){
          r.min=0; r.max=Math.max(0.02, Math.max(mc, lch[1]));
          if(document.activeElement!==r) r.value = lch[1];
          r.style.setProperty('--track', g(14, function(t){ return oklchToHex(lch[0], Math.max(mc,lch[1])*t, lch[2]); }));
          v.textContent = fmt(lch[1]);
        } else {
          r.min=0; r.max=360; if(document.activeElement!==r) r.value = lch[2];
          r.style.setProperty('--track', g(28, function(t){ return oklchToHex(lch[0], lch[1], t*360); }));
          v.textContent = fmt(lch[2]);
        }
      };
      sliders.push(obj);
      return w;
    };
    body.appendChild(mkSlider('L','Lightness', function(v){return v.toFixed(1);}, {step:0.1}));
    body.appendChild(mkSlider('C','Chroma',    function(v){return v.toFixed(3);}, {step:0.001}));
    body.appendChild(mkSlider('H','Hue',       function(v){return v.toFixed(1)+'°';}, {step:0.5}));
    const info = el('p','hint');
    body.appendChild(info);
    repaintControls = function(){
      sliders.forEach(function(s){ s.sync(); });
      readState();
      const lch = hexToOklch(working), mc = maxChroma(lch[0], lch[2]);
      info.innerHTML = 'Max chroma available at this lightness &amp; hue: <b>'+mc.toFixed(3)+'</b>'
        + (lch[1] > mc + 0.002 ? ' — this tone is being clipped to sRGB.' : '');
    };
    repaintControls();
  }
  box.appendChild(body);

  const acts = el('div','row wrap'); acts.style.marginTop='10px';
  const cp = el('button','btn sm','Copy hex'); cp.onclick=function(){ readState(); copy(working, working+' copied'); };
  const mk = el('button','btn sm','Make this a key colour');
  mk.onclick=function(){
    readState();
    const exists = pal.keys.find(function(k){ return Number(k.step)===Number(step); });
    if (exists) exists.hex = working; else pal.keys.push({step:Number(step), hex:working});
    pal.keys.sort(function(a,b){return a.step-b.step;});
    if (pal.overrides) delete pal.overrides[step];
    state.pending = null;
    if (draft.mode==='edit' && draft.id===pal.id) startEdit(pal);
    save(); renderAll(); toast('Pinned '+step+' as a key colour');
  };
  acts.appendChild(cp); acts.appendChild(mk);
  box.appendChild(acts);

  return { node:box, update:function(){ paintSplit(); repaintControls(); } };
}

/* ============================================================
   8. COLOUR PICKER POPOVER
   ============================================================ */
function rgbToHsv(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if (d){
    if (mx===r) h=((g-b)/d)%6; else if (mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if (h<0) h+=360;
  }
  return [h, mx? d/mx : 0, mx];
}
function hsvToHex(h,s,v){
  h=((h%360)+360)%360;
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return rgbToHex([r+m,g+m,b+m]);
}

/* A self-contained picker that is always in HEX mode: saturation /
   value square, hue bar, hex field, plus the eyedropper when the
   browser exposes it. Everything updates as you drag. */
function buildPicker(hex, onChange){
  const rgb = hexToRgb(hex) || [0,0,0];
  const hsv = rgbToHsv(rgb[0],rgb[1],rgb[2]);
  let H=hsv[0], S=hsv[1], V=hsv[2];
  const wrap = el('div','cp');

  const sv = el('div','cp-sv');
  const knob = el('div','knob');
  sv.appendChild(knob);
  const paint = function(){
    sv.style.background = 'linear-gradient(to top, #000, rgba(0,0,0,0)),'
      + 'linear-gradient(to right, #fff, ' + hsvToHex(H,1,1) + ')';
  };
  const place = function(){
    knob.style.left=(S*100)+'%'; knob.style.top=((1-V)*100)+'%';
    knob.style.background=hsvToHex(H,S,V);
  };
  paint(); place();

  let swb, hx, hueVal, hue;
  const emit = function(){
    const n = hsvToHex(H,S,V);
    if (swb) swb.style.background = n;
    if (hx && document.activeElement!==hx) hx.value = n;
    onChange(n);
  };
  let dragging=false;
  const fromEvent = function(ev){
    const r = sv.getBoundingClientRect();
    S = Math.min(1, Math.max(0, (ev.clientX - r.left)/r.width));
    V = 1 - Math.min(1, Math.max(0, (ev.clientY - r.top)/r.height));
    place(); emit();
  };
  sv.addEventListener('pointerdown', function(ev){ ev.preventDefault(); dragging=true; sv.setPointerCapture(ev.pointerId); fromEvent(ev); });
  sv.addEventListener('pointermove', function(ev){ if(dragging) fromEvent(ev); });
  sv.addEventListener('pointerup', function(){ dragging=false; });
  sv.addEventListener('pointercancel', function(){ dragging=false; });
  wrap.appendChild(sv);

  const right = el('div','cp-right');
  const hueWrap = el('div','slider slider-lg'); hueWrap.style.marginBottom='0';
  const hueTop = el('div','top');
  hueTop.appendChild(el('span','lbl','Hue'));
  hueVal = el('span','val', H.toFixed(0)+'°'); hueTop.appendChild(hueVal);
  hueWrap.appendChild(hueTop);
  hue = document.createElement('input');
  hue.type='range'; hue.min=0; hue.max=360; hue.step=1; hue.value=H;
  hue.style.setProperty('--track','linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)');
  hue.addEventListener('input', function(){ H=parseFloat(hue.value); hueVal.textContent=H.toFixed(0)+'°'; paint(); place(); emit(); });
  hueWrap.appendChild(hue);
  right.appendChild(hueWrap);

  const hexRow = el('div','cp-hex');
  swb = el('div','cp-sw'); swb.style.background = hex;
  hexRow.appendChild(swb);
  hexRow.appendChild(el('span','tag','HEX'));
  hx = el('input','inp mono grow'); hx.value=hex; hx.spellcheck=false; hx.style.height='34px';
  hx.onchange=function(){
    const n = normHex(hx.value);
    if (!n){ hx.value = hsvToHex(H,S,V); return; }
    const c = hexToRgb(n), k = rgbToHsv(c[0],c[1],c[2]);
    H=k[0]; S=k[1]; V=k[2];
    hue.value=H; hueVal.textContent=H.toFixed(0)+'°';
    paint(); place(); swb.style.background=n; onChange(n);
  };
  hexRow.appendChild(hx);
  if (window.EyeDropper){
    const ed = el('button','btn sm','⌖'); ed.title='Pick from screen'; ed.style.height='34px'; ed.style.flex='none';
    ed.onclick=function(){ new window.EyeDropper().open().then(function(r){ hx.value=r.sRGBHex.toUpperCase(); hx.onchange(); }).catch(function(){}); };
    hexRow.appendChild(ed);
  }
  right.appendChild(hexRow);
  wrap.appendChild(right);
  return wrap;
}

/* a small explainer that hangs off an “i” button */
let closeInfo = null;
function showInfo(anchor, title, body){
  if (closeInfo){ const was = closeInfo.anchor; closeInfo(); if (was === anchor) return; }
  const back = el('div','pop-backdrop');
  const pop = el('div','info-pop');
  pop.appendChild(el('b',null,title));
  pop.appendChild(el('p',null,body));
  document.body.appendChild(back); document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const w = 300;
  pop.style.left = Math.min(window.innerWidth - w - 12, Math.max(12, r.left - 8)) + 'px';
  const below = r.bottom + 8;
  pop.style.top = (below + pop.offsetHeight > window.innerHeight - 12 && r.top > pop.offsetHeight + 20)
    ? Math.max(12, r.top - pop.offsetHeight - 8) + 'px' : below + 'px';
  const done = function(){
    if (pop.parentNode) pop.parentNode.removeChild(pop);
    if (back.parentNode) back.parentNode.removeChild(back);
    document.removeEventListener('keydown', esc);
    closeInfo = null;
  };
  const esc = function(ev){ if (ev.key==='Escape') done(); };
  back.onclick = done;
  document.addEventListener('keydown', esc);
  done.anchor = anchor;
  closeInfo = done;
}

let closePicker = null;
function openPickerPopup(anchor, hex, onChange, label){
  if (closePicker) closePicker();
  const backdrop = el('div','pop-backdrop');
  const pop = el('div','popover');
  const hd = el('div','pop-hd');
  hd.appendChild(el('b',null, label || 'Colour'));
  const x = el('button','btn icon','×');
  hd.appendChild(x);
  pop.appendChild(hd);
  pop.appendChild(buildPicker(hex, onChange));

  document.body.appendChild(backdrop);
  document.body.appendChild(pop);

  const r = anchor.getBoundingClientRect();
  const w = 300, gap = 8;
  let leftPos = Math.min(window.innerWidth - w - 10, Math.max(10, r.left));
  let topPos  = r.bottom + gap;
  if (topPos + 360 > window.innerHeight) topPos = Math.max(10, r.top - 360 - gap);
  pop.style.left = leftPos + 'px';
  pop.style.top  = topPos + 'px';

  const done = function(){
    if (pop.parentNode) pop.parentNode.removeChild(pop);
    if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    document.removeEventListener('keydown', esc);
    closePicker = null;
  };
  const esc = function(ev){ if (ev.key==='Escape') done(); };
  backdrop.onclick = done; x.onclick = done;
  document.addEventListener('keydown', esc);
  closePicker = done;
  return done;
}

   ============================================================ */
function rampRow(pal){
  const row = el('div','ramp');
  const cells = STEPS.map(function(step){
    const b = el('button','tone');
    const lab = el('span','lab', String(step));
    const hx  = el('span','hx');
    const badge = el('span','pin','KEY');
    const dot = el('span','dot');
    b.appendChild(lab); b.appendChild(hx); b.appendChild(badge); b.appendChild(dot);
    b.onclick=function(){
      if (state.selectedTone===step){ state.selectedTone=null; }
      else { state.selectedTone=step; state.pending=null; }
      renderStage();
    };
    row.appendChild(b);
    return {b:b, hx:hx, badge:badge, dot:dot};
  });
  const update = function(ramp){
    ramp.forEach(function(t,i){
      const c = cells[i];
      c.b.style.background = t.hex;
      c.b.style.color = inkOn(t.hex);
      c.b.classList.toggle('sel', state.selectedTone===t.step);
      c.b.title = t.step + ' · ' + t.hex;
      c.hx.textContent = t.hex.replace('#','');
      c.badge.style.display = t.pinned ? '' : 'none';
      if (t.unsaved){ c.dot.style.display=''; c.dot.style.background='#F0A03C'; c.dot.title='Unsaved edit'; }
      else if (t.edited){ c.dot.style.display=''; c.dot.style.background='#fff'; c.dot.title='Manually edited'; }
      else if (t.clipped){ c.dot.style.display=''; c.dot.style.background='#F0A03C'; c.dot.title='Clipped to sRGB gamut'; }
      else c.dot.style.display='none';
    });
  };
  return {node:row, update:update};
}

function contrastBlock(){
  const wrap = el('div');
  const secs = [];
  const mk = function(title, against, note){
    const sec = el('div'); sec.style.marginBottom='12px';
    const hd = el('div','row'); hd.style.marginBottom='5px';
    hd.appendChild(el('span','lbl',title));
    hd.appendChild(el('span','hint',note));
    sec.appendChild(hd);
    const steps = el('div','grid11'); steps.style.marginBottom='3px';
    STEPS.forEach(function(s){ steps.appendChild(el('div','step-lab', String(s))); });
    sec.appendChild(steps);
    const g = el('div','grid11');
    const cells = STEPS.map(function(){
      const c = el('div','cell');
      c.style.background = against==='#FFFFFF' ? '#FFFFFF' : '#111113';
      c.style.border = '1px solid var(--line)';
      g.appendChild(c);
      return c;
    });
    sec.appendChild(g);
    secs.push({cells:cells, against:against});
    wrap.appendChild(sec);
    return sec;
  };
  mk('Text on white','#FFFFFF','WCAG 2.1 — 4.5 body, 3.0 large');
  mk('Text on black','#000000','same thresholds, inverted');

  const det = el('details');
  det.appendChild(el('summary','lbl','Tone-against-tone matrix'));
  const sc = el('div','scroll-x');
  const tbl = el('table','grid'); tbl.style.marginTop='8px';
  sc.appendChild(tbl); det.appendChild(sc);
  det.appendChild(el('p','hint','Stripe’s shortcut: on a uniform ladder, any two tones five steps apart clear 4.5:1 for body text, four steps for icons and large text. Green cells confirm it for this ramp.'));
  wrap.appendChild(det);

  const update = function(ramp){
    secs.forEach(function(s){
      ramp.forEach(function(t,i){
        const r = contrastRatio(t.hex, s.against);
        const gr = contrastGrade(r);
        s.cells[i].style.color = t.hex;
        s.cells[i].innerHTML = '<div style="font-weight:600">'+r.toFixed(2)+'</div>'
          + '<div style="margin-top:3px"><span class="badge '+gr.cls+'" style="font-size:9px;height:15px;padding:0 5px">'+gr.label+'</span></div>';
      });
    });
    if (det.open || !tbl.innerHTML){
      let html = '<tr><th class="left"></th>' + STEPS.map(function(s){return '<th>'+s+'</th>';}).join('') + '</tr>';
      ramp.forEach(function(a){
        html += '<tr><th class="left">'+a.step+'</th>';
        ramp.forEach(function(b){
          const r = contrastRatio(a.hex,b.hex);
          const pass = r>=4.5, mid = r>=3;
          html += '<td><div class="cell" style="background:'+(pass?'#E7F5EC':mid?'#FCF1E1':'#F6F6F7')+';color:'+(pass?'#155D33':mid?'#764509':'#525256')+'">'+r.toFixed(1)+'</div></td>';
        });
        html += '</tr>';
      });
      tbl.innerHTML = html;
    }
  };
  det.addEventListener('toggle', function(){ liveRefresh(); });
  return {node:wrap, update:update};
}

function renderRampTab(pal){
  const stage = $('#stage');
  const ramp = resolveRamp(pal);
  if (!ramp){ stage.appendChild(el('p','hint','This ramp has no valid key colour.')); return; }
  liveReset(pal);

  /* --- pinned ramp --- */
  const sticky = el('div','stage-sticky');
  const c1 = el('div','card tight');
  const h1 = el('div','card-hd');
  h1.appendChild(el('div','card-title', (pal.name||'Untitled') + ' ramp'));
  const acts = el('div','row');
  const rst = el('button','btn sm');
  rst.onclick=function(){
    pal.overrides={}; state.pending=null; state.curveSnapshot=null;
    save(); renderAll(); toast('All manual edits cleared');
  };
  acts.appendChild(rst);
  h1.appendChild(acts);
  const syncHead = function(){
    const n = Object.keys(pal.overrides||{}).length;
    rst.style.display = n ? '' : 'none';
    rst.textContent = 'Reset ' + n + ' edit' + (n>1?'s':'');
  };
  liveAdd(syncHead);
  c1.appendChild(h1);

/* ============================================================
   12. FIGMA WRITE PANEL
   ============================================================ */
const VERIFY_CHUNK = 4;   /* palettes per verification call */

function fig(){
  if (!state.figma) state.figma = {
    url:'', key:null, status:'idle', error:null, hints:[],
    file:null, collections:[], collectionId:null, newName:'', group:FIGMA_GROUP, modeId:null,
    writable:false, conflicts:{}, unchecked:{}, overwrite:{}, write:null
  };
  return state.figma;
}
/* Overwriting means writing straight onto the variables this ramp was
   read from, by id. Ids survive a rename and a value change, so every
   fill binding, alias and published key keeps pointing at them — that
   is the whole reason a reskin works. It only makes sense when the
   connected file is the file the ramp came from, and when we actually
   kept ids for it. */
/* Where the ramps land is the file owner's decision, not ours: teams
   name their collections whatever suits them, and a ramp may belong at
   the root rather than under a group. Everything below reads from that
   choice instead of the old hard-coded Primitives / Colours. */
const NEW_COLLECTION = '__new__';
/* the offline exports run whether or not a file is connected, so they
   follow the chosen address when there is one and fall back otherwise */
function figExpCollection(){ return figCollectionName() || FIGMA_COLLECTION; }
function figExpGroup(){ const f = fig(); return f.status === 'ok' ? figGroup() : FIGMA_GROUP; }
function figExpPrefix(){ const g = figExpGroup(); return g ? g + '/' : ''; }
function figCollection(){
  const f = fig();
  return f.collections.filter(function(c){ return c.id === f.collectionId; })[0] || null;
}
function figCollectionName(){
  const c = figCollection();
  return c ? c.name : (fig().newName || '').trim();
}
function figCreatingCollection(){ return fig().collectionId === NEW_COLLECTION; }
function figGroup(){ return String(fig().group || '').trim().replace(/^\/+|\/+$/g, '').replace(/\s*\/\s*/g,'/'); }
function figPrefix(){ const g = figGroup(); return g ? g + '/' : ''; }
function figVarName(ramp, step){ return figPrefix() + ramp + '/' + step; }
function figWhereLabel(){
  const c = figCollectionName() || '—';
  return c + (figGroup() ? ' / ' + figGroup() : '');
}
function figModes(){ const c = figCollection(); return c ? c.modes : []; }
function figMode(){
  const ms = figModes(); if (!ms.length) return null;
  return ms.filter(function(m){ return m.id === fig().modeId; })[0] || ms[0];
}
function figReady(){
  const f = fig();
  if (f.status !== 'ok') return false;
  return figCreatingCollection() ? !!(f.newName || '').trim() : !!figCollection();
}
/* what already sits at the chosen address, recounted locally on every
   change of collection or group — no second trip to the file */
function figScanRamps(){
  const c = figCollection();
  if (!c || !c.names) return [];
  const pre = figPrefix(), groups = {};
  c.names.forEach(function(n){
    if (pre && n.indexOf(pre) !== 0) return;
    const rest = pre ? n.slice(pre.length) : n;
    const parts = rest.split('/');
    if (parts.length < 2) return;
    groups[parts[0]] = (groups[parts[0]] || 0) + 1;
  });
  return Object.keys(groups).map(function(k){ return { name:k, count:groups[k] }; });
}
/* after a connect, aim at wherever the ramps on the desk came from —
   that is the reskin case — and fall back to Primitives */
function figPickDefaults(){
  const f = fig();
  const tally = {};
  state.palettes.forEach(function(p){
    if (!figmaSameFile(p) || !p.source.collectionId) return;
    const k = p.source.collectionId;
    tally[k] = tally[k] || { n:0, groups:{}, modes:{} };
    tally[k].n++;
    const g = String(p.source.group || '').split('/').slice(0,-1).join('/');
    tally[k].groups[g] = (tally[k].groups[g] || 0) + 1;
    if (p.source.modeId) tally[k].modes[p.source.modeId] = (tally[k].modes[p.source.modeId] || 0) + 1;
  });
  const top = function(o){
    let best = null, n = -1;
    Object.keys(o).forEach(function(k){ if (o[k] > n){ n = o[k]; best = k; } });
    return best;
  };
  let pick = null, n = 0;
  Object.keys(tally).forEach(function(k){
    if (tally[k].n > n && f.collections.some(function(c){ return c.id === k; })){ n = tally[k].n; pick = k; }
  });
  if (pick){
    f.collectionId = pick;
    f.group = top(tally[pick].groups) || '';
    const m = top(tally[pick].modes);
    const col = f.collections.filter(function(c){ return c.id === pick; })[0];
    f.modeId = (m && col.modes.some(function(x){ return x.id === m; })) ? m : (col.modes[0] || {}).id;
    return;
  }
  const prim = f.collections.filter(function(c){ return c.name === FIGMA_COLLECTION; })[0];
  const use = prim || f.collections[0] || null;
  f.collectionId = use ? use.id : NEW_COLLECTION;
  f.newName = use ? '' : FIGMA_COLLECTION;
  f.group = FIGMA_GROUP;
  f.modeId = use ? (use.modes[0] || {}).id : null;
}

function figmaTonesHeld(p){
  return fromFigma(p) && p.source.variableIds ? Object.keys(p.source.variableIds).length : 0;
}
function figmaSameFile(p){
  const f = fig();
  return fromFigma(p) && !!f.key && !!p.source.fileKey && p.source.fileKey === f.key;
}
function figmaOverwriteBlock(p){
  if (!fromFigma(p)) return 'not-figma';
  if (!fig().key) return 'no-file';
  if (!figmaSameFile(p)) return 'other-file';
  if (!figmaTonesHeld(p)) return 'no-ids';
  return '';
}
function figmaOverwriting(p){
  return !figmaOverwriteBlock(p) && fig().overwrite[p.id] === true;
}

/* What the file holds for one ramp right now. Counted from the names
   read at connect time, so it costs nothing and updates as the address
   changes. Ids are the truth for an in-place write, so the census is
   built around how many of them we kept rather than around names —
   a scale imported from Radix 1…12 has no 50…950 names to match. */
function figCensus(t){
  const f = fig(), p = t.pal, src = p.source || {};
  if (t.over){
    const col = f.collections.filter(function(c){ return c.id === src.collectionId; })[0];
    if (!col || !col.names) return null;
    const pre = String(src.group || '') ? String(src.group) + '/' : '';
    const inGroup = col.names.filter(function(n){
      return n.indexOf(pre) === 0 && n.slice(pre.length).indexOf('/') < 0;
    }).length;
    const held = figmaTonesHeld(p);
    return { where:'figma', inGroup:inGroup, held:held,
             missing: Math.max(0, STEPS.length - held),
             extra: Math.max(0, inGroup - held) };
  }
  /* Figma treats blue and Blue as two groups, while a clash is judged
     case-insensitively to catch the confusion — so count the exact one
     when it exists and only then fall back to the look-alike */
  const near = figScanRamps().filter(function(e){ return e.name.toLowerCase() === t.name.toLowerCase(); });
  const ex = near.filter(function(e){ return e.name === t.name; })[0] || near[0];
  if (!ex) return null;
  return { where:'name', inGroup:ex.count, held:ex.count,
           missing: Math.max(0, STEPS.length - ex.count),
           extra: Math.max(0, ex.count - STEPS.length) };
}

/* Everything worth a second thought before the write runs. Each entry
   is one ramp and one plain sentence; the modal turns them into rows
   with a checkbox so a doubtful one can be dropped on the spot. */
function figmaWarnings(){
  const out = [];
  figmaTargets().filter(function(t){ return t.on; }).forEach(function(t){
    const c = figCensus(t), notes = [];
    if (t.over){
      notes.push({ kind:'overwrite', text:'Overwrites the variables it came from. Their ids stay, so links hold — but the old colours are gone and only Figma\u2019s undo brings them back.' });
      if (figmaRenamed(t.pal))
        notes.push({ kind:'rename', text:'Renames those variables from “' + figmaFullName(t.pal) + '” to “' + t.name + '”.' });
      if (c && c.missing)
        notes.push({ kind:'short', text:'Only ' + c.held + ' of ' + STEPS.length + ' tones were imported, so ' + c.missing + ' new variable' + (c.missing===1?' is':'s are') + ' created to complete the ramp.' });
      if (c && c.extra)
        notes.push({ kind:'extra', text: c.extra + ' variable' + (c.extra===1?'':'s') + ' in that group ' + (c.extra===1?'is':'are') + ' outside the 50…950 scale and ' + (c.extra===1?'is':'are') + ' left untouched, still carrying the old colours'
          + (figmaRenamed(t.pal) ? ' — and staying under the old name, since a group in Figma is only a prefix.' : '.') });
    } else {
      if (fromFigma(t.pal) && !figmaOverwriteBlock(t.pal))
        notes.push({ kind:'duplicate', text:'Came from this file but is being written as a fresh set, so “' + figmaFullName(t.pal) + '” keeps its old colours and nothing in the file repaints. Turn on Overwrite to write onto it instead.' });
      if (t.clash && t.conflict.action==='update' && c && c.inGroup !== STEPS.length)
        notes.push({ kind:'uneven', text:'A ramp of the same name already sits there with ' + c.inGroup + ' variable' + (c.inGroup===1?'':'s') + ' instead of ' + STEPS.length + (c.extra ? ', and the extra ' + c.extra + ' stay as they are.' : '.') });
      if (t.clash && t.conflict.action==='renameExisting')
        notes.push({ kind:'rename-existing', text:'Renames the existing “' + t.name + '” in the file to “' + (t.conflict.newName||'').trim() + '” to free the name.' });
    }
    if (notes.length) out.push({ target:t, census:c, notes:notes });
  });
  return out;
}

function figmaTargets(){
  const f = fig();
  return allRamps().map(function(d){
    const name = (d.pal.name || 'Untitled').trim();
    const over = figmaOverwriting(d.pal);
    const c = f.conflicts[name] || {action:'update', newName:''};
    /* an in-place write never lands in the Primitives group, so a name
       already sitting there is not a conflict for it */
    const clash = !over && figScanRamps().some(function(e){ return e.name.toLowerCase() === name.toLowerCase(); });
    let target = name, tag = 'New', cls = 'tag-new';
    if (over){
      target = name;
      tag = figmaRenamed(d.pal) ? 'Renamed in place' : 'Updated in place';
      cls = 'tag-upd';
    } else if (clash){
      if (c.action==='update'){ target = name; tag='Update'; cls='tag-upd'; }
      else if (c.action==='renameNew'){ target = (c.newName||'').trim(); tag='Renamed'; cls='tag-ren'; }
      else if (c.action==='renameExisting'){ target = name; tag='New · existing renamed'; cls='tag-ren'; }
      else { target = name; tag='Skipped'; cls='tag-skip'; }
    }
    return { pal:d.pal, ramp:d.ramp, name:name, clash:clash, conflict:c, target:target, tag:tag, cls:cls,
             over:over, block:figmaOverwriteBlock(d.pal), held:figmaTonesHeld(d.pal),
             on: f.unchecked[d.pal.id] !== true && (over || c.action !== 'skip') };
  });
}

function figmaConflictsUnresolved(){
  return figmaTargets().filter(function(t){
    if (!t.clash) return false;
    const a = t.conflict.action;
    if (a==='renameNew' || a==='renameExisting') return !(t.conflict.newName||'').trim();
    return false;
  });
}

async function figmaConnect(){
  const f = fig();
  f.status='checking'; f.error=null; f.hints=[]; f.write=null;
  renderFigmaPanel();
  const key = parseFigmaKey(f.url);
  if (!key){
    f.status='error';
    f.error='That does not look like a Figma file link.';
    f.hints=['Open the file in Figma, use Share → Copy link.',
             'The link should look like https://www.figma.com/design/&lt;key&gt;/&lt;name&gt;.'];
    renderFigmaPanel(); return;
  }
  f.key = key;
  try {
    const info = await figmaRun(key, FIGMA_CHECK_SCRIPT, 'Check write access and list the variable collections in this file');
    if (info.editorType !== 'figma'){
      f.status='error';
      f.error='This is a ' + info.editorType + ' file. Variables live in Figma design files only.';
      f.hints=['Open a /design/ file and copy that link instead.'];
      renderFigmaPanel(); return;
    }
    f.file = { name: info.fileName, editorType: info.editorType };
    f.writable = !!info.writable;
    f.collections = info.collections || [];
    if (!f.writable){
      f.status='error';
      f.error='The file opened, but writing was refused: ' + (info.writeError || 'unknown reason');
      f.hints=['Check your seat on this file — view or comment access cannot create variables.',
               'If the file lives in a team library, make sure branching or edit access is granted.'];
      renderFigmaPanel(); return;
    }
    f.status='ok';
    figPickDefaults();
    const clashes = figmaTargets().filter(function(t){ return t.clash; });
    clashes.forEach(function(t){ if (!f.conflicts[t.name]) f.conflicts[t.name] = {action:'update', newName:''}; });
    renderFigmaPanel();
    if (clashes.length) figmaConflictModal();
  } catch(e){
    f.status='error';
    if (e.code==='NO_BRIDGE'){
      f.error='This view cannot reach Figma from here.';
      f.hints=['Open the tool inside Cowork, where the Figma connector is available.',
               'Meanwhile, use Copy or Download above and hand the manifest to the agent in chat.'];
    } else if (e.code==='NO_TOOL'){
      f.error='The Figma MCP server did not answer in this session.';
      f.hints=['Authorise the Figma connector, then ask the agent to rebuild this view so it binds to the live tool name.',
               'Check that the Figma desktop app is running with the MCP server enabled.',
               'Until then, use Copy or Download above and hand the manifest to the agent in chat.'];
    } else {
      f.error = e.message || String(e);
      f.hints=['Confirm the Figma connector is authorised in your connector settings.',
               'Confirm you can open this file yourself in Figma with edit rights.',
               'If the link points at a branch, use the branch URL key.'];
    }
    renderFigmaPanel();
  }
}

async function figmaWrite(){
  const f = fig();
  const targets = figmaTargets().filter(function(t){ return t.on; });
  if (!targets.length){ toast('Nothing selected'); return; }
  /* two different jobs: some ramps land on their own variables by id,
     the rest are written by name into the chosen collection */
  const inPlace = targets.filter(function(t){ return t.over; });
  const byName  = targets.filter(function(t){ return !t.over; });
  const renames = byName.filter(function(t){ return t.clash && t.conflict.action==='renameExisting'; })
                        .map(function(t){ return { from:t.name, to:(t.conflict.newName||'').trim() }; });

  f.write = { status:'running', step:'Starting…', done:0, total:targets.length,
              created:0, updated:0, renamed:0, inPlace:0, strays:[], leftBehind:[], lost:[], modeFallback:[],
              verify:null, error:null };
  renderFigmaPanel();

  try {
    let prep = null;
    if (byName.length){
      f.write.step = 'Preparing the collection…';
      renderFigmaPanel();
      prep = await figmaRun(f.key, figmaPrepareScript(renames),
        'Ensure the ' + figCollectionName() + ' collection exists and apply any agreed renames');
      f.write.renamed = prep.renamedCount || 0;
      f.write.createdCollection = !!prep.createdCollection;
      f.write.modeName = prep.modeName;
    }

    /* one call per ramp keeps every script small and lets a
       failure be pinpointed to a single ramp */
    const expected = [], expectedIds = [];
    for (let i=0;i<targets.length;i++){
      const t = targets[i];
      f.write.step = (t.over ? 'Overwriting ' : 'Writing ') + t.target + '…';
      f.write.done = i;
      renderFigmaPanel();
      const tones = figmaTones(t.pal);

      if (t.over){
        const res = await figmaRun(f.key, figmaInPlaceScript(t.pal, tones),
          'Overwrite the ' + t.name + ' variables in place, keeping their ids');
        f.write.created += res.created || 0;
        f.write.updated += res.updated || 0;
        f.write.renamed += res.renamedCount || 0;
        f.write.inPlace += 1;
        if (res.strays && res.strays.length) f.write.strays = f.write.strays.concat(res.strays);
        if (res.leftBehind && res.leftBehind.length) f.write.leftBehind = (f.write.leftBehind||[]).concat(res.leftBehind);
        if (res.lost && res.lost.length) f.write.lost.push(t.name + ': ' + res.lost.join(', '));
        if (res.modeMissing) f.write.modeFallback.push(t.name);
        /* the ramp now lives under its new name, so the desk stops
           calling it renamed and a second write finds it again */
        const src = t.pal.source;
        src.variableIds = res.variableIds || src.variableIds;
        src.group = res.path;
        src.figmaName = (t.pal.name || '').trim();
        src.modeId = res.modeId;
        src.partial = false;
        tones.forEach(function(tn){
          const id = (res.variableIds || {})[tn.step];
          if (id) expectedIds.push({ id:id, name:res.path + '/' + tn.step, modeId:res.modeId, rgb:tn.rgb });
        });
      } else {
        const res = await figmaRun(f.key,
          figmaWriteScript(prep.collectionId, prep.modeId, t.target, slug(t.target), tones),
          'Write the ' + t.target + ' ramp into ' + figWhereLabel());
        f.write.created += res.created || 0;
        f.write.updated += res.updated || 0;
        tones.forEach(function(tn){
          expected.push({ name: figVarName(t.target, tn.step), rgb: tn.rgb });
        });
      }
    }
    f.write.done = targets.length;
    save();

    f.write.step = 'Verifying…';
    renderFigmaPanel();
    let checked=0, matched=0, missing=[], wrong=[], total=0;

    /* verify in chunks so the script never grows unbounded */
    const per = VERIFY_CHUNK * STEPS.length;
    for (let s2=0; s2<expected.length; s2+=per){
      const slice = expected.slice(s2, s2+per);
      const v = await figmaRun(f.key, figmaVerifyScript(prep.collectionId, prep.modeId, slice),
        'Read the written variables back and compare them with the ramp');
      checked += v.checked; matched += v.matched;
      missing = missing.concat(v.missing||[]); wrong = wrong.concat(v.wrong||[]);
      total = v.totalInCollection;
    }
    for (let s3=0; s3<expectedIds.length; s3+=per){
      const slice = expectedIds.slice(s3, s3+per);
      const v = await figmaRun(f.key, figmaVerifyIdsScript(slice),
        'Read the overwritten variables back by id and compare them with the ramp');
      checked += v.checked; matched += v.matched;
      missing = missing.concat(v.missing||[]); wrong = wrong.concat(v.wrong||[]);
    }
    f.write.verify = { checked:checked, matched:matched, missing:missing, wrong:wrong, totalInCollection:total };
    f.write.status = (missing.length || wrong.length) ? 'partial' : 'done';
    f.write.step = '';
    renderAll();
  } catch(e){
    f.write.status = 'error';
    f.write.error = e.message || String(e);
  }
  if (f.write.status==='done') toast('Variables written to Figma');
}

/* Step 1 ends with the address: which collection, which group inside

  const f = fig();

  box.appendChild(hd);

  f.collections.forEach(function(c){
    const o = el('option', null, escHtml(c.name) + ' · ' + c.colours + ' colour' + (c.colours===1?'':'s'));
    o.value = c.id;
    if (c.id === f.collectionId) o.selected = true;

  });
  const mk = el('option', null, f.collections.length ? '＋ New collection…' : '＋ Create a collection…');

    f.group = g.value;

    if (prev) prev.innerHTML = figmaWhereSample();

  g.onchange = function(){ f.group = g.value; renderFigmaPanel(); };
  gWrap.appendChild(g);

  /* mode, only where there is a choice to make */
  const modes = figModes();
  if (modes.length > 1){
    const mWrap = el('label','where-f mode');
