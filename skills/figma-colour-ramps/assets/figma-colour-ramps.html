function renderFigmaPanel(){
  if (!figmaHost) return;
  const f = fig();
  figmaHost.innerHTML = '';
  const panel = el('div','ex-panel');

  const phd = el('div','card-hd'); phd.style.marginBottom='10px';
  phd.appendChild(el('div','card-title','Write to a Figma file'));
  const chip = el('span','lock-note');
  chip.textContent = f.status==='ok' ? 'Connected' : f.status==='checking' ? 'Checking…' : f.status==='error' ? 'Not connected' : 'Not connected yet';
  if (f.status==='ok'){ chip.style.background='#EAF6EE'; chip.style.color='#14663A'; }
  phd.appendChild(chip);
  panel.appendChild(phd);

  /* ---------- step 1 ---------- */
  const s1 = el('div','ex-step');
  if (f.status==='ok') s1.setAttribute('data-done','');
  const s1h = el('h5'); s1h.innerHTML = '<span class="ex-num">1</span> Connect and check';
  s1.appendChild(s1h);
  s1.appendChild(el('p','hint','Opens the file, verifies that variables can actually be written, '
    + 'and reads the variable collections already in it.'));

  /* the skill records here whether Figma was reachable when this
     view was built, so the panel can say so before anyone clicks */
  const unbound = !figmaBridgeReady() || !(window.__FIGMA_TOOLS__ || []).length;
  if (unbound){
    const w = el('div','status warn');
    w.innerHTML = '<b>Figma is not connected in this session.</b> '
      + (window.__FIGMA_STATUS__ || 'The Figma MCP server was not available when this view was built, so writing straight into a file is unavailable.')
      + '<ul><li>Authorise the Figma connector, then ask the agent to rebuild this view.</li>'
      + '<li>Make sure the Figma desktop app is running with its MCP server enabled.</li>'
      + '<li>Copy or Download above still produces the full variable manifest.</li></ul>';
    s1.appendChild(w);
  }
  const r1 = el('div','row'); r1.style.marginTop='9px';
  const url = el('input','inp grow');
  url.placeholder='https://www.figma.com/design/…';
  url.value = f.url || '';
  url.oninput = function(){ f.url = url.value; };
  url.onkeydown = function(ev){ if (ev.key==='Enter') figmaConnect(); };
  const go = el('button','btn primary', f.status==='checking' ? 'Checking…' : (f.status==='ok' ? 'Re-check' : 'Connect'));
  go.style.flex='none';
  go.disabled = f.status==='checking';
  go.onclick = figmaConnect;
  r1.appendChild(url); r1.appendChild(go);
  if (f.status==='ok'){
    const tick = el('span','ok-tick');
    tick.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Success';
    r1.appendChild(tick);
  }
  s1.appendChild(r1);

  if (f.status==='error'){
    const st = el('div','status bad');
    let html = '<b>' + f.error + '</b>';
    if (f.hints.length) html += '<ul>' + f.hints.map(function(h){ return '<li>'+h+'</li>'; }).join('') + '</ul>';
    st.innerHTML = html;
    s1.appendChild(st);
  }
  if (f.status==='ok'){
    const st = el('div','status ok');
    const n = f.collections.length;
    st.innerHTML = 'Connected to <b>' + escHtml(f.file ? f.file.name : '') + '</b> · write access confirmed · '
      + (n ? n + ' variable collection' + (n===1?'':'s') + ' in this file'
          : 'no variable collections yet');
    s1.appendChild(st);
    s1.appendChild(figmaWherePicker());

    const clashes = figmaTargets().filter(function(t){ return t.clash; });
    if (clashes.length){
      const w = el('div','status warn');
      w.innerHTML = '<b>' + clashes.length + ' name conflict' + (clashes.length>1?'s':'') + '</b> — '
        + clashes.map(function(c){ return c.name; }).join(', ') + ' already exist in this collection.';
      const b = el('button','btn sm','Resolve conflicts');
      b.style.marginTop='8px'; b.onclick = figmaConflictModal;
      w.appendChild(document.createElement('br')); w.appendChild(b);
      s1.appendChild(w);
    }
  }
  panel.appendChild(s1);

  /* ---------- step 2 ---------- */
  const s2 = el('div','ex-step');
  if (f.status!=='ok') s2.setAttribute('data-off','');
  const s2h = el('h5'); s2h.innerHTML = '<span class="ex-num">2</span> What will be written';
  s2.appendChild(s2h);
  const targets = figmaTargets();
  const on = targets.filter(function(t){ return t.on; });
  const md = figMode();
  s2.appendChild(el('p','hint','Collection <code>' + escHtml(figCollectionName() || '—') + '</code>'
    + (figGroup() ? ' · group <code>' + escHtml(figGroup()) + '</code>' : ' · no group, ramps sit at the root')
    + ' · mode <code>' + escHtml(md ? md.name : 'Value') + '</code>'
    + (figCreatingCollection() ? ' · <b>will be created</b>' : '')));
  const list = el('div'); list.style.marginTop='6px';
  targets.forEach(function(t){
    const row = el('div','wrt-row');
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = t.on; cb.disabled = (t.conflict.action==='skip');
    cb.onchange = function(){ fig().unchecked[t.pal.id] = !cb.checked; renderFigmaPanel(); };
    const mini = el('div','mini');
    t.ramp.forEach(function(x){ const i=el('i'); i.style.background=x.hex; mini.appendChild(i); });
    const nm = el('div','wrt-name');
    nm.innerHTML = (figGroup() ? escHtml(figGroup()) + ' / ' : '') + '<b>' + escHtml(t.target || '—') + '</b> / 50…950'
      + (figmaRenamed(t.pal) ? ' <span class="wrt-was">was ' + escHtml(figmaFullName(t.pal)) + '</span>' : '')
      + (t.target !== t.name ? ' <span class="wrt-was">(instead of ' + escHtml(t.name) + ')</span>' : '');
    nm.title = nm.textContent;
    if (!t.on) row.classList.add('off');
    row.appendChild(cb); row.appendChild(mini); row.appendChild(nm);

    /* a row that is not going anywhere carries no choices — one tag
       saying so is the whole story */
    if (!t.on){
      const tags = el('div','wrt-tags');
      tags.appendChild(el('span','badge tag-skip','Will be skipped'));
      row.appendChild(tags);
      list.appendChild(row);
      return;
    }

    /* the in-place switch, offered only where it can actually work */
    if (fromFigma(t.pal)){
      const ov = el('label','ov' + (t.block ? ' off' : ''));
      const ob = document.createElement('input');
      ob.type = 'checkbox';
      ob.checked = t.over;
      ob.disabled = !!t.block;
      ob.onchange = function(){ fig().overwrite[t.pal.id] = ob.checked; renderFigmaPanel(); };
      const info = el('span','ov-i'); info.innerHTML = INFO_GLYPH;
      info.title = figmaOverwriteHelp(t);
      info.setAttribute('tabindex','0');
      info.setAttribute('role','img');
      info.setAttribute('aria-label', figmaOverwriteHelp(t));
      ov.appendChild(ob);
      ov.appendChild(el('span','ov-t','Overwrite ramp in Figma'));
      ov.appendChild(info);
      if (t.block) ov.title = figmaOverwriteHelp(t);
      row.appendChild(ov);
    }

    const cen = figCensus(t);
    if (cen && cen.inGroup !== STEPS.length){
      const m = el('span','wrt-cen', cen.inGroup + ' in file');
      m.title = (t.over ? 'The group this ramp came from holds ' : 'A ramp of this name already holds ')
        + cen.inGroup + ' variable' + (cen.inGroup===1?'':'s') + ', not ' + STEPS.length + '.\n'
        + (cen.missing ? cen.missing + ' will be created to complete the scale.\n' : '')
        + (cen.extra ? cen.extra + ' sit outside 50…950 and are left untouched.' : '');
      row.appendChild(m);
    }

    const tags = el('div','wrt-tags');
    if (fromFigma(t.pal)){
      const src = el('span','badge tag-fig');
      src.innerHTML = FIGMA_GLYPH + '<span>From Figma</span>';
      src.title = 'Imported from ' + figmaWhere(t.pal);
      tags.appendChild(src);
    }
    const tg = el('span','badge ' + t.cls); tg.textContent = t.tag;
    tags.appendChild(tg);
    row.appendChild(tags);
    list.appendChild(row);
  });
  s2.appendChild(list);
  const inPlace = on.filter(function(t){ return t.over; }).length;
  s2.appendChild(el('p','hint', on.length + ' ramp' + (on.length===1?'':'s') + ' · '
    + (on.length*STEPS.length) + ' variables · written one ramp per call'
    + (inPlace ? ' · <b>' + inPlace + '</b> overwritten in place' : '')));
  panel.appendChild(s2);

  /* ---------- step 3 ---------- */
  const s3 = el('div','ex-step');
  const unresolved = figmaConflictsUnresolved();
  if (f.status!=='ok') s3.setAttribute('data-off','');
  const s3h = el('h5'); s3h.innerHTML = '<span class="ex-num">3</span> Write';
  s3.appendChild(s3h);
  const wr = f.write;
  const r3 = el('div','row'); r3.style.marginTop='6px';
  const wb = el('button','btn primary', wr && wr.status==='running' ? 'Writing…' : 'Write ' + (on.length*STEPS.length) + ' variables');
  wb.id = 'btnFigWrite';
  wb.disabled = !figReady() || f.status!=='ok' || !on.length || unresolved.length>0 || (wr && wr.status==='running');
  wb.onclick = figmaWriteRequested;
  r3.appendChild(wb);
  if (unresolved.length) r3.appendChild(el('span','hint','Resolve the name conflicts first'));
  s3.appendChild(r3);

  if (wr){
    if (wr.status==='running'){
      const st = el('div','status info');
      st.innerHTML = '<b>' + wr.step + '</b> ' + wr.done + ' of ' + wr.total + ' ramps done.';
      s3.appendChild(st);
    } else if (wr.status==='error'){
      const st = el('div','status bad');
      st.innerHTML = '<b>Write failed.</b> ' + wr.error
        + '<ul><li>Nothing is half-applied inside a failed script — Figma runs each one atomically.</li>'
        + '<li>Ramps written before the failure are already in the file; re-running will update them in place.</li></ul>';
      s3.appendChild(st);
    } else {
      const okAll = wr.status==='done';
      const st = el('div','status ' + (okAll?'ok':'warn'));
      let html = '<b>' + (okAll ? 'Written and verified.' : 'Written with warnings.') + '</b><ul>'
        + (wr.createdCollection ? '<li>Collection <b>' + escHtml(figCollectionName()) + '</b> created.</li>'
           : (wr.total > wr.inPlace ? '<li>Wrote into the existing <b>' + escHtml(figCollectionName()) + '</b> collection.</li>' : ''))
        + (wr.inPlace ? '<li><b>' + wr.inPlace + '</b> ramp' + (wr.inPlace===1?'':'s')
             + ' overwritten in place — the same variables, same ids, so every link in the file still holds.</li>' : '')
        + (wr.renamed ? '<li>' + wr.renamed + ' existing variables renamed.</li>' : '')
        + '<li>' + wr.created + ' variables created, ' + wr.updated + ' updated.</li>';
      if (wr.verify){
        html += '<li>Verified ' + wr.verify.matched + ' of ' + wr.verify.checked + ' values by reading them back.</li>';
        if (wr.verify.missing.length) html += '<li>Missing: ' + escHtml(wr.verify.missing.join(', ')) + '</li>';
        if (wr.verify.wrong.length) html += '<li>Mismatched: ' + escHtml(wr.verify.wrong.join(', ')) + '</li>';
        if (wr.verify.totalInCollection) html += '<li>' + wr.verify.totalInCollection + ' variables now in <b>' + escHtml(figCollectionName()) + '</b>.</li>';
      }
      /* things that went differently than asked, but did not fail */
      if (wr.lost && wr.lost.length)
        html += '<li>Some variables were gone from the file and had to be recreated, so anything linked to the old ones '
             + 'still shows the old colour — ' + escHtml(wr.lost.join('; ')) + '.</li>';
      if (wr.modeFallback && wr.modeFallback.length)
        html += '<li>The mode these came from no longer exists, so the first mode was used instead — '
             + escHtml(wr.modeFallback.join(', ')) + '.</li>';
      if (wr.strays && wr.strays.length){
        const lb = wr.leftBehind || [];
        html += '<li>Not part of a 50…950 scale, so left exactly as they were: <b>'
             + escHtml(wr.strays.slice(0,6).join(', ')) + '</b>'
             + (wr.strays.length>6 ? ' and ' + (wr.strays.length-6) + ' more' : '')
             + '. They still carry their old colours'
             + (lb.length ? ', and because a group in Figma is only a prefix, they stayed under the old name' : '')
             + '.</li>';
      }
      st.innerHTML = html + '</ul>';
      s3.appendChild(st);
    }
  }
  panel.appendChild(s3);

  figmaHost.appendChild(panel);
}

function allRamps(){
  return state.palettes.map(function(p){ return {pal:p, ramp:resolveRamp(p, true)}; }).filter(function(x){ return x.ramp; });
}

const FIGMA_COLLECTION = 'Primitives';
const FIGMA_GROUP = 'Colours';
const FIGMA_SCOPES = ['FRAME_FILL','SHAPE_FILL','TEXT_FILL','STROKE_COLOR','EFFECT_COLOR'];

/* The Figma MCP server is registered under a per-session id, so the
   tool name is resolved at runtime: whatever the skill injected
   first, then a few conventional names. The winner is remembered. */
const FIGMA_FALLBACK_TOOLS = ['mcp__figma__use_figma','mcp__Figma__use_figma','mcp__figma-mcp__use_figma'];
let FIGMA_TOOL = null;
function figmaCandidates(){
  const injected = (window.__FIGMA_TOOLS__ || []).filter(function(n){ return typeof n === 'string' && n; });
  const seen = {}, out = [];
  injected.concat(FIGMA_FALLBACK_TOOLS).forEach(function(n){ if(!seen[n]){ seen[n]=1; out.push(n); } });
  return out;
}
function figmaBridgeReady(){ return !!(window.cowork && typeof window.cowork.callMcpTool === 'function'); }
function looksLikeMissingTool(msg){
  return /unknown tool|no such tool|not found|not available|unrecognis|unrecogniz|not permitted|not allowed|disallow/i.test(String(msg||''));
}

/* ============================================================
   11. FIGMA BRIDGE
   The panel talks to the Figma Plugin API through Cowork's MCP
   bridge. Every call is a small, self-contained script whose only
   output channel is its return value.
   ============================================================ */
function mcpText(r){
  if (!r) return '';
  if (typeof r === 'string') return r;
  if (Array.isArray(r.content) && r.content.length && r.content[0] && r.content[0].text) return r.content[0].text;
  return '';
}
async function figmaCall(tool, fileKey, code, description){
  return window.cowork.callMcpTool(tool, {
    fileKey: fileKey, code: code, description: description, skillNames: 'figma-use'
  });
}
async function figmaRun(fileKey, code, description){
  if (!figmaBridgeReady()){
    const e = new Error('The Figma bridge is not available in this view.'); e.code='NO_BRIDGE'; throw e;
  }
  let r = null;
  if (FIGMA_TOOL){
    r = await figmaCall(FIGMA_TOOL, fileKey, code, description);
  } else {
    /* first run: find which registered tool name actually answers */
    const tried = [];
    const cands = figmaCandidates();
    for (let i=0;i<cands.length;i++){
      try {
        const res = await figmaCall(cands[i], fileKey, code, description);
        const t = mcpText(res);
        if (res && res.isError && looksLikeMissingTool(t)){ tried.push(cands[i]+': '+t); continue; }
        FIGMA_TOOL = cands[i]; r = res; break;
      } catch(err){
        if (looksLikeMissingTool(err && err.message)){ tried.push(cands[i]+': '+(err.message||'')); continue; }
        throw err;
      }
    }
    if (!r){
      const e = new Error('No Figma tool answered in this session. Tried: ' + (tried.length ? cands.join(', ') : 'none'));
      e.code='NO_TOOL'; throw e;
    }
  }
  const txt = mcpText(r);
  if (r && r.isError){ const e = new Error(txt || 'Figma returned an error'); e.code='TOOL_ERROR'; throw e; }
  let payload = r && r.structuredContent;
  if (payload === undefined || payload === null){
    try { payload = JSON.parse(txt); }
    catch(err){ const e = new Error(txt || 'Figma returned an empty response'); e.code='BAD_PAYLOAD'; throw e; }
  }
  return payload;
}
function parseFigmaKey(url){
  const m = String(url||'').match(/figma\.com\/(?:design|file|board|slides)\/([0-9a-zA-Z]{22,128})/);
  return m ? m[1] : null;
}
function figmaTones(pal){
  const ramp = resolveRamp(pal, true) || [];
  return ramp.map(function(t){
    const c = hexToRgb(t.hex);
    return { step:t.step, hex:t.hex, rgb:{ r:+c[0].toFixed(6), g:+c[1].toFixed(6), b:+c[2].toFixed(6) } };
  });
}

/* --- script 2: make sure the collection exists and apply renames --- */
function figmaPrepareScript(renames){
  const f = fig();
  const makeNew = figCreatingCollection();
  return "const RENAMES = " + JSON.stringify(renames) + ";\n" +
  "const WANT_ID = " + JSON.stringify(makeNew ? null : f.collectionId) + ";\n" +
  "const WANT_NAME = " + JSON.stringify(figCollectionName()) + ";\n" +
  "const PREFIX = " + JSON.stringify(figPrefix()) + ";\n" +
  "const WANT_MODE = " + JSON.stringify(makeNew ? null : (fig().modeId || null)) + ";\n" +
  "var cols = await figma.variables.getLocalVariableCollectionsAsync();\n" +
  "var col = null;\n" +
  "if (WANT_ID) for (var i=0;i<cols.length;i++) if (cols[i].id === WANT_ID) col = cols[i];\n" +
  "if (!col) for (var j=0;j<cols.length;j++) if (cols[j].name === WANT_NAME) col = cols[j];\n" +
  "var createdCollection = false;\n" +
  "if (!col){ col = figma.variables.createVariableCollection(WANT_NAME); createdCollection = true; }\n" +
  "var modeId = col.modes[0].modeId, modeName = col.modes[0].name;\n" +
  "if (WANT_MODE) col.modes.forEach(function(m){ if (m.modeId === WANT_MODE){ modeId = m.modeId; modeName = m.name; } });\n" +
  "var renamed = [];\n" +
  "if (RENAMES.length){\n" +
  "  var all = await figma.variables.getLocalVariablesAsync();\n" +
  "  all.filter(function(v){ return v.variableCollectionId === col.id; }).forEach(function(v){\n" +
  "    if (PREFIX && v.name.indexOf(PREFIX) !== 0) return;\n" +
  "    var rest = PREFIX ? v.name.slice(PREFIX.length) : v.name;\n" +
  "    var p = rest.split('/');\n" +
  "    if (p.length < 2) return;\n" +
  "    RENAMES.forEach(function(rn){\n" +
  "      if (p[0] === rn.from){\n" +
  "        v.name = PREFIX + [rn.to].concat(p.slice(1)).join('/'); renamed.push(v.name);\n" +
  "      }\n" +
  "    });\n" +
  "  });\n" +
  "}\n" +
  "return { collectionId: col.id, collectionName: col.name, modeId: modeId, modeName: modeName,\n" +
  "         createdCollection: createdCollection, renamedCount: renamed.length, mutatedVariableNames: renamed };";
}

/* --- script 3: write one palette --- */
function figmaWriteScript(collectionId, modeId, ramp, slugName, tones){
  return "const COLLECTION_ID = " + JSON.stringify(collectionId) + ";\n" +
  "const MODE_ID = " + JSON.stringify(modeId) + ";\n" +
  "const RAMP = " + JSON.stringify(ramp) + ";\n" +
  "const PREFIX = " + JSON.stringify(figPrefix()) + ";\n" +
  "const SLUG = " + JSON.stringify(slugName) + ";\n" +
  "const TONES = " + JSON.stringify(tones) + ";\n" +
  "const SCOPES = " + JSON.stringify(FIGMA_SCOPES) + ";\n" +
  "var col = await figma.variables.getVariableCollectionByIdAsync(COLLECTION_ID);\n" +
  "if (!col) throw new Error('Collection ' + COLLECTION_ID + ' no longer exists');\n" +
  "var all = await figma.variables.getLocalVariablesAsync();\n" +
  "var byName = {};\n" +
  "all.forEach(function(v){ if (v.variableCollectionId === col.id) byName[v.name] = v; });\n" +
  "var created = [], updated = [], ids = [];\n" +
  "TONES.forEach(function(t){\n" +
  "  var name = PREFIX + RAMP + '/' + t.step;\n" +
  "  var v = byName[name];\n" +
  "  if (v){ updated.push(name); } else { v = figma.variables.createVariable(name, col, 'COLOR'); created.push(name); }\n" +
  "  v.scopes = SCOPES;\n" +
  "  v.setValueForMode(MODE_ID, t.rgb);\n" +
  "  v.description = RAMP + ' ' + t.step + ' \\u00b7 ' + t.hex;\n" +
  "  try { v.setVariableCodeSyntax('WEB', 'var(--' + SLUG + '-' + t.step + ')'); } catch(e){}\n" +
  "  ids.push(v.id);\n" +
  "});\n" +
  "return { ramp: RAMP, created: created.length, updated: updated.length, variableIds: ids };";
}

/* --- script 3b: write a ramp onto the variables it came from ---
   Everything here hangs off variable ids. An id survives a rename and a
   value change, so fills, strokes, aliases and published keys all keep
   pointing at the same variable and repaint on their own. Nothing is
   created unless a tone was missing from the import, and nothing is
   ever deleted — a leftover like grey/1000 is left alone and reported. */
function figmaInPlaceScript(pal, tones){
  const src = pal.source;
  const parent = String(src.group || '').split('/').slice(0, -1).join('/');
  const path = (parent ? parent + '/' : '') + (pal.name || '').trim();
  const byStep = {};
  tones.forEach(function(t){ byStep[t.step] = t; });
  return "const IDS = " + JSON.stringify(src.variableIds || {}) + ";\n" +
  "const TONES = " + JSON.stringify(tones) + ";\n" +
  "const PATH = " + JSON.stringify(path) + ";\n" +
  "const OLD_PATH = " + JSON.stringify(String(src.group || '')) + ";\n" +
  "const RAMP = " + JSON.stringify((pal.name || '').trim()) + ";\n" +
  "const SLUG = " + JSON.stringify(slug(pal.name || 'ramp')) + ";\n" +
  "const MODE_ID = " + JSON.stringify(src.modeId || null) + ";\n" +
  "const COLLECTION_ID = " + JSON.stringify(src.collectionId || null) + ";\n" +
  "const SCOPES = " + JSON.stringify(FIGMA_SCOPES) + ";\n" +
  "var renamed = [], updated = [], created = [], lost = [], ids = {};\n" +
  "var col = await figma.variables.getVariableCollectionByIdAsync(COLLECTION_ID);\n" +
  "if (!col) throw new Error('The collection this ramp came from is gone from the file');\n" +
  "var modeId = MODE_ID;\n" +
  "var known = col.modes.some(function(m){ return m.modeId === modeId; });\n" +
  "if (!known){ modeId = col.modes[0].modeId; }\n" +
  "for (var i=0;i<TONES.length;i++){\n" +
  "  var t = TONES[i];\n" +
  "  var want = PATH + '/' + t.step;\n" +
  "  var v = null;\n" +
  "  if (IDS[t.step]) { try { v = await figma.variables.getVariableByIdAsync(IDS[t.step]); } catch(e){ v = null; } }\n" +
  "  if (v && v.variableCollectionId !== col.id) v = null;\n" +
  "  if (!v){\n" +
  "    if (IDS[t.step]) lost.push(String(t.step));\n" +
  "    v = figma.variables.createVariable(want, col, 'COLOR');\n" +
  "    created.push(want);\n" +
  "  } else {\n" +
  "    if (v.name !== want){ renamed.push(v.name + ' → ' + want); v.name = want; }\n" +
  "    updated.push(want);\n" +
  "  }\n" +
  "  v.scopes = SCOPES;\n" +
  "  v.setValueForMode(modeId, t.rgb);\n" +
  "  v.description = RAMP + ' ' + t.step + ' \\u00b7 ' + t.hex;\n" +
  "  try { v.setVariableCodeSyntax('WEB', 'var(--' + SLUG + '-' + t.step + ')'); } catch(e){}\n" +
  "  ids[t.step] = v.id;\n" +
  "}\n" +
  /* A group in Figma is only a prefix on a name, so renaming this ramp
     does not carry anything else along: a variable like colours/blue/base
     stays behind under the old prefix. Report both what stayed behind
     and what was already sitting beside the new name. */
  "var all = await figma.variables.getLocalVariablesAsync();\n" +
  "var strays = all.filter(function(x){\n" +
  "  if (x.variableCollectionId !== col.id) return false;\n" +
  "  var p = x.name.split('/'), parent = p.slice(0,-1).join('/');\n" +
  "  if (parent !== PATH && parent !== OLD_PATH) return false;\n" +
  "  return !ids[p[p.length-1]];\n" +
  "}).map(function(x){ return x.name; });\n" +
  "var leftBehind = strays.filter(function(n){ return n.indexOf(PATH + '/') !== 0; });\n" +
  "return { ramp: RAMP, path: PATH, collectionId: col.id, modeId: modeId,\n" +
  "         modeMissing: !known, created: created.length, updated: updated.length,\n" +
  "         renamedCount: renamed.length, renamed: renamed, lost: lost,\n" +
  "         strays: strays, leftBehind: leftBehind, variableIds: ids };";
}

/* --- script 4: read everything back and compare --- */
function figmaVerifyScript(collectionId, modeId, expected){
  return "const COLLECTION_ID = " + JSON.stringify(collectionId) + ";\n" +
  "const MODE_ID = " + JSON.stringify(modeId) + ";\n" +
  "const EXPECTED = " + JSON.stringify(expected) + ";\n" +
  "var all = await figma.variables.getLocalVariablesAsync();\n" +
  "var byName = {};\n" +
  "all.forEach(function(v){ if (v.variableCollectionId === COLLECTION_ID) byName[v.name] = v; });\n" +
  "var missing = [], wrong = [], okCount = 0;\n" +
  "EXPECTED.forEach(function(e){\n" +
  "  var v = byName[e.name];\n" +
  "  if (!v){ missing.push(e.name); return; }\n" +
  "  var val = v.valuesByMode[MODE_ID];\n" +
  "  if (!val || typeof val.r !== 'number'){ wrong.push(e.name); return; }\n" +
  "  var d = Math.abs(val.r-e.rgb.r) + Math.abs(val.g-e.rgb.g) + Math.abs(val.b-e.rgb.b);\n" +
  "  if (d > 0.002) wrong.push(e.name + ' (value drift)'); else okCount++;\n" +
  "});\n" +
  "return { checked: EXPECTED.length, matched: okCount, missing: missing, wrong: wrong,\n" +
  "         totalInCollection: Object.keys(byName).length };";
}

/* --- script 5: read the in-place ramp back by id --- */
function figmaVerifyIdsScript(expected){
  return "const EXPECTED = " + JSON.stringify(expected) + ";\n" +
  "var missing = [], wrong = [], okCount = 0;\n" +
  "for (var i=0;i<EXPECTED.length;i++){\n" +
  "  var e = EXPECTED[i], v = null;\n" +
  "  try { v = await figma.variables.getVariableByIdAsync(e.id); } catch(err){ v = null; }\n" +
  "  if (!v){ missing.push(e.name); continue; }\n" +
  "  if (v.name !== e.name){ wrong.push(v.name + ' (expected ' + e.name + ')'); continue; }\n" +
  "  var val = v.valuesByMode[e.modeId];\n" +
  "  if (!val || typeof val.r !== 'number'){ wrong.push(e.name); continue; }\n" +
  "  var d = Math.abs(val.r-e.rgb.r) + Math.abs(val.g-e.rgb.g) + Math.abs(val.b-e.rgb.b);\n" +
  "  if (d > 0.002) wrong.push(e.name + ' (value drift)'); else okCount++;\n" +
  "}\n" +
  "return { checked: EXPECTED.length, matched: okCount, missing: missing, wrong: wrong };";
}

function exportPayload(kind){
  const data = allRamps();
  if (!data.length) return '';

  /* ---- Figma REST API: POST /v1/files/:file_key/variables ----
     The real request body. Temporary ids tie the four arrays
     together in one atomic call: the collection carries an
     initialModeId, the variables reference the collection, and the
     values reference both. Enterprise orgs only, scope
     file_variables:write, body must stay under 4 MB. */
  if (kind==='figmaApi'){
    const COL = 'crs_collection', MODE = 'crs_mode';
    const variables = [], values = [];
    data.forEach(function(d){
      const ramp = (d.pal.name || 'Ramp').trim();
      d.ramp.forEach(function(t){
        const id = 'crs_' + slug(d.pal.name) + '_' + t.step;
        const rgb = hexToRgb(t.hex);
        variables.push({
          action:'CREATE', id:id,
          name: figExpPrefix() + ramp + '/' + t.step,
          variableCollectionId: COL,
          resolvedType:'COLOR',
          description: ramp + ' ' + t.step + ' · ' + t.hex,
          scopes: FIGMA_SCOPES,
          codeSyntax: { WEB: 'var(--' + slug(d.pal.name) + '-' + t.step + ')' }
        });
        values.push({ variableId:id, modeId:MODE,
          value:{ r:+rgb[0].toFixed(6), g:+rgb[1].toFixed(6), b:+rgb[2].toFixed(6), a:1 } });
      });
    });
    return JSON.stringify({
      variableCollections:[{ action:'CREATE', id:COL, name:figExpCollection(), initialModeId:MODE }],
      variableModes:[{ action:'UPDATE', id:MODE, name:'Value', variableCollectionId:COL }],
      variables: variables,
      variableModeValues: values
    }, null, 2);
  }

  /* ---- W3C Design Token Community Group format ----
     What the community import plugins actually read. */
  if (kind==='dtcg'){
    const group = {};
    data.forEach(function(d){
      const ramp = (d.pal.name || 'Ramp').trim();
      const tones = {};
      d.ramp.forEach(function(t){ tones[String(t.step)] = { $type:'color', $value:t.hex.toLowerCase() }; });
      group[ramp] = tones;
    });
    const root = {};
    root[figExpCollection()] = {};
    if (figExpGroup()) root[figExpCollection()][figExpGroup()] = group;
    else root[figExpCollection()] = group;
    return JSON.stringify(root, null, 2);
  }

  if (kind==='css'){
    let s = ':root {\n';
    data.forEach(function(d){
      s += '  /* ' + (d.pal.name || 'ramp') + ' */\n';
      d.ramp.forEach(function(t){ s += '  --' + slug(d.pal.name) + '-' + t.step + ': ' + t.hex.toLowerCase() + ';\n'; });
    });
    return s + '}';
  }
  if (kind==='json'){
    const o = {};
    data.forEach(function(d){ const k={}; d.ramp.forEach(function(t){ k[t.step]=t.hex; }); o[slug(d.pal.name)]=k; });
    return JSON.stringify(o,null,2);
  }
  return '';
}

/* ============================================================
   13. KEY COLOUR EXTRACTOR
   Ported from the standalone lab. Reuses this file's OKLab core;
   only the clustering, the image plumbing and the modal are new.
   ============================================================ */
const XT_DEFAULTS = {
  want:5, k:8, minChroma:0.035, minL:0.10, maxL:0.95,
  chromaW:0.60, minHueSep:22, includeNeutral:true, iters:30, seed:12345
};
let xt = null;   /* live only while the modal is open */

function xtRnd(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function xtNearestStep(L){
  let best=0, bd=Infinity;
  for (let i=0;i<BASE_L.length;i++){ const d=Math.abs(BASE_L[i]-L); if (d<bd){ bd=d; best=i; } }
  return STEPS[best];
}
function xtHueDist(a,b){ const d=Math.abs(a-b)%360; return d>180?360-d:d; }

/* px: flat array of r,g,b in 0..1 */
function xtExtract(px, o){
  o = Object.assign({}, XT_DEFAULTS, o||{});
  const n = Math.floor(px.length/3);
  if (!n) return { colours:[], stats:{total:0,kept:0,keptPct:0,neutralFallback:false,iterations:0,clusters:0,requested:o.want,distinctFound:0} };

  const lab = new Float64Array(n*3), lch = new Float64Array(n*3);
  for (let i=0;i<n;i++){
    const t = rgbToOklab(px[i*3], px[i*3+1], px[i*3+2]);
    lab[i*3]=t[0]; lab[i*3+1]=t[1]; lab[i*3+2]=t[2];
    const c = oklabToOklch(t[0],t[1],t[2]);
    lch[i*3]=c[0]; lch[i*3+1]=c[1]; lch[i*3+2]=c[2];
  }

  let idx = [];
  for (let i=0;i<n;i++){
    if (lch[i*3+1] < o.minChroma) continue;
    if (lch[i*3] < o.minL || lch[i*3] > o.maxL) continue;
    idx.push(i);
  }
  let neutralFallback = false;
  if (idx.length < Math.max(24, n*0.005)){
    neutralFallback = true; idx = [];
    for (let i=0;i<n;i++) idx.push(i);
  }

  const k = Math.min(o.k, idx.length);
  const rnd = xtRnd(o.seed + k*7919);
  const cen = new Float64Array(k*3);
  const first = idx[Math.floor(rnd()*idx.length)];
  cen[0]=lab[first*3]; cen[1]=lab[first*3+1]; cen[2]=lab[first*3+2];
  const d2 = new Float64Array(idx.length).fill(Infinity);
  for (let c=1;c<k;c++){
    let sum=0;
    for (let j=0;j<idx.length;j++){
      const i=idx[j];
      const dl=lab[i*3]-cen[(c-1)*3], da=lab[i*3+1]-cen[(c-1)*3+1], db=lab[i*3+2]-cen[(c-1)*3+2];
      const d=dl*dl+da*da+db*db;
      if (d<d2[j]) d2[j]=d;
      sum+=d2[j];
    }
    let r = rnd()*sum, pick = idx[idx.length-1];
    for (let j=0;j<idx.length;j++){ r-=d2[j]; if (r<=0){ pick=idx[j]; break; } }
    cen[c*3]=lab[pick*3]; cen[c*3+1]=lab[pick*3+1]; cen[c*3+2]=lab[pick*3+2];
  }

  const assign = new Int32Array(idx.length);
  const sum = new Float64Array(k*3), cnt = new Float64Array(k);
  let iterations = 0;
  for (let it=0; it<o.iters; it++){
    iterations++;
    let moved = 0;
    sum.fill(0); cnt.fill(0);
    for (let j=0;j<idx.length;j++){
      const i=idx[j];
      let best=0, bd=Infinity;
      for (let c=0;c<k;c++){
        const dl=lab[i*3]-cen[c*3], da=lab[i*3+1]-cen[c*3+1], db=lab[i*3+2]-cen[c*3+2];
        const d=dl*dl+da*da+db*db;
        if (d<bd){ bd=d; best=c; }
      }
      if (assign[j]!==best){ assign[j]=best; moved++; }
      sum[best*3]+=lab[i*3]; sum[best*3+1]+=lab[i*3+1]; sum[best*3+2]+=lab[i*3+2]; cnt[best]++;
    }
    for (let c=0;c<k;c++) if (cnt[c]){ cen[c*3]=sum[c*3]/cnt[c]; cen[c*3+1]=sum[c*3+1]/cnt[c]; cen[c*3+2]=sum[c*3+2]/cnt[c]; }
    if (!moved) break;
  }

  let cands = [];
  for (let c=0;c<k;c++){
    if (!cnt[c]) continue;
    const p = oklabToOklch(cen[c*3], cen[c*3+1], cen[c*3+2]);
    const g = clampToGamut(p[0], p[1], p[2]);
    const rgb = oklchToRgb(g[0],g[1],g[2]);
    cands.push({ L:g[0], C:g[1], h:g[2], hex:rgbToHex(rgb), rgb:rgb,
      share: cnt[c]/n, count:cnt[c],
      score: (cnt[c]/idx.length) * Math.pow(Math.max(g[1],0.004), o.chromaW) });
  }
  cands.sort(function(a,b){ return b.score - a.score; });

  function pickWith(sep){
    const out = [];
    cands.forEach(function(c){
      if (out.length >= o.want) return;
      const tooClose = out.some(function(k2){
        const bothNeutral = c.C < 0.03 && k2.C < 0.03;
        if (bothNeutral) return Math.abs(c.L - k2.L) < 0.10;
        if (c.C < 0.03 || k2.C < 0.03) return false;
        return xtHueDist(c.h, k2.h) < sep && Math.abs(c.L - k2.L) < 0.22;
      });
      if (!tooClose) out.push(c);
    });
    return out;
  }
  let out = pickWith(o.minHueSep);
  const relax = [0.6, 0.35];
  for (let i=0; i<relax.length && out.length < o.want; i++){
    const wider = pickWith(o.minHueSep*relax[i]);
    if (wider.length > out.length) out = wider;
  }
  const distinctFound = out.length;

  let neutral = null;
  if (o.includeNeutral && !neutralFallback){
    let sC=0, w=0;
    const buckets = new Float64Array(11), bw = new Float64Array(11);
    for (let i=0;i<n;i++){
      if (lch[i*3+1] >= o.minChroma) continue;
      const b = Math.max(0, Math.min(10, Math.floor(lch[i*3]*11)));
      buckets[b] += lch[i*3]; bw[b]++;
      sC += lch[i*3+1]; w++;
    }
    if (w > n*0.02){
      let bi=0; for (let i=1;i<11;i++) if (bw[i]>bw[bi]) bi=i;
      const g = clampToGamut(buckets[bi]/bw[bi], sC/w, 0);
      const rgb = oklchToRgb(g[0],g[1],g[2]);
      neutral = { L:g[0], C:g[1], h:g[2], hex:rgbToHex(rgb), rgb:rgb,
                  share: bw[bi]/n, count:bw[bi], score:0, isNeutral:true };
    }
  }
  if (neutral) out = out.concat([neutral]);
  out.forEach(function(c){ c.step = xtNearestStep(c.L); });

  return { colours: out,
    stats:{ total:n, kept:idx.length, keptPct:n?idx.length/n:0, neutralFallback:neutralFallback,
            iterations:iterations, clusters:cands.length, requested:o.want, distinctFound:distinctFound } };
}

/* ---- image → pixels ---- */
function xtDownscale(img, target){
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const scale = Math.min(1, target/Math.max(w,h));
  const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
  let src = document.createElement('canvas');
  src.width=w; src.height=h;
  src.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0);
  while (w > cw*2 && h > ch*2){
    const nw = Math.max(cw, Math.floor(w/2)), nh = Math.max(ch, Math.floor(h/2));
    const step = document.createElement('canvas');
    step.width=nw; step.height=nh;
    const sc = step.getContext('2d',{willReadFrequently:true});
    sc.imageSmoothingEnabled=true; sc.imageSmoothingQuality='high';
    sc.drawImage(src,0,0,nw,nh);
    src = step; w=nw; h=nh;
  }
  const out = document.createElement('canvas');
  out.width=cw; out.height=ch;
  const oc = out.getContext('2d',{willReadFrequently:true});
  oc.imageSmoothingEnabled=true; oc.imageSmoothingQuality='high';
  oc.drawImage(src,0,0,cw,ch);
  return out;
}
function xtPixels(cv){
  const d = cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height).data;
  const px = [];
  for (let i=0;i<d.length;i+=4){
    if (d[i+3] < 128) continue;
    px.push(d[i]/255, d[i+1]/255, d[i+2]/255);
  }
  return px;
}

function xtKey(ev){ if (ev.key==='Escape' && xt) xtAskClose(); }
function xtClose(){

function xtAskClose(){

    ? 'You have <b>'+n+'</b> colour'+(n>1?'s':'')+' selected. Closing throws the extraction away — the image, the markers you moved and the settings all go with it.'
    : 'The extraction will be discarded.'));
  const row = el('div','row'); row.style.marginTop='14px';
  const ok = el('button','btn primary','Close and discard');
  ok.onclick = function(){ document.body.removeChild(wrap); xtClose(); };

  no.onclick = function(){ document.body.removeChild(wrap); };
  row.appendChild(ok); row.appendChild(no);
  box.appendChild(row); wrap.appendChild(box);
  wrap.onclick = function(ev){ if (ev.target===wrap) document.body.removeChild(wrap); };

}
function xtFileInput(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    if (f) xtReadFile(f, function(im,nm){
      xt.img=im; xt.name=nm; xt.small=null;
      xt.overrides={}; xt.stepOverrides={}; xt.deselected={};
      xtRun();
    });
    inp.remove();
  };
  document.body.appendChild(inp); inp.click();
}
function xtReadFile(file, cb){
  if (!/^image\//.test(file.type)){ toast('That is not an image'); return; }
  const fr = new FileReader();
  fr.onload = function(){
    const im = new Image();
    im.onload = function(){ cb(im, file.name || 'image'); };
    im.onerror = function(){ toast('Could not read that image'); };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---- selection + overrides ---- */
function xtPickedFlag(i){ return xt.deselected[i] !== true; }
function xtColours(){
  if (!xt || !xt.result) return [];
  if (xt.showCompare) return xt.compare.colours;
  return xt.result.colours.map(function(c,i){
    let out = c;
    const o = xt.overrides[i];
    if (o){
      const g = clampToGamut(o.L, o.C, o.h);
      const rgb = oklchToRgb(g[0],g[1],g[2]);
      out = Object.assign({}, c, {L:g[0],C:g[1],h:g[2],hex:rgbToHex(rgb),rgb:rgb,manual:true,step:xtNearestStep(g[0])});
    }
    const st = xt.stepOverrides[i];
    if (st!==undefined && st!==null) out = Object.assign({}, out, {step:st, stepManual:true});
    return out;
  });
}
function xtPicked(){ return xtColours().filter(function(_,i){ return xtPickedFlag(i); }); }

/* ---- scatter ---- */
const XT_PAD = {l:40, r:14, t:14, b:26};
function xtBuildScatter(){
  const wrap = el('div','scat-wrap');
  const cv = document.createElement('canvas'); cv.className='scat-canvas';
  const layer = el('div','scat-layer');
  wrap.appendChild(cv); wrap.appendChild(layer);
  const markers = [];

  const geom = function(){ const r = wrap.getBoundingClientRect(); return {w:r.width||600, h:r.height||300, rect:r}; };
  const xOf = function(h,g){ return XT_PAD.l + (h/360)*(g.w-XT_PAD.l-XT_PAD.r); };
  const yOf = function(C,g){ return XT_PAD.t + (1-Math.min(1,C/xt.maxC))*(g.h-XT_PAD.t-XT_PAD.b); };
  const hOf = function(px,g){ return Math.max(0, Math.min(360,(px-XT_PAD.l)/(g.w-XT_PAD.l-XT_PAD.r)*360)); };
  const cOf = function(py,g){ return Math.max(0, Math.min(xt.maxC,(1-(py-XT_PAD.t)/(g.h-XT_PAD.t-XT_PAD.b))*xt.maxC)); };

  const paint = function(){
    const g = geom(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(g.w*dpr); cv.height = Math.round(g.h*dpr);
    cv.style.width = g.w+'px'; cv.style.height = g.h+'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#FBFBFC'; ctx.fillRect(0,0,g.w,g.h);
    if (!xt.pixels) return;
    const yCut = yOf(xt.opts.minChroma, g);
    ctx.fillStyle='rgba(194,43,43,.05)';
    ctx.fillRect(XT_PAD.l, yCut, g.w-XT_PAD.l-XT_PAD.r, g.h-XT_PAD.b-yCut);
    ctx.strokeStyle='#ECECEF'; ctx.lineWidth=1;
    for (let i=0;i<=6;i++){ const x=XT_PAD.l+i*(g.w-XT_PAD.l-XT_PAD.r)/6; ctx.beginPath(); ctx.moveTo(x,XT_PAD.t); ctx.lineTo(x,g.h-XT_PAD.b); ctx.stroke(); }
    for (let i=0;i<=4;i++){ const y=XT_PAD.t+i*(g.h-XT_PAD.t-XT_PAD.b)/4; ctx.beginPath(); ctx.moveTo(XT_PAD.l,y); ctx.lineTo(g.w-XT_PAD.r,y); ctx.stroke(); }
    const n = Math.floor(xt.pixels.length/3);
    const stride = Math.max(1, Math.floor(n/9000));
    for (let i=0;i<n;i+=stride){
      const t = rgbToOklab(xt.pixels[i*3],xt.pixels[i*3+1],xt.pixels[i*3+2]);
      const p = oklabToOklch(t[0],t[1],t[2]);
      const dim = (p[1] < xt.opts.minChroma || p[0] < xt.opts.minL || p[0] > xt.opts.maxL);
      ctx.globalAlpha = dim ? 0.16 : 0.62;
      ctx.fillStyle = 'rgb('+Math.round(clamp01(xt.pixels[i*3])*255)+','+Math.round(clamp01(xt.pixels[i*3+1])*255)+','+Math.round(clamp01(xt.pixels[i*3+2])*255)+')';
      ctx.fillRect(xOf(p[2],g)-1.2, yOf(p[1],g)-1.2, 2.6, 2.6);
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle='#C22B2B'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(XT_PAD.l,yCut); ctx.lineTo(g.w-XT_PAD.r,yCut); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#555559'; ctx.font='10px ui-monospace, monospace'; ctx.textAlign='center';
    for (let i=0;i<=6;i++){ const hue=i*60; ctx.fillText(hue+'°', xOf(hue,g), g.h-XT_PAD.b+14); }
    ctx.textAlign='right';
    for (let i=0;i<=4;i++) ctx.fillText((xt.maxC*(1-i/4)).toFixed(2), XT_PAD.l-7, XT_PAD.t+i*(g.h-XT_PAD.t-XT_PAD.b)/4+3);
  };

  const place = function(){
    const g = geom(), list = xtColours();
    while (markers.length < list.length){
      const m = el('div','mk');
      layer.appendChild(m); markers.push(m);
    }
    markers.forEach(function(m,i){
      const c = list[i];
      if (!c){ m.style.display='none'; return; }
      m.style.display='';
      m.style.left = xOf(c.h,g)+'px';
      m.style.top  = yOf(c.C,g)+'px';
      m.style.background = c.hex;
      m.classList.toggle('manual', !!c.manual);
      m.classList.toggle('neutral', !!c.isNeutral);
      m.classList.toggle('on', xt.drag===i);
      m.classList.toggle('off', !xt.showCompare && !xtPickedFlag(i));
      m.textContent = String(i+1);
      m.title = c.hex + (c.isNeutral?' · neutral':'') + (c.manual?' · moved by hand':'')
        + (!xt.showCompare && !xtPickedFlag(i) ? ' · not selected' : '') + '\nstep ' + c.step;
    });
  };

  /* The press belongs to the plot, not to the 26px circle: capturing on
     the same element that listens is what makes a drag survive, and
     grabbing near a marker beats having to hit it exactly. */
  const nearest = function(ev){
    const g = geom();
    const px = ev.clientX - g.rect.left, py = ev.clientY - g.rect.top;
    let best = -1, bd = Infinity;
    xtColours().forEach(function(c,i){
      const dx = xOf(c.h,g) - px, dy = yOf(c.C,g) - py;
      const d = dx*dx + dy*dy;
      if (d < bd){ bd = d; best = i; }
    });
    return { i:best, d:Math.sqrt(bd) };
  };
  wrap.addEventListener('pointerdown', function(ev){
    if (!xt || xt.showCompare) return;
    const hit = nearest(ev);
    if (hit.i < 0 || hit.d > 34) return;      /* pressed empty space */
    ev.preventDefault();
    xt.drag = hit.i;
    try { wrap.setPointerCapture(ev.pointerId); } catch(e){}
    place();
  });
  wrap.addEventListener('pointermove', function(ev){
    if (!xt || xt.drag < 0) return;
    ev.preventDefault();
    const g = geom(), i = xt.drag;
    const base = xtColours()[i]; if (!base) return;
    xt.overrides[i] = { L:(xt.overrides[i]?xt.overrides[i].L:base.L),
                        C:cOf(ev.clientY-g.rect.top,g), h:hOf(ev.clientX-g.rect.left,g) };
    /* patch what is on screen; rebuilding every card mid-drag is both
       wasteful and a good way to lose the drag */
    place(); xtPatchCard(i);
  });
  const end = function(ev){
    if (!xt || xt.drag < 0) return;
    const i = xt.drag; xt.drag = -1;
    try { if (ev && ev.pointerId!==undefined) wrap.releasePointerCapture(ev.pointerId); } catch(e){}
    if (xt.snap && xt.overrides[i]){
      const s = xtLocalMean(xt.overrides[i].h, xt.overrides[i].C);
      if (s) xt.overrides[i] = s;
    }
    place(); xtPalette();
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  wrap.addEventListener('lostpointercapture', end);

  return { node:wrap, refresh:function(){ paint(); place(); }, place:place };
}
function xtLocalMean(h, C){
  if (!xt.pixels) return null;
  const n = Math.floor(xt.pixels.length/3);
  let sl=0, sa=0, sb=0, w=0;
  const hTol = 7, cTol = Math.max(0.02, xt.maxC*0.09);
  for (let i=0;i<n;i++){
    const t = rgbToOklab(xt.pixels[i*3],xt.pixels[i*3+1],xt.pixels[i*3+2]);
    const p = oklabToOklch(t[0],t[1],t[2]);
    if (xtHueDist(p[2],h) > hTol) continue;
    if (Math.abs(p[1]-C) > cTol) continue;
    sl+=t[0]; sa+=t[1]; sb+=t[2]; w++;
  }
  if (w < 8) return null;
  const lch = oklabToOklch(sl/w, sa/w, sb/w);
  return { L:lch[0], C:lch[1], h:lch[2] };
}

/* ---- controls / cards / run ---- */
/* the two knobs people actually reach for stay in the open; the rest
   live behind More settings */
const XT_MAIN_TOGGLES = [
  ['includeNeutral','Also return the dominant neutral',
   'The chroma cut-off throws greys away, but a design system usually wants a grey ramp too.'],
  ['__snap','Snap a dropped marker to its cluster',
   'On release the marker takes the mean of the pixels around it instead of the raw drop point.']
];
const XT_CONTROLS = [
  ['k','Clusters fitted first',4,16,1,function(v){return v;}],
  ['minChroma','Min chroma kept',0,0.10,0.005,function(v){return v.toFixed(3);}],
  ['minL','Min lightness kept',0,0.40,0.01,function(v){return (v*100).toFixed(0)+'%';}],
  ['maxL','Max lightness kept',0.60,1,0.01,function(v){return (v*100).toFixed(0)+'%';}],
  ['chromaW','Colourfulness vs area',0,2,0.05,function(v){return v.toFixed(2);}],
  ['minHueSep','Min hue separation',0,60,1,function(v){return v+'°';}]
];

function xtControls(){
  /* --- headline settings --- */
  const main = document.getElementById('xtMain'); main.innerHTML='';
  const row = el('div','xt-main');

  const pick = el('div','xt-pick');
  pick.appendChild(el('span','lbl','Key colours to return'));
  const sel = el('select','inp');
  for (let n=3;n<=8;n++){ const o=el('option',null,String(n)); o.value=n; if (xt.opts.want===n) o.selected=true; sel.appendChild(o); }
  sel.onchange = function(){
    const was = xt.opts.want;
    xt.opts.want = Number(sel.value);
    if (xt.opts.want !== was){ xt.overrides={}; xt.stepOverrides={}; xt.deselected={}; }
    if (xt.opts.want > xt.opts.k){ xt.opts.k = xt.opts.want; }
    xtControls(); xtRun();
  };
  pick.appendChild(sel);
  row.appendChild(pick);

  XT_MAIN_TOGGLES.forEach(function(t){
    const lab = el('label','opt-row');
    const cb = document.createElement('input'); cb.type='checkbox';
    cb.checked = t[0]==='__snap' ? xt.snap : !!xt.opts[t[0]];
    cb.onchange = function(){ if (t[0]==='__snap') xt.snap = cb.checked; else { xt.opts[t[0]] = cb.checked; xtRun(); } };
    const sp = el('span'); sp.innerHTML = '<b>'+t[1]+'</b><em>'+t[2]+'</em>';
    lab.appendChild(cb); lab.appendChild(sp);
    row.appendChild(lab);
  });
  main.appendChild(row);

  /* --- the rest --- */
  const host = document.getElementById('xtControls'); host.innerHTML='';
  XT_CONTROLS.forEach(function(c){
    const w = el('div','slider'), top = el('div','top');
    top.appendChild(el('span','lbl',c[1]));
    const v = el('span','val', String(c[5](xt.opts[c[0]]))); top.appendChild(v);
    w.appendChild(top);
    const r = document.createElement('input');
    r.type='range'; r.min=c[2]; r.max=c[3]; r.step=c[4]; r.value=xt.opts[c[0]];
    r.oninput = function(){
      xt.opts[c[0]] = parseFloat(r.value);
      v.textContent = String(c[5](xt.opts[c[0]]));
      if (c[0]==='k' && xt.opts.k < xt.opts.want){ xt.opts.k = xt.opts.want; r.value = xt.opts.k; v.textContent = String(xt.opts.k); }
      xtRun();
    };
    w.appendChild(r); host.appendChild(w);
  });
  const pv = el('div','slider'), t2 = el('div','top');
  t2.appendChild(el('span','lbl','Downscale to (long edge)'));
  const v2 = el('span','val', xt.previewSize+' px'); t2.appendChild(v2);
  pv.appendChild(t2);
  const r2 = document.createElement('input');
  r2.type='range'; r2.min=48; r2.max=320; r2.step=8; r2.value=xt.previewSize;
  r2.oninput = function(){ xt.previewSize=parseInt(r2.value,10); v2.textContent=xt.previewSize+' px'; xt.small=null; xtRun(); };
  pv.appendChild(r2); host.appendChild(pv);
}

/* repaint one card without rebuilding the grid */
function xtPatchCard(i){
  const host = document.getElementById('xtPalette');
  if (!host) return;
  const card = host.querySelectorAll('.sw')[i];
  const c = xtColours()[i];
  if (!card || !c) return;
  const chip = card.querySelector('.chip');
  if (chip){ chip.style.background = c.hex; chip.style.color = inkOn(c.hex); }
  const hexEl = card.querySelector('.chip b');
  if (hexEl) hexEl.textContent = c.hex;
  const sel = card.querySelector('select.step');
  if (sel && !c.stepManual) sel.value = String(c.step);
}

function xtCard(c, i){
  const picked = xtPickedFlag(i);
  const box = el('div','sw' + (picked?'':' off'));
  const chip = el('div','chip');
  chip.style.background = c.hex; chip.style.color = inkOn(c.hex);
  const pick = el('label','pick');
  const cb = document.createElement('input');
  cb.type='checkbox'; cb.checked = picked;
  cb.title = 'Build a ramp from this colour';
  cb.onclick = function(ev){ ev.stopPropagation(); };
  cb.onchange = function(){ if (cb.checked) delete xt.deselected[i]; else xt.deselected[i]=true; xtPalette(); xt.scat.place(); };
  pick.appendChild(cb); pick.appendChild(el('span','num', String(i+1)));
  chip.appendChild(pick);
  chip.appendChild(el('b',null,c.hex));
  if (c.isNeutral || c.manual){
    const tags = el('div','tags');
    if (c.isNeutral) tags.appendChild(el('span','badge b-mut','neutral'));
    if (c.manual){
      const b = el('span','badge b-warn','moved');
      const kill = el('button','kill','×');
      kill.title='Reset this marker';
      kill.onclick = function(ev){ ev.stopPropagation(); delete xt.overrides[i]; xtPalette(); xt.scat.refresh(); };
      b.appendChild(kill); tags.appendChild(b);
    }
    chip.appendChild(tags);
  }
  chip.style.cursor='pointer';
  chip.title = picked ? 'Click to leave this colour out' : 'Click to include this colour';
  chip.onclick = function(ev){
    if (ev.target && ev.target.tagName==='INPUT') return;
    if (picked) xt.deselected[i]=true; else delete xt.deselected[i];
    xtPalette(); xt.scat.place();
  };
  box.appendChild(chip);

  const sr = el('div','step-row');
  sr.appendChild(el('span','lbl','Step'));
  const sel = el('select','step');
  STEPS.forEach(function(st){ const o=el('option',null,String(st)); o.value=st; if(Number(c.step)===st) o.selected=true; sel.appendChild(o); });
  sel.title = c.stepManual ? 'Set by hand — the suggestion was ' + xtNearestStep(c.L) : 'Suggested from this colour’s lightness';
  sel.onchange = function(){
    const v = Number(sel.value);
    if (v === xtNearestStep(c.L)) delete xt.stepOverrides[i]; else xt.stepOverrides[i]=v;
    xtPalette();
  };
  sr.appendChild(sel); box.appendChild(sr);

  const det = el('details');
  const sum = el('summary');
  sum.innerHTML = '<span>Details</span><span class="chev"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';
  det.appendChild(sum);
  const body = el('div','body');
  [['L / C / H', (c.L*100).toFixed(1)+' · '+c.C.toFixed(3)+' · '+c.h.toFixed(0)+'°'],
   ['area', (c.share*100).toFixed(1)+'%'],
   ['on white', contrastRatio(c.hex,'#FFFFFF').toFixed(2)+':1'],
   ['suggested step', String(xtNearestStep(c.L))]
  ].forEach(function(r){
    const dd = el('div');
    dd.appendChild(el('span',null,r[0]));
    dd.appendChild(el('span',null,String(r[1])));
    body.appendChild(dd);
  });
  const bar = el('div','bar'), fill = el('i');
  fill.style.width = Math.max(2, Math.min(100, c.share*100))+'%';
  fill.style.background = c.hex;
  bar.appendChild(fill); body.appendChild(bar);
  det.appendChild(body); box.appendChild(det);
  return box;
}

function xtPalette(){
  const host = document.getElementById('xtPalette'); host.innerHTML='';
  const acts = document.getElementById('xtActions'); acts.innerHTML='';
  const selBtn = document.getElementById('xtSel');
  if (!xt.result){ host.appendChild(el('p','hint','Reading the image…')); return; }

  const list = xtColours();
  const picked = list.filter(function(_,i){ return xtPickedFlag(i); }).length;

  /* the count and the clear are one thing — a button that says what it
     holds and drops it when pressed */
  selBtn.style.display = xt.showCompare ? 'none' : '';
  selBtn.innerHTML = '<span>' + picked + ' of ' + list.length + ' selected</span>'
    + '<span class="sel-x">' + (picked ? '\u00d7' : '\u2713') + '</span>';
  selBtn.title = picked ? 'Clear the selection' : 'Select them all again';
  selBtn.onclick = function(){
    if (picked) list.forEach(function(_,i){ xt.deselected[i]=true; });
    else xt.deselected = {};
    xtPalette(); xt.scat.place();
  };

  const pill = el('div','pill');
  [['tuned','Tuned'],['raw','Raw dominant']].forEach(function(p2){
    const b = el('button',null,p2[1]);
    b.setAttribute('aria-pressed', (xt.showCompare?'raw':'tuned')===p2[0]);
    b.onclick = function(){ xt.showCompare = (p2[0]==='raw'); xtPalette(); xt.scat.refresh(); };
    pill.appendChild(b);
  });
  acts.appendChild(pill);
  if (!xt.showCompare && Object.keys(xt.overrides).length){
    const rb = el('button','btn sm','Reset markers');
    rb.onclick = function(){ xt.overrides={}; xtPalette(); xt.scat.refresh(); };
    acts.appendChild(rb);
  }
  const go = el('button','btn primary','Generate ramps');
  go.id = 'xtGo';
  go.disabled = xt.showCompare || !picked;
  go.textContent = picked ? ('Generate ' + picked + ' ramp' + (picked>1?'s':'')) : 'Generate ramps';
  go.onclick = xtGenerate;

  const grid = el('div','sw-grid');
  list.forEach(function(c,i){ grid.appendChild(xtCard(c,i)); });
  host.appendChild(grid);
  if (xt.showCompare)
    host.appendChild(el('p','hint','<b>Raw dominant</b> is the same clustering with every filter switched off — plain area ranking, no chroma weighting, no hue spreading.'));

  document.getElementById('xtGoNote').textContent = xt.showCompare
    ? 'Switch back to Tuned to generate.'
    : (picked ? 'One ramp per selected colour, each pinned at its chosen step.' : 'Tick at least one colour.');
}

/* ---- the payoff ---- */
function xtGenerate(){

  if (!picks.length){ toast('Tick at least one colour'); return; }
  const made = [];

    const taken = {}; state.palettes.concat(made).forEach(function(x){ taken[x.name]=1; });

/* ============================================================
   15. IMPORT FROM FIGMA
   The name path decides the shape: a branch whose children are
   numbers is a ramp, everything else is a group, and a lone colour
   is a single that can seed a brand new ramp.
   ============================================================ */
const IM_RAMP_MIN = 3;
let im = null;   /* live only while the modal is open */

function imL(hex){
  const r = hexToRgb(hex); if (!r) return 0.5;
  return rgbToOklab(r[0],r[1],r[2])[0];
}
function imNumeric(name){ return /^-?\d+(\.\d+)?$/.test(String(name).trim()); }
function imPretty(s){
  return String(s||'').replace(/[-_]+/g,' ').replace(/\b\w/g,function(m){ return m.toUpperCase(); }).trim() || 'Ramp';
}

const IM_SCAN =
"function toHex(c){\n" +
"  function h(v){ var n=Math.round(Math.max(0,Math.min(1,v))*255).toString(16); return n.length<2?'0'+n:n; }\n" +
"  return ('#'+h(c.r)+h(c.g)+h(c.b)).toUpperCase();\n" +
"}\n" +
"var cols = await figma.variables.getLocalVariableCollectionsAsync();\n" +
"var all  = await figma.variables.getLocalVariablesAsync();\n" +
"var byId = {}; all.forEach(function(v){ byId[v.id] = v; });\n" +
"function resolve(val, modeId, depth){\n" +
"  if (!val) return null;\n" +
"  if (val.type === 'VARIABLE_ALIAS'){\n" +
"    if (depth > 8) return null;\n" +
"    var t = byId[val.id];\n" +
"    if (!t) return {unresolved:true};\n" +
"    var target = null;\n" +
"    for (var i=0;i<cols.length;i++) if (cols[i].id === t.variableCollectionId) target = cols[i];\n" +
"    var m = (target && target.modes[0]) ? target.modes[0].modeId : modeId;\n" +
"    if (t.valuesByMode[modeId] !== undefined) m = modeId;\n" +
"    var r = resolve(t.valuesByMode[m], m, depth+1);\n" +
"    if (r && !r.unresolved) r.aliasOf = t.name;\n" +
"    return r;\n" +
"  }\n" +
"  if (typeof val.r === 'number') return { hex: toHex(val), alpha: (val.a===undefined?1:val.a) };\n" +
"  return null;\n" +
"}\n" +
"return { fileName: figma.root.name, editorType: figma.editorType,\n" +
"  collections: cols.map(function(c){\n" +
"    var mine = all.filter(function(v){ return v.variableCollectionId === c.id; });\n" +
"    var colours = mine.filter(function(v){ return v.resolvedType === 'COLOR'; });\n" +
"    return { id:c.id, name:c.name,\n" +
"      modes: c.modes.map(function(m){ return { id:m.modeId, name:m.name }; }),\n" +
"      otherTypes: mine.length - colours.length,\n" +
"      variables: colours.map(function(v){\n" +
"        var vals = {};\n" +
"        c.modes.forEach(function(m){ vals[m.modeId] = resolve(v.valuesByMode[m.modeId], m.modeId, 0) || null; });\n" +
"        return { id:v.id, key:v.key, name:v.name, values:vals };\n" +
"      }) };\n" +
"  }) };";

/* ---- tree ---- */
function imBuildTree(scan){
  return scan.collections.map(function(col){
    const modeId = im.modes[col.id] || (col.modes[0] && col.modes[0].id) || null;
    const root = { kind:'collection', id:col.id, name:col.name, modes:col.modes, modeId:modeId,
                   otherTypes:col.otherTypes, children:[], path:'' };
    const index = {};
    col.variables.forEach(function(v){
      const parts = v.name.split('/').map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
      const leaf = parts.length ? parts[parts.length-1] : v.name;
      let parent = root, pathKey = '';
      parts.slice(0,-1).forEach(function(g){
        pathKey = pathKey ? pathKey + '/' + g : g;
        let node = index[col.id + '::' + pathKey];
        if (!node){
          node = { kind:'group', id:col.id+'::'+pathKey, name:g, path:pathKey, children:[], collection:root };
          index[col.id + '::' + pathKey] = node;
          parent.children.push(node);
        }
        parent = node;
      });
      const val = v.values[modeId];
      parent.children.push({
        kind:'var', id:v.id, key:v.key, name:leaf, fullName:v.name, path:pathKey,
        hex: val && val.hex ? val.hex : null,
        aliasOf: val && val.aliasOf ? val.aliasOf : null,
        unresolved: !val || val.unresolved || !val.hex,
        collection: root, parentPath: pathKey
      });
    });
    (function classify(node){
      node.children.forEach(function(c){ if (c.kind==='group') classify(c); });
      const leaves = node.children.filter(function(c){ return c.kind==='var'; });
      const nums = leaves.filter(function(c){ return imNumeric(c.name) && !c.unresolved; });
      if (node.kind==='group' && nums.length >= IM_RAMP_MIN){
        node.ramp = nums.slice().sort(function(a,b){ return parseFloat(a.name)-parseFloat(b.name); });
        node.ramp.forEach(function(t){ t.inRamp = node; });
        node.rampInfo = imDescribe(node.ramp);
      }
    })(root);
    imSort(root);
    return root;
  });
}
function imSort(node){
  node.children.sort(function(a,b){
    if (a.kind !== b.kind) return a.kind==='group' ? -1 : 1;
    const an = imNumeric(a.name), bn = imNumeric(b.name);
    if (an && bn) return parseFloat(a.name)-parseFloat(b.name);
    return String(a.name).localeCompare(String(b.name), undefined, {numeric:true});
  });
  node.children.forEach(function(c){ if (c.kind==='group') imSort(c); });
}

function imDescribe(tones){
  const nums = tones.map(function(t){ return parseFloat(t.name); });
  const exact = nums.every(function(n){ return STEPS.indexOf(n) >= 0; }) && nums.length === new Set(nums).size;
  const mapping = {}, warnings = [];
  if (exact){
    tones.forEach(function(t){ mapping[t.name] = parseFloat(t.name); });
    const missing = STEPS.filter(function(s){ return nums.indexOf(s) < 0; });
    if (missing.length) warnings.push('missing ' + missing.join(', '));
    return { exact:true, mapping:mapping, dropped:[], warnings:warnings };
  }
  const snap = imSnap(tones);
  warnings.push('scale ' + nums[0] + '–' + nums[nums.length-1] + ' snapped by lightness');
  if (snap.dropped.length) warnings.push(snap.dropped.length + ' tone' + (snap.dropped.length>1?'s':'') + ' dropped — more tones than steps');
  return { exact:false, mapping:snap.mapping, dropped:snap.dropped, warnings:warnings };
}

/* A foreign scale has to land on our eleven steps in order — a lighter
   tone can never end up below a darker one. Nearest-step per tone breaks
   that the moment two tones compete, so this is an optimal monotone
   assignment by dynamic programming instead. */
function imSnap(tones){
  let list = tones.slice();
  const dropped = [];
  if (imL(list[0].hex) < imL(list[list.length-1].hex)) list.reverse();
  while (list.length > STEPS.length){
    let worst = 1, gapMin = Infinity;
    for (let i=1;i<list.length-1;i++){
      const gap = Math.abs(imL(list[i-1].hex) - imL(list[i+1].hex));
      if (gap < gapMin){ gapMin = gap; worst = i; }
    }
    dropped.push(list[worst].name);
    list.splice(worst,1);
  }
  const n = list.length, m = STEPS.length;
  const L = list.map(function(t){ return imL(t.hex); });
  const cost = function(i,s){ return Math.abs(L[i] - BASE_L[s]); };
  const dp = [], back = [];
  for (let i=0;i<n;i++){ dp.push(new Array(m).fill(Infinity)); back.push(new Array(m).fill(-1)); }
  for (let s=0;s<=m-n;s++) dp[0][s] = cost(0,s);
  for (let i=1;i<n;i++){
    let best = Infinity, bestIdx = -1;
    for (let s=i;s<=m-(n-i);s++){
      if (dp[i-1][s-1] < best){ best = dp[i-1][s-1]; bestIdx = s-1; }
      if (best < Infinity){ dp[i][s] = best + cost(i,s); back[i][s] = bestIdx; }
    }
  }
  let end = -1, bestTotal = Infinity;
  for (let s=n-1;s<m;s++) if (dp[n-1][s] < bestTotal){ bestTotal = dp[n-1][s]; end = s; }
  const mapping = {};
  if (end >= 0){
    let s = end;
    for (let i=n-1;i>=0;i--){ mapping[list[i].name] = STEPS[s]; s = back[i][s]; }
  } else {
    list.forEach(function(t,i){ mapping[t.name] = STEPS[Math.min(m-1, Math.round(i*(m-1)/Math.max(1,n-1)))]; });
  }
  return { mapping:mapping, dropped:dropped };
}

function imWalk(node, fn){ fn(node); (node.children||[]).forEach(function(c){ imWalk(c, fn); }); }
function imVars(node){ const out=[]; imWalk(node,function(n){ if(n.kind==='var' && !n.unresolved) out.push(n); }); return out; }
function imDropped(v){ return v.inRamp && v.inRamp.rampInfo.mapping[v.name] === undefined; }
function imNodeState(node){
  const vars = imVars(node).filter(function(v){ return !imDropped(v); });
  if (!vars.length) return 'none';
  const on = vars.filter(function(v){ return im.sel[v.id]; }).length;
  return on === 0 ? 'none' : on === vars.length ? 'all' : 'some';
}

/* ---- scanning ---- */
async function imScan(){
  im.status='scanning'; im.error=null; im.hints=[];
  imRender();
  const key = parseFigmaKey(im.url);
  if (!key){
    im.status='error'; im.error='That does not look like a Figma file link.';
    im.hints=['Open the file in Figma and use Share → Copy link.'];
    imRender(); return;
  }
  im.key = key;
  try {
    const res = await figmaRun(key, IM_SCAN, 'List every variable collection and colour variable in the file, resolving aliases');
    if (res.editorType !== 'figma'){
      im.status='error'; im.error='This is a ' + res.editorType + ' file. Variables live in Figma design files only.';
      imRender(); return;
    }
    im.file = { name:res.fileName };
    im.scan = res; im.modes = {}; im.sel = {}; im.open = {}; im.singles = {};
    res.collections.forEach(function(c){ if (c.modes[0]) im.modes[c.id] = c.modes[0].id; });
    im.tree = imBuildTree(res);
    im.tree.forEach(function(r){ if (imVars(r).length) im.open[r.id] = true; });
    im.status='ok';
    fig().url = im.url; save();
    imRender();
  } catch(e){
    im.status='error';
    if (e.code==='NO_BRIDGE'){
      im.error='This view cannot reach Figma from here.';
      im.hints=['Open the tool inside Cowork, where the Figma connector is available.','Meanwhile, paste a token file on the other tab.'];
    } else if (e.code==='NO_TOOL'){
      im.error='The Figma MCP server did not answer in this session.';
      im.hints=['Authorise the Figma connector, then ask the agent to rebuild this view.'];
    } else {
      im.error = e.message || String(e);
      im.hints=['Confirm you can open this file in Figma yourself.','If the link points at a branch, use the branch key.'];
    }
    imRender();
  }
}

/* ---- pasted tokens become the same tree ---- */
function imParsePaste(){
  im.pasteError = null;
  let data;
  try { data = JSON.parse(im.paste); }
  catch(e){ im.pasteError = 'That is not valid JSON.'; imRender(); return; }
  const vars = [];
  (function walkObj(node, path){
    if (!node || typeof node !== 'object') return;
    if (typeof node.$value === 'string' && normHex(node.$value)){
      vars.push({ path:path, hex:normHex(node.$value) }); return;
    }
    Object.keys(node).forEach(function(k){
      if (k.charAt(0) === '$') return;
      const v = node[k];
      const next = path.concat([k]);
      if (typeof v === 'string'){
        const h = normHex(v);
        if (h) vars.push({ path:next, hex:h });
      } else walkObj(v, next);
    });
  })(data, []);
  if (!vars.length){
    im.pasteError = 'No colours found. Expecting design tokens with $value, or a plain map of names to hex.';
    imRender(); return;
  }
  /* drop a shared leading segment or two so the tree is not all stem */
  const scan = { fileName:'Pasted tokens', editorType:'figma', collections:[{
    id:'paste', name:'Pasted tokens', modes:[{id:'paste-mode', name:'Value'}], otherTypes:0,
    variables: vars.map(function(v,i){
      const vals = {}; vals['paste-mode'] = { hex:v.hex, alpha:1 };
      return { id:'paste:'+i, key:'', name:v.path.join('/'), values:vals };
    })
  }]};
  im.file = { name:'Pasted tokens' };
  im.key = null; im.scan = scan; im.modes = {'paste':'paste-mode'};
  im.sel = {}; im.open = {'paste':true}; im.singles = {};
  im.tree = imBuildTree(scan);
  im.status = 'ok';
  imRender();
}


/* ---- what is ticked ---- */
function imPicks(){
  const ramps = [], singles = [];
  if (!im || !im.tree) return {ramps:ramps, singles:singles};
  im.tree.forEach(function(root){
    imWalk(root, function(n){
      if (n.kind !== 'group' || !n.ramp) return;
      const chosen = n.ramp.filter(function(t){ return im.sel[t.id] && !imDropped(t); });
      if (!chosen.length) return;
      const mappable = n.ramp.filter(function(t){ return !imDropped(t); }).length;
      /* the name must match the group it came from, or a later
         write-back cannot line the two up */
      ramps.push({ node:n, name:n.name, collection:root,
        partial: chosen.length < mappable, snapped: !n.rampInfo.exact,
        tones: chosen.map(function(t){
          return { step:n.rampInfo.mapping[t.name], sourceStep:t.name, hex:t.hex,
                   variableId:t.id, variableKey:t.key, variableName:t.fullName };
        }).sort(function(a,b){ return a.step-b.step; }) });
    });
    imWalk(root, function(n){
      if (n.kind !== 'var' || n.inRamp || n.unresolved || !im.sel[n.id]) return;
      const o = im.singles[n.id] || { name:n.name, step:xtNearestStep(imL(n.hex)) };
      singles.push({ node:n, name:o.name, step:o.step, hex:n.hex, collection:root });
    });
  });
  return { ramps:ramps, singles:singles };
}

/* ---- the payoff ---- */
function imDoImport(){
  const picks = imPicks();
  const total = picks.ramps.length + picks.singles.length;
  if (!total){ toast('Tick something first'); return; }
  const stamp = new Date().toISOString();
  const made = [];

  picks.ramps.forEach(function(r){
    const ids = {}, keys = {}, overrides = {};
    r.tones.forEach(function(t){ ids[t.step]=t.variableId; keys[t.step]=t.variableKey; });
    /* 500 is where brand colours live, so prefer it; otherwise the tone
       whose lightness best matches the step it landed on */
    let keyTone = r.tones.filter(function(t){ return t.step===500; })[0];
    if (!keyTone){
      keyTone = r.tones[0]; let best = Infinity;
      r.tones.forEach(function(t){
        const d = Math.abs(imL(t.hex) - BASE_L[STEPS.indexOf(t.step)]);
        if (d < best){ best = d; keyTone = t; }
      });
    }
    const pal = { id:uid(), name:r.name,
      keys:[{step:keyTone.step, hex:keyTone.hex}], opts:defaultOpts(), overrides:{},
      origin:'figma-ramp',
      source:{ kind:im.key ? 'figma' : 'paste', fileKey:im.key, fileName:im.file?im.file.name:'',
        collectionId:r.collection.id, collectionName:r.collection.name,
        modeId:im.modes[r.collection.id],
        modeName:(r.collection.modes.filter(function(m){ return m.id===im.modes[r.collection.id]; })[0]||{}).name,
        group:r.node.path, figmaName:r.name, variableIds:ids, variableKeys:keys,
        importedAt:stamp, snapped:r.snapped, partial:r.partial } };
    /* the file's own colours are the truth, so every tone that the
       generator would not have produced is kept as an override */
    const gen = generateRamp(pal.keys, pal.opts);
    r.tones.forEach(function(t){
      const i = STEPS.indexOf(t.step);
      if (i >= 0 && gen[i].hex !== t.hex) overrides[t.step] = t.hex;
    });
    pal.overrides = overrides;
    made.push(pal);
  });

  picks.singles.forEach(function(s){
    made.push({ id:uid(), name:s.name,
      keys:[{step:s.step, hex:s.hex}], opts:defaultOpts(), overrides:{},
      origin:'figma-key-colour',
      source:{ kind:im.key ? 'figma' : 'paste', fileKey:im.key, fileName:im.file?im.file.name:'',
        collectionId:s.collection.id, collectionName:s.collection.name,
        modeId:im.modes[s.collection.id], group:s.node.parentPath||'', figmaName:s.name,
        variableIds:{}, variableKeys:{},
        seededFrom:{ variableId:s.node.id, variableKey:s.node.key, variableName:s.node.fullName },
        importedAt:stamp } });
  });

  made.forEach(function(p){ state.palettes.push(p); });
  state.selected = made[made.length-1].id;
  state.selectedTone=null; state.pending=null; state.curveSnapshot=null;
  draft = defaultDraft();
  maybeAutoCollapse();
  imClose(); save(); renderAll();
  toast(made.length + ' ramp' + (made.length>1?'s':'') + ' imported');
}

const IM_CHEV = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function imRender(){
  if (!im) return;
  imRenderSource();
  imRenderTree();
  imRenderPicks();
}

function imRenderSource(){
  const host = document.getElementById('imSourceCard'); host.innerHTML='';
  host.appendChild(el('h2','card-title','Source'));

  /* the switcher gets its own full-width row — squeezed next to the
     title it wrapped onto two lines at this column width */
  const seg = el('div','seg block');
  [['figma','Figma file'],['paste','Paste tokens']].forEach(function(o){
    const b2 = el('button',null,o[1]);

    b2.onclick = function(){ im.source=o[0]; imRender(); };
    seg.appendChild(b2);
  });

    if (!bridgeReadyForImport()){

      host.appendChild(w);

    host.appendChild(el('p','hint','Accepts W3C design tokens with <code>$value</code>, or a plain map of names to hex. Works with no Figma connection at all.'));
    const ta = document.createElement('textarea');
    ta.className = 'inp ta';
    ta.placeholder = '{\n  "colours": {\n    "blue": { "500": "#3B82F6" }\n  }\n}';

    ta.oninput = function(){ im.paste = ta.value; };

function imRenderTree(){
  const host = document.getElementById('imTree');
  const acts = document.getElementById('imActions');
  host.innerHTML=''; acts.innerHTML='';
  if (!im.tree){
    const e = el('div','empty');
    e.appendChild(el('h3',null,'Nothing read yet'));
    e.appendChild(el('p','hint','Scan a Figma file, or paste a token file. A branch whose children are numbers is read as a ramp; anything else is a single colour you can turn into one.'));
    host.appendChild(e);
    document.getElementById('imTreeTitle').textContent = 'Colours found';
    return;
  }
  const all = im.tree.reduce(function(a,r){ return a.concat(imVars(r).filter(function(v){ return !imDropped(v); })); }, []);
  document.getElementById('imTreeTitle').textContent = 'Colours found';
  const rampsOnly = el('button','btn sm','Ramps only');
  rampsOnly.onclick = function(){
    im.sel = {};
    im.tree.forEach(function(r){ imWalk(r, function(n){
      if (n.kind==='group' && n.ramp) n.ramp.forEach(function(t){ if(!imDropped(t)) im.sel[t.id]=true; });
    }); });
    imRender();
  };
  const allB = el('button','btn sm', Object.keys(im.sel).length ? 'Select none' : 'Select all');
  allB.onclick = function(){
    if (Object.keys(im.sel).length) im.sel = {};
    else all.forEach(function(v){ im.sel[v.id]=true; });

  };
  const coll = el('button','btn sm','Collapse all');
  coll.onclick = function(){ im.open = {}; imRender(); };
  acts.appendChild(rampsOnly); acts.appendChild(allB); acts.appendChild(coll);

  const tree = el('div','tree');

function imNode(node, depth){
  const wrap = el('div','node');
  const row = el('div','node-row' + (node.kind==='collection' ? ' collection' : ''));
  row.style.paddingLeft = (10 + depth*18) + 'px';

  const kids = node.children && node.children.length;
  const tw = el('button','twist' + (kids ? '' : ' leaf') + (im.open[node.id] ? ' open' : ''), IM_CHEV);
  if (kids) tw.onclick = function(){ im.open[node.id] = !im.open[node.id]; imRender(); };
  row.appendChild(tw);

  const dropped = node.kind==='var' && imDropped(node);
  const cb = document.createElement('input');
  cb.type='checkbox';
  if (node.kind==='var'){
    cb.checked = !!im.sel[node.id] && !dropped;
    cb.disabled = node.unresolved || dropped;
    cb.onchange = function(){ if (cb.checked) im.sel[node.id]=true; else delete im.sel[node.id]; imRender(); };
  } else {
    const st = imNodeState(node);
    cb.checked = st==='all'; cb.indeterminate = st==='some';
    cb.disabled = !imVars(node).filter(function(v){ return !imDropped(v); }).length;
    cb.onchange = function(){
      const on = cb.checked;
      imVars(node).forEach(function(v){
        if (imDropped(v)) return;
        if (on) im.sel[v.id]=true; else delete im.sel[v.id];
      });
      imRender();
    };
  }
  row.appendChild(cb);

  const nm = el('div','node-name');
  const isSingle = node.kind==='var' && !node.inRamp && !node.unresolved && im.sel[node.id];
  if (isSingle){
    const o = im.singles[node.id] || (im.singles[node.id] = {
      name: node.name, step: xtNearestStep(imL(node.hex))
    });
    nm.classList.add('single-row');
    nm.title = node.fullName;
    if (im.renamingSingle === node.id){
      const inp = el('input','inp sm nm-input');
      inp.value = o.name;
      inp.oninput = function(){ o.name = inp.value; imRenderPicks(); };
      const stop = function(){ im.renamingSingle = null; imRender(); };
      inp.onkeydown = function(ev){
        if (ev.key==='Enter'){ ev.preventDefault(); stop(); }
        else if (ev.key==='Escape'){ ev.preventDefault(); stop(); }
      };
      inp.onblur = stop;
      inp.onclick = function(ev){ ev.stopPropagation(); };
      nm.appendChild(inp);
      setTimeout(function(){ inp.focus(); inp.select(); }, 0);
    } else {
      nm.appendChild(el('span','nm-text', o.name || node.name));
      const pen = el('button','nm-pen');
      pen.title = 'Rename the ramp this colour will start';
      pen.setAttribute('aria-label','Rename the ramp');
      pen.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      pen.onclick = function(ev){ ev.stopPropagation(); im.renamingSingle = node.id; imRender(); };
      nm.appendChild(pen);
    }
    const stepS = el('select','inp sm nm-step');
    STEPS.forEach(function(st){ const op=el('option',null,String(st)); op.value=st; if(o.step===st) op.selected=true; stepS.appendChild(op); });
    stepS.title = 'Which step this colour is pinned to';
    stepS.onchange = function(){ o.step = Number(stepS.value); imRenderPicks(); };
    stepS.onclick = function(ev){ ev.stopPropagation(); };
    nm.appendChild(stepS);
  } else if (node.kind==='var'){
    nm.textContent = node.name; nm.title = node.fullName;
  } else {
    nm.innerHTML = node.name + (node.kind==='group' && node.ramp ? ' <span class="path">· ' + node.ramp.length + ' tones</span>' : '');
  }
  row.appendChild(nm);

  const meta = el('div','node-meta');
  if (node.kind==='collection'){
    if (node.modes.length > 1){
      const sel = el('select','inp sm'); sel.style.width='108px';
      node.modes.forEach(function(m){
        const o = el('option',null,m.name); o.value=m.id;
        if (im.modes[node.id]===m.id) o.selected=true;
        sel.appendChild(o);
      });
      sel.onchange = function(){ im.modes[node.id]=sel.value; im.tree = imBuildTree(im.scan); imRender(); };
      sel.onclick = function(ev){ ev.stopPropagation(); };
      meta.appendChild(sel);
    } else if (node.modes.length===1){
      meta.appendChild(el('span','badge b-mut', node.modes[0].name));
    }
    const n = imVars(node).length;
    meta.appendChild(el('span','badge ' + (n?'b-info':'b-mut'), n ? n + ' colours' : 'no colours'));
    if (node.otherTypes) meta.appendChild(el('span','badge b-mut', node.otherTypes + ' other'));
  } else if (node.kind==='group' && node.ramp){
    const strip = el('div','strip');
    node.ramp.forEach(function(t){ const i=el('i'); i.style.background=t.hex; strip.appendChild(i); });
    meta.appendChild(strip);
    const rb = el('span','badge ' + (node.rampInfo.exact ? 'b-ok' : 'b-warn'), node.rampInfo.exact ? 'ramp' : 'ramp · snapped');
    if (node.rampInfo.warnings.length) rb.title = node.rampInfo.warnings.join('; ');
    meta.appendChild(rb);
  } else if (node.kind==='var'){
    if (node.unresolved) meta.appendChild(el('span','badge b-warn','unresolved'));
    else {
      if (dropped){
        const b = el('span','badge b-warn','dropped');
        b.title = 'The source scale has more tones than our eleven steps, so this one is left out';
        meta.appendChild(b);
      }
      if (node.aliasOf){ const b=el('span','badge b-mut','alias'); b.title='aliases '+node.aliasOf; meta.appendChild(b); }
      if (!node.inRamp) meta.appendChild(el('span','badge b-mut','single'));
      meta.appendChild(el('span','hexv', node.hex));
      const dot = el('div','dot-chip'); dot.style.background = node.hex;
      meta.appendChild(dot);
    }
  }
  row.appendChild(meta);
  wrap.appendChild(row);

  if (kids){
    const box = el('div','kids' + (im.open[node.id] ? ' open' : ''));
    node.children.forEach(function(c){ box.appendChild(imNode(c, depth+1)); });
    wrap.appendChild(box);
  }
  return wrap;
}
