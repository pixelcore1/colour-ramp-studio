/* ============================================================
   16. THE SNAPSHOT
   A session dies when the tool closes, so the JSON file is the only
   way work survives. It carries the provenance too — without the
   variable ids a reloaded ramp could no longer be written back over
   the same Figma variables.
   ============================================================ */
const SNAP_FORMAT = 'figma-colour-ramps/workspace';
const SNAP_VERSION = 1;

/* A snapshot carries a checksum so a file that got mangled in transit —
   truncated on copy, re-saved in a odd encoding, edited by hand — is
   noticed at load time instead of quietly loading half a desk.
   The digest is taken over a canonical form: keys sorted, whitespace
   gone, the checksum field itself excluded. So re-indenting the file or
   running it through a formatter still verifies; changing a value does
   not. This is an accident detector, not a lock. */
function snapCanon(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(snapCanon).join(',') + ']';
  const keys = Object.keys(v).filter(function(k){ return k !== 'checksum' && typeof v[k] !== 'function' && v[k] !== undefined; }).sort();
  return '{' + keys.map(function(k){ return JSON.stringify(k) + ':' + snapCanon(v[k]); }).join(',') + '}';
}
/* two FNV-1a lanes, 64 bits of digest — plenty to catch damage */
function snapHash(str){
  let a = 0x811c9dc5, b = 0xcbf29ce4;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    a = Math.imul(a ^ c, 0x01000193) >>> 0;
    b = Math.imul(b ^ (c + i), 0x85ebca6b) >>> 0;
    b = (b ^ (b >>> 13)) >>> 0;
  }
  const hx = function(n){ return ('0000000' + (n >>> 0).toString(16)).slice(-8); };
  return hx(a) + hx(b);
}
function snapDigest(data){ return snapHash(snapCanon(data)); }

function snapBuild(name){
  return {
    format: SNAP_FORMAT,
    version: SNAP_VERSION,
    name: name || 'Untitled',
    savedAt: new Date().toISOString(),
    app: 'Figma Colour Ramps',
    palettes: state.palettes.map(function(p){
      return { id:p.id, name:p.name, keys:p.keys, opts:Object.assign(defaultOpts(), p.opts),
               overrides:p.overrides || {}, origin:p.origin || 'manual', source:p.source || null };
    }),
    ui: { selected: state.selected }
  };
}

function snapStamp(data){ data.checksum = snapDigest(data); return data; }

/* a hand-edited or foreign file must never white-screen the tool */
function snapValidate(data){
  const errs = [], warns = [];
  if (!data || typeof data !== 'object') return { ok:false, errs:['The file is not a JSON object.'] };
  if (data.format !== SNAP_FORMAT)
    return { ok:false, errs:['This is not a Figma Colour Ramps snapshot.' + (data.format ? ' It says it is “' + String(data.format).slice(0,60) + '”.' : '')] };
  if (typeof data.version !== 'number' || data.version > SNAP_VERSION)
    warns.push('Saved by a newer version (' + data.version + '). Loading anyway — some settings may be ignored.');
  if (!Array.isArray(data.palettes)) return { ok:false, errs:['The file has no ramps.'] };

  /* integrity — reported, never fatal: a damaged file may still be mostly good */
  let integrity = 'missing';
  if (typeof data.checksum === 'string' && data.checksum)
    integrity = (snapDigest(data) === data.checksum) ? 'ok' : 'mismatch';
  if (integrity === 'missing')
    warns.push('No checksum in this file, so it could not be verified. Saving it again from here adds one.');

  const good = [], dropped = [];
  data.palettes.forEach(function(p, i){
    const label = (p && p.name) ? p.name : ('#' + (i+1));
    if (!p || typeof p !== 'object'){ dropped.push(label + ' — not an object'); return; }
    if (!Array.isArray(p.keys) || !p.keys.length){ dropped.push(label + ' — no key colours'); return; }
    const keys = p.keys.filter(function(k){ return k && normHex(k.hex) && STEPS.indexOf(Number(k.step)) >= 0; })
                       .map(function(k){ return { step:Number(k.step), hex:normHex(k.hex) }; });
    if (!keys.length){ dropped.push(label + ' — key colours are not valid'); return; }
    const ov = {};
    if (p.overrides && typeof p.overrides === 'object'){
      Object.keys(p.overrides).forEach(function(st){
        const h = normHex(p.overrides[st]);
        if (h && STEPS.indexOf(Number(st)) >= 0) ov[Number(st)] = h;
      });
    }
    good.push({
      id: typeof p.id === 'string' && p.id ? p.id : uid(),
      name: String(p.name || 'Untitled').slice(0,80),
      keys: keys,
      opts: Object.assign(defaultOpts(), (p.opts && typeof p.opts === 'object') ? p.opts : {}),
      overrides: ov,
      origin: p.origin || 'manual',
      source: (p.source && typeof p.source === 'object') ? p.source : null
    });
  });
  if (!good.length) return { ok:false, errs:['None of the ramps in the file could be read.'].concat(dropped.slice(0,4)) };
  /* ids must stay unique or selection and editing get confused */
  const seen = {};
  good.forEach(function(p){ if (seen[p.id]) p.id = uid(); seen[p.id] = 1; });
  if (dropped.length) warns.push(dropped.length + ' ramp' + (dropped.length>1?'s':'') + ' skipped: ' + dropped.slice(0,3).join('; '));
  return { ok:true, palettes:good, warns:warns, errs:errs, integrity:integrity,
           name:String(data.name || 'Untitled').slice(0,80), savedAt:data.savedAt || null,
           selected:(data.ui && data.ui.selected) || null };
}

function snapSave(){
  if (!state.palettes.length){ toast('Nothing to save yet'); return; }
  const wrap = el('div','modal-wrap');
  const box = el('div','modal'); box.style.width='420px';
  box.appendChild(el('h3',null,'Name this work'));
  box.appendChild(el('p','hint','The name goes into the file and its title, so a folder of snapshots stays readable.'));
  const inp = el('input','inp'); inp.style.marginTop='10px';
  inp.value = state.workName || '';
  inp.placeholder = 'Rebrand v3';
  box.appendChild(inp);
  const meta = el('p','hint'); meta.style.marginTop='8px';
  meta.textContent = state.palettes.length + ' ramp' + (state.palettes.length===1?'':'s')
    + (state.palettes.filter(function(p){ return p.source; }).length ? ', provenance included' : '');
  box.appendChild(meta);
  const row = el('div','row'); row.style.marginTop='14px';
  const ok = el('button','btn primary','Save');
  const done = function(){
    const v = inp.value.trim();
    if (!v){ inp.focus(); return; }
    state.workName = v;
    const data = snapStamp(snapBuild(v));
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = slug(v) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    document.body.removeChild(wrap);
    save(); renderFooter();
    toast('Saved “' + v + '”');
  };
  ok.onclick = done;
  inp.onkeydown = function(ev){ if (ev.key==='Enter'){ ev.preventDefault(); done(); } };
  const no = el('button','btn','Cancel');
  no.onclick = function(){ document.body.removeChild(wrap); };
  row.appendChild(ok); row.appendChild(no);
  box.appendChild(row); wrap.appendChild(box);
  wrap.onclick = function(ev){ if (ev.target===wrap) document.body.removeChild(wrap); };
  document.body.appendChild(wrap);
  setTimeout(function(){ inp.focus(); inp.select(); }, 0);
}

function snapLoad(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json'; inp.style.display='none';
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const fr = new FileReader();
    fr.onload = function(){
      let data = null;
      try { data = JSON.parse(fr.result); }
      catch(e){ snapReport({ ok:false, errs:['That file is not valid JSON.'] }); return; }
      snapReport(snapValidate(data));
    };
    fr.onerror = function(){ snapReport({ ok:false, errs:['That file could not be read.'] }); };
    fr.readAsText(f);
  };
  document.body.appendChild(inp); inp.click();
}

function snapReport(res){
  const wrap = el('div','modal-wrap');
  const box = el('div','modal'); box.style.width='460px';
  if (!res.ok){
    box.appendChild(el('h3',null,'Cannot open that file'));
    const b = el('div','status bad');
    b.innerHTML = res.errs.map(function(e){ return '<div>'+e+'</div>'; }).join('');
    box.appendChild(b);
    const row = el('div','row'); row.style.marginTop='14px';
    const no = el('button','btn','Close');
    no.onclick = function(){ document.body.removeChild(wrap); };
    row.appendChild(no); box.appendChild(row);
  } else {
    const when = res.savedAt ? new Date(res.savedAt) : null;
    box.appendChild(el('h3',null,'Open “' + res.name + '”?'));
    const bits = [res.palettes.length + ' ramp' + (res.palettes.length===1?'':'s')];
    if (when && !isNaN(when)) bits.push('saved ' + when.toLocaleDateString() + ' at ' + when.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
    const fromFigma = res.palettes.filter(function(p){ return p.source && p.source.fileName; });
    if (fromFigma.length) bits.push(fromFigma.length + ' carrying Figma provenance');
    box.appendChild(el('p','hint', bits.join(' · ')));

    if (res.integrity === 'mismatch'){
      const t = el('div','status bad'); t.style.marginTop='10px';
      t.innerHTML = '<b>This file has changed since it was saved.</b> Its checksum no longer matches the contents, '
        + 'so it was either edited by hand or damaged on the way here. What loads below is what the file actually says.';
      box.appendChild(t);
    }

    const strip = el('div'); strip.style.cssText='display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:180px;overflow:auto';
    res.palettes.slice(0,8).forEach(function(p){
      const ramp = generateRamp(p.keys, p.opts) || [];
      const row = el('div','sum-row');
      const s = el('div','strip');
      ramp.forEach(function(t,i){
        const i2 = el('i');
        i2.style.background = p.overrides[STEPS[i]] || t.hex;
        s.appendChild(i2);
      });
      const nm = el('div','sum-name', p.name);
      row.appendChild(s); row.appendChild(nm);
      if (p.source) row.appendChild(el('span','badge b-info','figma'));
      strip.appendChild(row);
    });
    if (res.palettes.length > 8) strip.appendChild(el('p','hint','…and ' + (res.palettes.length-8) + ' more'));
    box.appendChild(strip);

    if (res.warns.length){
      const w = el('div','status warn');
      w.innerHTML = res.warns.map(function(x){ return '<div>'+x+'</div>'; }).join('');
      box.appendChild(w);
    }
    if (state.palettes.length){
      const w = el('div','status warn');
      w.innerHTML = '<b>This replaces what is on the desk.</b> ' + state.palettes.length + ' ramp'
        + (state.palettes.length===1?'':'s') + ' will go, and anything unexported goes with them.';
      box.appendChild(w);
    }
    const row = el('div','row'); row.style.marginTop='14px';
    const ok = el('button','btn primary','Open');
    ok.onclick = function(){
      document.body.removeChild(wrap);
      state.palettes = res.palettes;
      state.workName = res.name;
      state.selected = res.palettes.some(function(p){ return p.id === res.selected; }) ? res.selected : null;
      state.selectedTone=null; state.pending=null; state.curveSnapshot=null; state.renaming=false;
      draft = defaultDraft();
      state.createOpen = false; state.autoCollapsed = true; state.userSetCreate = false;
      state.tab = 'ramp';
      save(); renderAll();
      toast('Opened “' + res.name + '”');
    };
    const no = el('button','btn','Cancel');
    no.onclick = function(){ document.body.removeChild(wrap); };
    row.appendChild(ok); row.appendChild(no);
    box.appendChild(row);
  }
  wrap.appendChild(box);
  wrap.onclick = function(ev){ if (ev.target===wrap) document.body.removeChild(wrap); };
  document.body.appendChild(wrap);
}

/* The palette name is edited here and nowhere else, so a rename lands
   in the exports the moment it is saved. */
function renderStageTitle(pal){
  const host = $('#stageTitle');
  host.innerHTML='';
  /* the export view is about the whole set, so the palette name,
     its pencil and the tabs step aside */
  if (state.tab === 'all'){
    host.textContent = 'Export ramps';
    $('#stageSub').style.display = 'none';
    $('#tabs').style.display = 'none';
    $('#btnBack').style.display = '';
    state.renaming = false;
    return;
  }
  $('#stageSub').style.display = '';
  $('#tabs').style.display = '';
  $('#btnBack').style.display = 'none';
  if (!pal){ host.textContent = 'Figma Colour Ramps'; state.renaming = false; return; }

  const row = el('div','title-row');
  host.appendChild(row);
  /* the Figma name stays under the new one: it is the handle a
     write-back uses to find the existing variables */
  const oldLine = function(){
    if (!figmaRenamed(pal)) return;
    const w = el('div','title-was', 'was <b>' + escHtml(figmaFullName(pal)) + '</b>');
    w.title = 'Still named “' + figmaFullName(pal) + '” in ' + (pal.source.fileName || 'the Figma file');
    host.appendChild(w);
  };

  if (!state.renaming){
    const nm = el('span','title-text', pal.name || 'Untitled');
    row.appendChild(nm);
    if (fromFigma(pal)) row.appendChild(figmaMark(pal, false));
    const pen = el('button','pen');
    pen.title = 'Rename this ramp';
    pen.setAttribute('aria-label','Rename this ramp');
    pen.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
    pen.onclick = function(){ state.renaming = true; renderStageTitle(pal); };
    row.appendChild(pen);
    oldLine();
    return;
  }

  const inp = el('input','inp title-inp');
  inp.value = pal.name || '';
  inp.placeholder = 'Ramp name';
  inp.autocomplete = 'off';
  const commit = function(){
    const v = inp.value.trim();
    if (!v){ toast('A ramp needs a name'); inp.focus(); return; }
    pal.name = v;
    state.renaming = false;
    save(); renderAll();
  };
  const cancel = function(){ state.renaming = false; renderStageTitle(pal); };
  inp.onkeydown = function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape'){ ev.preventDefault(); cancel(); }
  };
  const ok = el('button','btn sm primary','Save name');
  ok.onclick = commit;
  const no = el('button','btn sm','Cancel');
  no.onclick = cancel;
  row.appendChild(inp); row.appendChild(ok); row.appendChild(no);
  oldLine();
  setTimeout(function(){ inp.focus(); inp.select(); }, 0);
}

function uniqueName(base){
  let name = base, n = 2;
  while (state.palettes.some(function(p){ return p.name === name; })) name = base + ' ' + (n++);
  return name;
}
function addStarterSet(){
  STARTER.forEach(function(pr){
    state.palettes.push({ id:uid(), name:uniqueName(pr.name), keys:JSON.parse(JSON.stringify(pr.keys)),
                          opts:defaultOpts(), overrides:{} });
  });
  state.selected = state.palettes[state.palettes.length-1].id;
  state.selectedTone=null; state.pending=null; state.curveSnapshot=null;
  draft = defaultDraft();
  maybeAutoCollapse(); save(); renderAll();
  toast('Starter set added');
}
function pickImageThenExtract(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  inp.onchange = function(){

}
/* The help document lives as one string so the contents list can be
   built from it at open time — a heading that is not in the prose can
   never appear in the navigation. */
const HELP_HTML = "<h2 id=\"h-what\" data-group=\"Start here\" data-nav=\"What this tool is\">What this tool is</h2>\n<p class=\"lead\">A workbench for eleven-step colour ramps \u2014 50, 100, 200 \u2026 900, 950 \u2014 built in OKLCH, checked against WCAG, and written straight into a Figma file as variables.</p>\n<p>Three things separate it from a gradient generator. Ramps are built in a <b>perceptually uniform space</b>, so a step of lightness looks like the same step whether the hue is yellow or blue. Every tone is <b>measurable</b> \u2014 contrast against white, against black, and against every other tone in the ramp. And a ramp read out of a Figma file can be <b>written back onto the very same variables</b>, which is what makes a reskin a job of minutes instead of days.</p>\n<p>Nothing is stored on a server. Your work lives in the browser tab for the session and in the snapshot files you save yourself.</p>\n<div class=\"note warm\"><p>Reading from and writing to Figma need a local bridge, so the Cowork session has to be running <b>On my computer</b> rather than in the cloud, with the Figma desktop app open and its MCP server enabled. Everything else \u2014 building ramps, pulling colours out of images, contrast, exports \u2014 works either way.</p></div>\n<h3 id=\"h-why-oklch\">Why OKLCH and not HSL</h3>\n<p>In HSL, <code>hsl(60 100% 50%)</code> is a blinding yellow and <code>hsl(240 100% 50%)</code> is a near-black blue, yet both claim 50% lightness. Anything built on that number produces ramps where one hue goes dark three steps before another. OKLab, published by Bj\u00f6rn Ottosson in 2020, fixes this: its L axis matches what the eye reports. CIELAB gets most of the way there but bends blues towards purple as they darken \u2014 OKLab does not. So the ramp maths \u2014 lightness ladder, chroma envelope, hue interpolation, gamut clipping \u2014 all happens in OKLCH, and hex only ever appears at the edges, on input and on export.</p>\n<h3 id=\"h-layout\">The layout</h3>\n<p>The left column is your desk: how to start, the list of ramps, and the buttons for export and for saving work. The right pane shows whatever ramp is selected \u2014 its tones, its editor, its curves, its contrast \u2014 or, on the <b>Export ramps</b> screen, all of them at once.</p>\n<p>Click a ramp in the list to select it. Click it again to deselect. The chevron beside its name opens the editor for that ramp inline.</p>\n<h2 id=\"h-start\" data-group=\"Making ramps\" data-nav=\"Four ways to start\">Four ways to start</h2>\n<p>The <b>Create</b> panel at the top of the left column offers four entry points. It collapses itself once you have ramps on the desk, and comes back when the desk is empty.</p>\n<dl>\n  <dt>New ramp</dt>\n  <dd>Build one from a colour you already know. This is the path described in the next section.</dd>\n  <dt>From an image</dt>\n  <dd>Pull key colours out of a photo, a screenshot or a brand board, then turn them into ramps in one go.</dd>\n  <dt>From Figma</dt>\n  <dd>Read ramps that already exist in a Figma file. These come back marked, and can later be written back onto the same variables.</dd>\n  <dt>Starter set</dt>\n  <dd>Five ramps \u2014 red, orange, green, blue and neutral \u2014 to poke at while you get a feel for the controls.</dd>\n</dl>\n<h2 id=\"h-new\" data-nav=\"Building a ramp by hand\">Building a ramp by hand</h2>\n<p>A ramp is defined by its <b>key colours</b>, not by all eleven tones. You pin the colours you care about; the tool works out the rest.</p>\n<ol class=\"steps\">\n  <li>Give the ramp a name. It becomes the variable name in Figma and the token name in every export, so name it the way your design system talks \u2014 <code>Blue</code>, not <code>blue-ish accent</code>.</li>\n  <li>Set the first key colour: pick the step it belongs to from the dropdown, then type a hex or click the swatch to open the picker. The picker opens in hex mode.</li>\n  <li>Press <b>Generate colour ramp</b>.</li>\n</ol>\n<p>One key colour is enough. The tool places it at the step you chose and builds the other ten around it, keeping its hue and scaling its chroma along a bell-shaped curve that peaks in the middle of the ramp \u2014 the same shape you find in most mature design systems, because mid-tones can carry more chroma than either end without leaving the sRGB gamut.</p>\n<h3 id=\"h-multi-keys\">More than one key colour</h3>\n<p><b>+ Add key colour</b> pins another. This is how you handle a brand that is not one hue stretched thin: a warm red at 500 and a cooler, deeper red at 900, for instance. Every pinned colour is reproduced exactly, and the tones between them are interpolated \u2014 lightness through a warped ladder, hue along the shortest arc, chroma normalised so that each key sits at its own measured chroma.</p>\n<div class=\"note\">\n  <p>Pinning two colours whose lightness runs the wrong way \u2014 a light colour at 900 and a dark one at 200 \u2014 gives you a ramp that reverses direction. The tool will build it, because sometimes that is what you meant, but it is almost always a mistake in the step numbers.</p>\n</div>\n<h3 id=\"h-shape\">Ramp shape</h3>\n<p>Under <b>show / hide</b> in the form sit five controls that reshape the whole ramp at once:</p>\n<dl>\n  <dt>Lightest tone (50) \u00b7 Darkest tone (950)</dt>\n  <dd>The two ends of the lightness ladder. Move them to make a ramp that never goes fully pale, or one that stops short of near-black.</dd>\n  <dt>Chroma amount</dt>\n  <dd>Scales the whole chroma envelope. Below 1 for muted, restrained palettes; above 1 to push saturation until the gamut stops you.</dd>\n  <dt>Hue shift \u00b7 light end \u00b7 Hue shift \u00b7 dark end</dt>\n  <dd>Rotates hue towards the ends of the ramp. A few degrees of warmth in the highlights and coolness in the shadows is what makes a ramp feel like it was mixed with paint rather than calculated.</dd>\n</dl>\n<p>Every tone is gamut-mapped after all of this: chroma is reduced by binary search at fixed lightness and hue until the colour fits in sRGB. That is why pushing chroma past a point stops changing anything \u2014 you have hit the edge of what the screen can show.</p>\n<h2 id=\"h-image\" data-nav=\"Pulling colours from an image\">Pulling colours from an image</h2>\n<p><b>From an image</b> opens a full-screen workspace. Drop in a photo, a screenshot of a site, a brand board \u2014 anything with the colours you want.</p>\n<p>The centre of the screen is a <b>hue \u00d7 chroma plot of every pixel</b> in the image. Each dot is a pixel placed by hue around the circle and chroma out from the middle; the crosses are the key colours the tool has picked. This is not decoration \u2014 it is the tool you steer with.</p>\n<ul>\n  <li><b>Drag a marker</b> anywhere on the plot to move that key colour. With <i>Snap a dropped marker to its cluster</i> on, releasing it takes the mean of the pixels around the drop point rather than the raw position, so you land on a colour that is actually in the image.</li>\n  <li><b>Key colours to return</b> sets how many you want, from three to eight.</li>\n  <li><b>Also return the dominant neutral</b> adds a grey. The chroma cut-off throws greys away by design, but a design system almost always wants a neutral ramp too.</li>\n  <li><b>More settings</b> holds the clustering itself: how many clusters to fit before choosing, the minimum chroma and lightness worth keeping, how much to favour colourfulness over sheer area, and how far apart two hues must be to count as different colours. <b>Defaults</b> lives there too.</li>\n</ul>\n<p>Each candidate appears as a card with its share of the image, its step, and a chevron for the rest of the detail. Uncheck the ones you do not want; the counter beside the panel title tracks what is left. <b>Generate N ramps</b> turns every checked colour into a full ramp on the desk.</p>\n<div class=\"note\">\n  <p><b>Tuned</b> versus <b>Raw dominant</b>: raw shows the cluster centres exactly as the maths found them; tuned nudges them for hue separation and drops near-duplicates. Raw is the honest answer, tuned is usually the useful one.</p>\n</div>\n<p>The clustering is k-means++ in OKLab with a fixed seed, so the same image with the same settings always gives the same colours. Share of the image is measured against every pixel, not just the surviving ones \u2014 a 2% accent reads as 2%.</p>\n<h2 id=\"h-import\" data-nav=\"Reading ramps out of Figma\">Reading ramps out of Figma</h2>\n<p><b>From Figma</b> asks for a file link and then scans <b>every</b> variable collection in it. Nothing about your naming is assumed \u2014 the tool does not go looking for a collection called Primitives, it reads what is there.</p>\n<p>What comes back is a tree: collection, then groups, then tones, with a checkbox on every branch and every leaf. Tick a whole group to bring in a ramp. Tick a single colour to seed a new ramp from it \u2014 you will be asked for a name, since one variable is not a ramp yet.</p>\n<p>Imported ramps arrive with the file's own colours as the truth: the tool works out which tone is the key colour, generates a ramp from it, and keeps every tone the generator would not have produced as a hand edit. Import then re-export a ramp this tool made, and you get zero overrides.</p>\n<h3 id=\"h-import-mark\">The Figma mark</h3>\n<p>An imported ramp carries a small Figma glyph beside its name, in the list and in the title. That mark is not cosmetic: it means the tool still holds the <b>id of every variable</b> the ramp came from, along with the file, the collection, the group and the mode. Those ids are what make writing back possible.</p>\n<p>The name matches Figma exactly, on purpose. If you rename the ramp, the old name stays visible under the new one \u2014 <code>was Colours/blue</code> \u2014 and a green dot appears beside it in the list, where there is no room for the full path.</p>\n<p>A ramp that came in as a single key colour has no set of eleven ids behind it, so it behaves like a ramp you built by hand. It keeps the Figma mark for provenance, but cannot be overwritten in place.</p>\n<h2 id=\"h-edit\" data-group=\"Refining\" data-nav=\"Editing one tone\">Editing one tone</h2>\n<p>Click any tone in the ramp to open <b>Edit tone</b>. The panel splits in two: the original on the left, your edit on the right. Clicking the original resets the edit; <b>Save ramp</b> commits it, <b>Discard edits</b> throws it away.</p>\n<p>You have three ways to change the colour, and they are the same colour seen three ways:</p>\n<ul>\n  <li>the <b>picker</b>, for when you have a hex from somewhere else;</li>\n  <li><b>L, C and H sliders</b>, for moving one property while the other two hold still;</li>\n  <li><b>Make this a key colour</b>, which pins the tone and rebuilds the rest of the ramp around it.</li>\n</ul>\n<p>That last one is the important distinction. A plain edit is an <b>override</b>: that one tone is forced to a value and the rest of the ramp ignores it. Pinning it as a key colour makes it part of the ramp's definition, and everything around it moves. Use an override to fix a single stubborn tone; pin a key colour when the whole ramp is heading the wrong way.</p>\n<h2 id=\"h-curves\" data-nav=\"Working with the curves\">Working with the curves</h2>\n<p><b>Perceptual curves \u00b7 OKLCH</b> shows the ramp as three graphs \u2014 lightness, chroma, hue \u2014 with one point per tone. This is the fastest way to see what is wrong with a ramp, because the eye catches a kink in a line long before it catches an odd colour in a row of swatches.</p>\n<h3 id=\"h-curves-read\">Reading them</h3>\n<dl>\n  <dt>Lightness</dt>\n  <dd>Should fall smoothly from 50 to 950. A flat stretch means two tones that will read as the same colour in a UI. A cliff means a jump users will notice \u2014 often right where a border meets a fill.</dd>\n  <dt>Chroma</dt>\n  <dd>Normally a hump: low at the pale end, peaking somewhere around 500\u2013600, falling again into the darks. A chroma line that is clipped flat at the top is telling you the gamut ran out \u2014 those tones are as saturated as sRGB allows, and pushing further changes nothing.</dd>\n  <dt>Hue</dt>\n  <dd>Usually near-flat, bending a few degrees at the ends if you set a hue shift. A sudden swing in the middle almost always means two key colours with genuinely different hues, and the ramp is travelling between them.</dd>\n</dl>\n<h3 id=\"h-curves-drag\">Dragging a point</h3>\n<p>Drag any point up or down. The colour updates as you move \u2014 the swatches above change under your hand, not after you let go. Pinned key colours are drawn differently and hold their value; they are the anchors the rest bends around.</p>\n<p>Two buttons appear next to the section title as soon as you touch a curve: <b>Save ramp</b> and <b>Discard edits</b>. Nothing is committed until you press one. Dragging a curve does not open the tone editor \u2014 the two ways of working stay out of each other's way.</p>\n<div class=\"note\">\n  <p>A practical order that works: get the lightness line smooth first, because it decides legibility. Then shape chroma for the feel you want. Touch hue last, and sparingly \u2014 a couple of degrees is a lot.</p>\n</div>\n<h2 id=\"h-contrast\" data-nav=\"Contrast and accessibility\">Contrast and accessibility</h2>\n<p>Every tone reports its contrast against white and against black, as a WCAG 2.1 ratio. The thresholds worth remembering: <b>4.5:1</b> is AA for body text, <b>3:1</b> is AA for large text and for interface graphics like icons and input borders, and <b>7:1</b> is AAA.</p>\n<p>The <b>Tone-against-tone matrix</b> checks every tone against every other tone in the same ramp. This answers the question that actually comes up in practice \u2014 <i>can I put my 700 text on my 100 background?</i> \u2014 which the white-and-black columns cannot.</p>\n<p>On the <b>Export ramps</b> screen the <b>Overlay</b> dropdown writes a number into every cell of the grid: hex, WCAG on white, WCAG on black, or the raw L, C and H. Switching it to <i>WCAG on white</i> across all your ramps is the quickest audit there is \u2014 you see at a glance which step is the first safe one for text in every hue.</p>\n<h2 id=\"h-preview\" data-nav=\"Interface preview\">Interface preview</h2>\n<p>The <b>Interface preview</b> tab builds a small interface \u2014 buttons, cards, form fields, states \u2014 entirely out of the selected ramp. Numbers tell you a ramp is legal; this tells you whether it is pleasant. A ramp can pass every contrast check and still feel muddy in use, and this is where that shows up.</p>\n<h2 id=\"h-save\" data-group=\"Keeping work\" data-nav=\"Saving and loading\">Saving and loading</h2>\n<p><b>Save work</b> asks for a name and downloads a snapshot: every ramp, its key colours, its shape settings, its hand edits, and the Figma provenance for anything imported. <b>Load</b> brings one back.</p>\n<p>The file is plain readable JSON, so you can diff it, keep it in a repository, or read it when something goes wrong. It carries a <b>checksum</b> over its contents, so a file that got truncated on a copy or edited by hand is spotted when you open it. Reformatting is fine \u2014 the checksum is taken over the data, not the whitespace \u2014 but a changed value is reported, and you decide whether to load anyway.</p>\n<p>Loading replaces everything on the desk, and says so first. Ramps that cannot be read are skipped individually rather than failing the whole file.</p>\n<div class=\"note warm\">\n  <p>The desk itself survives a reload of the page for the session, but not a closed tab. If the work matters, save it.</p>\n</div>\n<h2 id=\"h-export\" data-group=\"Getting colours out\" data-nav=\"Export formats\">Export formats</h2>\n<p><b>Export ramps</b> shows every ramp as a grid and offers four formats:</p>\n<dl>\n  <dt>Figma REST API</dt>\n  <dd>The real request body for <code>POST /v1/files/:key/variables</code>. Four arrays tied together by temporary ids so the whole set lands in one atomic call. Enterprise organisations only \u2014 that endpoint is not available on other plans.</dd>\n  <dt>Design tokens</dt>\n  <dd>W3C DTCG format. What Tokens Studio and Style Dictionary consume, and the most portable thing here.</dd>\n  <dt>JSON</dt>\n  <dd>Plain nested objects. For your own scripts.</dd>\n  <dt>CSS hex</dt>\n  <dd>Custom properties, one per tone.</dd>\n</dl>\n<p>All four follow the collection and group you chose in the write panel, so what you copy matches what would be written.</p>\n<h2 id=\"h-write\" data-nav=\"Writing into a Figma file\">Writing into a Figma file</h2>\n<p>The panel at the bottom of the export screen writes variables straight into a file, in three steps.</p>\n<h3 id=\"h-write-connect\">1 \u00b7 Connect and check</h3>\n<p>Paste a file link and press <b>Connect</b>. The tool opens the file, proves it can actually create a variable \u2014 by making one and removing it immediately, which is the only honest test \u2014 and reads every collection with its modes.</p>\n<h3 id=\"h-write-where\">Where to write</h3>\n<p>Then you choose the address:</p>\n<ul>\n  <li><b>Collection</b> \u2014 any collection in the file, or <i>New collection\u2026</i> with a name of your own.</li>\n  <li><b>Group</b> \u2014 optional. Leave it empty and ramps sit at the root of the collection as <code>Blue/500</code>. Nesting works: <code>Core/Colours</code>.</li>\n  <li><b>Mode</b> \u2014 only appears when the collection has more than one, so you cannot flood a dark theme with light values by accident.</li>\n</ul>\n<p>A line underneath shows exactly what a variable will be called and how many ramps already sit at that address. If ramps on the desk came from this file, the address is pre-filled from where they came from.</p>\n<h3 id=\"h-write-list\">2 \u00b7 What will be written</h3>\n<p>One row per ramp, each with a tag saying what will happen: <b>New</b>, <b>Update</b>, <b>Renamed</b>, <b>Updated in place</b>. Unticked rows go pale, drop all their controls and carry a single <b>Will be skipped</b> tag.</p>\n<p>A warm <b>9 in file</b> marker appears when the group in Figma does not hold exactly eleven variables. Hover it to see how many will be created and how many sit outside the 50\u2026950 scale.</p>\n<h3 id=\"h-write-conflicts\">Name conflicts</h3>\n<p>If a ramp's name is already in use at that address, a dialog opens with four choices per ramp: update the existing values, rename yours, rename the one in Figma, or skip it. The explanation under the dropdown changes with the choice, and a name field appears for the two renames.</p>\n<h3 id=\"h-write-go\">3 \u00b7 Write</h3>\n<p>Ramps are written one call per ramp, so a failure can be pinned to a single ramp rather than leaving you guessing. Afterwards everything is <b>read back out of the file and compared</b> \u2014 names, values, ids \u2014 and the result says how many matched. Anything that went differently but did not fail is reported too.</p>\n<h2 id=\"h-overwrite\" data-group=\"The reskin\" data-nav=\"Overwriting in place\">Overwriting in place</h2>\n<p class=\"lead\">This is the feature the rest of the tool exists to serve. Read it once even if you skip everything else.</p>\n<h3 id=\"h-overwrite-why\">The problem it solves</h3>\n<p>You are rebranding. A Figma file holds a colour system, and hundreds of layers point at those variables \u2014 fills, strokes, effects. Other variables alias them. Other files consume them through the published library. The new palette is ready.</p>\n<p>Write it as a new set of variables and you have created a second colour system next to the first. Nothing in the file repaints. Every layer still points at the old variables, and someone has to walk through the file relinking them by hand. That is days of work, and it is the kind of work that gets nine tenths done and then quietly abandoned.</p>\n<h3 id=\"h-overwrite-how\">What it does instead</h3>\n<p>Tick <b>Overwrite ramp in Figma</b> on a row and that ramp is written onto the very variables it was read from, addressed by <b>id</b> rather than by name.</p>\n<p>A variable id in Figma survives both a rename and a value change. So when the colour underneath changes, everything that already points at that id keeps pointing at it:</p>\n<ul>\n  <li>fills, strokes and effects on layers \u2014 they repaint on their own, immediately;</li>\n  <li>aliases from other variables \u2014 semantic tokens like <code>surface/raised</code> pointing at <code>Colours/grey/100</code> keep resolving;</li>\n  <li>the published key other files use \u2014 library consumers pick the change up on update, with no relinking.</li>\n</ul>\n<p>Nothing needs to be relinked because nothing was ever unlinked. That is the whole trick, and it is why the tool goes to the trouble of remembering ids at import.</p>\n<h3 id=\"h-overwrite-rename\">Renaming while overwriting</h3>\n<p>You can rename the ramp too. A rename keeps the same ids, so the links hold exactly as before \u2014 <code>Colours/blue/500</code> becomes <code>Colours/lavander/500</code>, and every layer using it carries on without noticing.</p>\n<div class=\"note warm\">\n  <p>A group in Figma is only a prefix in a variable's name, not a container. So anything in that group which is <b>not</b> part of the ramp \u2014 a stray <code>colours/blue/base</code>, say \u2014 does not travel with the rename. It stays behind under the old prefix with its old colour. The tool never deletes it and always tells you it happened.</p>\n</div>\n<h3 id=\"h-overwrite-uneven\">When the group is not eleven variables</h3>\n<p>Real files are untidy. A group might hold nine variables, or twelve, or use a 1\u201312 scale from another system.</p>\n<ul>\n  <li><b>Fewer than eleven</b> \u2014 the ones that were imported are overwritten, and the missing tones are created alongside them. You end up with a complete ramp and the existing links intact.</li>\n  <li><b>More than eleven</b> \u2014 the eleven the ramp holds are overwritten; the extras are left exactly as they are, still carrying the old colours. They are listed by name in the result.</li>\n</ul>\n<p>Either way you get a full 50\u2026950 ramp without breaking a single link, and the leftovers can be tidied on the semantic layer afterwards. That is a far smaller job than relinking a file.</p>\n<h3 id=\"h-overwrite-when\">When it is offered \u2014 and when it is not</h3>\n<p>The switch is only available when overwriting can actually work. Otherwise it is greyed out and explains itself:</p>\n<ul>\n  <li><b>Different file</b> \u2014 the ramp was read from another file, and ids are meaningless outside the file that issued them.</li>\n  <li><b>Grew from a single colour</b> \u2014 there is no set of eleven variables to write onto.</li>\n  <li><b>No file connected</b> \u2014 connect one first.</li>\n</ul>\n<p>It is off by default. Overwriting variables in a shared file is not something to do by accident.</p>\n<h3 id=\"h-overwrite-undo\">Getting back</h3>\n<p>There is no undo inside this tool. Once values are written, the old colours are gone from the file. <b>Figma's own undo</b> is the way back, in the Figma window, straight after the write.</p>\n<p>Before a real reskin: duplicate the file, or work on a branch. Then a bad result costs a click rather than an afternoon.</p>\n<h2 id=\"h-warnings\" data-nav=\"The warnings before a write\">The warnings before a write</h2>\n<p>Pressing the write button opens <b>Before writing</b> whenever there is something worth knowing. Each ramp with something to say gets a card, and each consequence gets a plain sentence and a label:</p>\n<dl>\n  <dt>Overwrites in place</dt>\n  <dd>Ids stay, links hold, but the old colours are gone.</dd>\n  <dt>Renames variables</dt>\n  <dd>From the old Figma name to the new one.</dd>\n  <dt>Completes the scale</dt>\n  <dd>Fewer tones were imported than the ramp has; the rest will be created.</dd>\n  <dt>Leaves extras behind</dt>\n  <dd>Variables outside the 50\u2026950 scale, untouched and still old.</dd>\n  <dt>Writes a duplicate</dt>\n  <dd>The ramp came from this file but Overwrite is off, so nothing in the file will repaint. Usually a sign you meant to tick the box.</dd>\n  <dt>Uneven set in the file \u00b7 Renames the existing ramp</dt>\n  <dd>For ramps written by name rather than by id.</dd>\n</dl>\n<p>Every card has a checkbox. Drop a doubtful ramp from the write right there \u2014 the totals and the button update as you go, and the list behind the dialog follows. If there is nothing to warn about, the write simply runs.</p>\n<h2 id=\"h-recipes\" data-group=\"Reference\" data-nav=\"Two common jobs\">Two common jobs</h2>\n<h3 id=\"h-recipe-reskin\">Reskinning an existing file</h3>\n<ol class=\"steps\">\n  <li>Duplicate the Figma file, or open a branch.</li>\n  <li><b>From Figma</b> \u2192 paste the link \u2192 tick the groups that make up the current system \u2192 import.</li>\n  <li>Reshape each ramp: new key colours, or the curves, or both.</li>\n  <li><b>Export ramps</b> \u2192 connect the same file. The address is pre-filled from where the ramps came from.</li>\n  <li>Tick <b>Overwrite ramp in Figma</b> on every ramp you want to land on its originals.</li>\n  <li>Read the warnings, then write. Check the file \u2014 layers should already be repainted.</li>\n</ol>\n<h3 id=\"h-recipe-brand\">A new system from a brand image</h3>\n<ol class=\"steps\">\n  <li><b>From an image</b> \u2192 drop the brand board in.</li>\n  <li>Set how many key colours you want; drag markers on the plot until the crosses sit on the colours you recognise.</li>\n  <li>Leave <i>Also return the dominant neutral</i> on \u2014 you will want a grey ramp.</li>\n  <li><b>Generate N ramps</b>, then check the contrast matrix on each and fix what fails.</li>\n  <li><b>Save work</b>, then export or write to Figma.</li>\n</ol>\n<h2 id=\"h-trouble\" data-nav=\"When something is wrong\">When something is wrong</h2>\n<dl>\n  <dt>Chroma will not go any higher</dt>\n  <dd>You are at the sRGB gamut edge. The curve is flat there because the colour does not exist on screen.</dd>\n  <dt>A new group appeared in Figma instead of the old one changing</dt>\n  <dd>Overwrite was off for that ramp, or the connected file is not the file it was imported from.</dd>\n  <dt>The write panel says it cannot reach Figma</dt>\n  <dd>Check three things, in order. The Cowork session must be running <b>On my computer</b> \u2014 it asks where to run a task before it starts, and a cloud session has no route to a server on your own machine. The Figma <b>desktop</b> app must be open with its MCP server enabled. The Figma connector must be authorised in Claude. Copy or Download still give you the full payload meanwhile.</dd>\n  <dt>An imported ramp has hand edits everywhere</dt>\n  <dd>Expected. The file's colours are kept exactly, and anything the generator would not have produced is preserved as an override. Pin a different key colour to bring it back under the generator's control.</dd>\n  <dt>The snapshot says it changed since it was saved</dt>\n  <dd>The checksum does not match the contents. Loading is still allowed \u2014 what you get is whatever the file actually says.</dd>\n</dl>\n<h2 id=\"h-credits\" data-nav=\"Where the maths comes from\">Where the maths comes from</h2>\n<ul>\n  <li>Bj\u00f6rn Ottosson, <i>A perceptual color space for image processing</i> \u2014 the OKLab transforms used throughout.</li>\n  <li>Stripe, <i>Designing accessible color systems</i> \u2014 the case for building ramps on a perceptual lightness axis.</li>\n  <li>WCAG 2.1 \u2014 the contrast ratio definition behind every number the tool reports.</li>\n  <li>W3C Design Tokens Community Group format \u2014 the shape of the token export.</li>\n</ul>";

/* ============================================================
   HELP — one document, a contents list that stays put
   ============================================================ */
function helpOpen(){
  const wrap = el('div','help-wrap');
  const box = el('div','help-box');

  const hd = el('div','help-hd');
  hd.appendChild(el('h3',null,'Figma Colour Ramps — help'));
  const x = el('button','btn sm','Close');
  hd.appendChild(x);
  box.appendChild(hd);

  const body = el('div','help-body');
  const nav = el('div','help-nav');
  const doc = el('div','help-doc');
  doc.innerHTML = HELP_HTML;
  body.appendChild(nav); body.appendChild(doc);
  box.appendChild(body);

  /* the contents are built from the document, so they can never
     point at a heading that is not there */
  const heads = [].slice.call(doc.querySelectorAll('h2[id],h3[id]'));
  const links = heads.map(function(h){
    const a = el('a', h.tagName === 'H3' ? 'sub' : null, escHtml(h.dataset.nav || h.textContent));
    a.href = '#' + h.id;
    a.onclick = function(ev){
      ev.preventDefault();
      doc.scrollTop = h.offsetTop - doc.offsetTop - 6;
    };
    if (h.dataset.group){
      const g = el('div','help-grp', escHtml(h.dataset.group));
      nav.appendChild(g);
    }
    nav.appendChild(a);
    return { a:a, h:h };
  });

  const mark = function(){
    const y = doc.scrollTop + 24;
    let cur = links[0];
    links.forEach(function(l){ if (l.h.offsetTop - doc.offsetTop <= y) cur = l; });
    links.forEach(function(l){ l.a.classList.toggle('on', l === cur); });
    /* keep the current entry in view without moving the prose */
    if (cur && cur.a.offsetTop < nav.scrollTop) nav.scrollTop = cur.a.offsetTop - 8;
    else if (cur && cur.a.offsetTop + cur.a.offsetHeight > nav.scrollTop + nav.clientHeight)
      nav.scrollTop = cur.a.offsetTop + cur.a.offsetHeight - nav.clientHeight + 8;
  };
  doc.onscroll = mark;
  mark();

  const shut = function(){
    if (wrap.parentNode) document.body.removeChild(wrap);
    document.removeEventListener('keydown', esc);
  };
  const esc = function(ev){ if (ev.key === 'Escape') shut(); };
  document.addEventListener('keydown', esc);
  x.onclick = shut;
  wrap.onclick = function(ev){ if (ev.target === wrap) shut(); };

  wrap.appendChild(box);
  document.body.appendChild(wrap);
  doc.focus();
}
$('#btnHelp').onclick = helpOpen;
$('#btnExport').onclick = function(){ state.tab='all'; renderStage(); };
$('#btnBack').onclick = function(){ state.tab='ramp'; renderStage(); };
$('#btnSave').onclick = snapSave;
$('#btnClearAll').onclick = function(){
  const n = state.palettes.length;
  if (!n) return;
  const edited = state.palettes.filter(function(p){ return Object.keys(p.overrides||{}).length; }).length;
  const linked = state.palettes.filter(function(p){ return fromFigma(p); }).length;
  const wrap = el('div','modal-wrap');
  const box = el('div','modal'); box.style.width='420px';
  box.appendChild(el('h3',null,'Clear all ramps?'));
  const bits = [];
  if (edited) bits.push('<b>' + edited + '</b> carr' + (edited===1?'ies':'y') + ' hand edits');
  if (linked) bits.push('<b>' + linked + '</b> ' + (linked===1?'is':'are') + ' linked to Figma');
  box.appendChild(el('p','hint',
    'All <b>' + n + '</b> ramp' + (n===1?'':'s') + ' go and the desk goes back to empty.'
    + (bits.length ? ' ' + bits.join(' and ') + '.' : '')
    + ' Anything you have not saved or exported cannot be brought back.'));
  const row = el('div','row'); row.style.marginTop='14px';
  const ok = el('button','btn primary','Clear all');
  ok.onclick = function(){
    state.palettes = []; state.selected = null; state.workName = '';
    draft = defaultDraft();
    maybeReopenCreate();
    document.body.removeChild(wrap);
    save(); renderTiles(); renderAll();
    toast('All ramps cleared');
  };
  const no = el('button','btn','Cancel');
  no.onclick = function(){ document.body.removeChild(wrap); };
  row.appendChild(ok); row.appendChild(no);
  box.appendChild(row); wrap.appendChild(box);
  wrap.onclick = function(ev){ if (ev.target===wrap) document.body.removeChild(wrap); };
  document.body.appendChild(wrap);
  setTimeout(function(){ ok.focus(); }, 0);
};
$('#btnLoad').onclick = snapLoad;
document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.tab; renderStage(); };
});

function autoName(hex){
  const lch = hexToOklch(hex); if(!lch) return 'Ramp';
  if (lch[1] < 0.02) return 'Neutral';
  const h = lch[2];
  const names = [[15,'Red'],[45,'Orange'],[75,'Yellow'],[105,'Lime'],[150,'Green'],[190,'Teal'],[220,'Cyan'],[265,'Blue'],[295,'Violet'],[330,'Magenta'],[360,'Red']];
  for (let i=0;i<names.length;i++) if (h <= names[i][0]) return names[i][1];
  return 'Ramp';
}

/* ---- seed ---- */
const STARTER = [
  {name:'Red',     keys:[{step:500, hex:'#E5484D'}]},
  {name:'Orange',  keys:[{step:500, hex:'#F0770B'}]},
  {name:'Green',   keys:[{step:500, hex:'#22A860'}]},
  {name:'Blue',    keys:[{step:500, hex:'#3B82F6'}]},
  {name:'Neutral', keys:[{step:500, hex:'#7A7A83'}]}
];

/* Robust boot: a corrupt or empty saved state must never leave the
   tool blank. */
function boot(){
  try { load(); } catch(e){ state.palettes=[]; }
  if (!Array.isArray(state.palettes)) state.palettes = [];
  if (state.pendingFigmaUrl){ fig().url = state.pendingFigmaUrl; }
  if (!currentPalette()) state.selected = null;
  state.renaming = false;
  /* the panel starts open on an empty desk and closed when a session
     is being resumed with work already in it */
  if (state.palettes.length){ state.createOpen = false; state.autoCollapsed = true; }
  draft = defaultDraft();
  renderTiles();
  save();
  renderAll();
}
try { boot(); }
catch(err){
  try {
    state = { palettes:[], selected:null, tab:'ramp', editorMode:'controls', selectedTone:null, pending:null,
      curveSnapshot:null, figma:null, shapeOpen:false, renaming:false,
      createOpen:true, autoCollapsed:false, userSetCreate:false, workName:'' };
    try{ sessionStorage.removeItem(SS_KEY); }catch(e){}
    draft=defaultDraft(); renderTiles(); renderAll();
  } catch(e2){
    document.getElementById('stage').innerHTML =
      '<div class="empty"><h3>Something went wrong starting up</h3><p class="hint">' + String(err && err.message || err) + '</p></div>';
  }
}
